[build]
  publish = "."

# No catch-all redirect. This is a multi-page static site: a
# `/* -> /index.html 200` rule (as on the sibling incardible.in site) would
# shadow /privacy, /terms and /support and swallow genuine 404s.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Short aliases for the smart download link, so an ad or a poster can carry
# whichever reads best. /get/ itself does the platform detection.
[[redirects]]
  from = "/download"
  to = "/get/"
  status = 301

[[redirects]]
  from = "/app"
  to = "/get/"
  status = 301
