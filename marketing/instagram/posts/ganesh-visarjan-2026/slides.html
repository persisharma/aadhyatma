<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><title>Ganesh Visarjan Carousel</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--parchment:#F3E7C9;--soft:#F8EFD6;--hi:#F6ECD0;--ink:#1A0E03;--ink-soft:#5A3A1E;--muted:#6E5230;--saffron:#B8621B;--sdeep:#8A3E0B;--gold:#A67C34;--divider:rgba(138,62,11,.18)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--parchment)}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden}
.slide svg.scene{position:absolute;inset:0}
.brand{position:absolute;top:48px;left:52px;display:flex;align-items:center;gap:16px;padding:8px 26px 8px 8px;border-radius:999px;background:rgba(248,239,214,.82);border:1.5px solid var(--divider)}
.brand img{width:68px;height:68px;border-radius:50%;border:2px solid var(--gold)}
.brand b{font:700 36px 'Noto Serif Devanagari';color:var(--ink)}
.count{position:absolute;top:62px;right:52px;padding:8px 24px;border-radius:999px;background:rgba(248,239,214,.85);border:1.5px solid var(--divider);font:600 italic 34px 'Cormorant Garamond';color:var(--sdeep)}
.bubble{position:absolute;padding:28px 46px 34px;border-radius:46px;background:linear-gradient(160deg,#A34E12,var(--sdeep));color:var(--hi);font:700 52px/1.45 'Noto Serif Devanagari';text-align:center;box-shadow:0 10px 28px rgba(60,30,8,.3),inset 0 0 0 3px rgba(246,236,208,.25);white-space:nowrap}
.bubble:after{content:"";position:absolute;bottom:-34px;border:22px solid transparent;border-top:36px solid var(--sdeep)}
.tail-l:after{left:80px}.tail-r:after{right:80px}.tail-c:after{left:50%;margin-left:-22px}
.foot{position:absolute;padding:18px 26px;border-radius:24px;background:rgba(248,239,214,.92);border:1.5px solid var(--divider);text-align:center}
.foot .l1{font:600 28px/1.5 'Noto Serif Devanagari';color:var(--ink-soft)}
.foot .l2{margin-top:4px;white-space:nowrap;font:600 italic 21px 'Cormorant Garamond';color:var(--sdeep);letter-spacing:.5px}
.slide:not(.on){display:none}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
 <defs>
