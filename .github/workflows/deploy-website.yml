name: Deploy website

# The marketing site at vedansh.app. Deploys run here rather than from a laptop
# because Netlify's API hosts are unreachable behind the corporate proxy.
on:
  push:
    branches: [main, feat/vedansh-app-website]
    paths: ['website/**', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Netlify
        working-directory: website
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir . --message "${GITHUB_SHA::7} via Actions"

      - name: Attach custom domain and provision certificate
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          echo "--- site state ---"
          curl -s "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $TOKEN" \
            | jq '{name, account_slug, account_type, custom_domain, domain_aliases, password: (.password != null), sso_login, prerender, published_deploy: .published_deploy.state}'

          echo "--- attach domain ---"
          curl -s -X PATCH "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"custom_domain":"vedansh.app","domain_aliases":["www.vedansh.app"]}' \
            -w '\nHTTP %{http_code}\n' | tail -20

          echo "--- provision certificate ---"
          # Needs DNS already pointing at Netlify; a failure is not fatal.
          curl -s -X POST "https://api.netlify.com/api/v1/sites/$SITE_ID/ssl" \
            -H "Authorization: Bearer $TOKEN" -w '\nHTTP %{http_code}\n' | tail -5

          # This one site serves public marketing pages, so the visitor-facing SSO
          # gate Netlify enables on new sites is cleared here. Site scope only —
          # account-wide SSO is left exactly as it is.
          echo "--- open this site to visitors ---"
          curl -s -X PATCH "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"sso_login":false,"sso_login_context":"none"}' \
            | jq '{sso_login, sso_login_context, account_sso_login, custom_domain, ssl, ssl_status}'

          echo "--- public reachability from the runner ---"
          for u in https://vedansh-app.netlify.app/ https://vedansh.app/; do
            printf '%s -> ' "$u"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 "$u" || echo "unreachable"
          done
