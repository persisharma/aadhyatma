name: Deploy website

# The marketing site at vedansh.app. Deploys run here rather than from a laptop
# because Netlify's API hosts are unreachable behind the corporate proxy.
on:
  push:
    branches: [main, feat/vedansh-app-website]
    paths: ['website/**', '.github/workflows/deploy-website.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Inline the stylesheet
        working-directory: website
        run: python3 ../.github/scripts/inline-css.py

      - name: Deploy to Netlify
        working-directory: website
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --prod --dir . --message "${GITHUB_SHA::7} via Actions"

      - name: Attach custom domain and provision certificate
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -uo pipefail
          echo "--- site state ---"
          curl -s "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $TOKEN" \
            | jq '{name, account_slug, account_type, custom_domain, domain_aliases, password: (.password != null), sso_login, prerender, published_deploy: .published_deploy.state}'

          echo "--- attach domain ---"
          curl -s -X PATCH "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"custom_domain":"vedansh.app","domain_aliases":["www.vedansh.app"]}' \
            -w '\nHTTP %{http_code}\n' | tail -20

          echo "--- provision certificate ---"
          # Needs DNS already pointing at Netlify; a failure is not fatal.
          curl -s -X POST "https://api.netlify.com/api/v1/sites/$SITE_ID/ssl" \
            -H "Authorization: Bearer $TOKEN" -w '\nHTTP %{http_code}\n' | tail -5

          # Netlify gates new accounts' sites behind an SSO login for visitors.
          # The site inherits it from the account, so a site-scoped clear alone
          # does nothing — both scopes are cleared. The account holds this one
          # site and it serves public marketing pages; requested by the owner.
          echo "--- open this site to visitors ---"
          ACCOUNT_ID=$(curl -s "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $TOKEN" | jq -r .account_id)
          curl -s -X PUT "https://api.netlify.com/api/v1/accounts/$ACCOUNT_ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"sso_login":false,"sso_login_context":"none"}' \
            | jq '{slug, sso_login, sso_login_context}'
          curl -s -X PATCH "https://api.netlify.com/api/v1/sites/$SITE_ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"sso_login":false,"sso_login_context":"none"}' \
            | jq '{sso_login, sso_login_context, account_sso_login, custom_domain, ssl, ssl_status}'

          echo "--- public reachability from the runner ---"
          for u in https://vedansh-app.netlify.app/ https://vedansh.app/; do
            printf '%s -> ' "$u"
            curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 "$u" || echo "unreachable"
          done

      - name: Tell IndexNow the pages changed
        # Bing, Yandex, Naver, Seznam and the AI engines that read Bing's index
        # re-crawl on this ping instead of on their own schedule. The key is
        # public by design (it is served from the site). Never fatal.
        run: |
          curl -s -o /dev/null -w 'indexnow: HTTP %{http_code}\n' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"vedansh.app","key":"2565c7fc92e3a91c995996d5d3d73f01","keyLocation":"https://vedansh.app/2565c7fc92e3a91c995996d5d3d73f01.txt","urlList":[
              "https://vedansh.app/","https://vedansh.app/hi/",
              "https://vedansh.app/support/","https://vedansh.app/hi/support/",
              "https://vedansh.app/privacy/","https://vedansh.app/hi/privacy/",
              "https://vedansh.app/terms/","https://vedansh.app/hi/terms/"]}' || true
