name: CI

# Test gate for the mobile app. Runs typecheck + the Jest/tsx suites so loop PRs
# (including saved reader-art style documents) get a real red/green signal.

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'docs/content-parity/reader-illustration*.md'
      - 'scripts/verify-kids-story-assets.mjs'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'docs/content-parity/reader-illustration*.md'
      - 'scripts/verify-kids-story-assets.mjs'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite finishes in a few minutes; cap the job so a hung step fails fast
    # instead of burning the runner's full 6h ceiling (see the 2026-10-16 stall).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Reader/component tests
        run: npm run test:readers

      - name: Engine tests
        run: npm run test:engine

      - name: Observance date verification (festival dates vs muhurta-based astronomy)
        run: npm run verify:observances

      - name: Data tests
        run: npm run test:data

      - name: Production iOS export asset map
        run: npx expo export --platform ios --dump-assetmap --output-dir ../tmp/ci-kids-story-ios

      - name: Production Android export asset map
        run: npx expo export --platform android --dump-assetmap --output-dir ../tmp/ci-kids-story-android

      - name: Kids Stories CDN availability and no bundled artwork
        working-directory: .
        run: node scripts/verify-kids-story-assets.mjs --cdn --assetmap tmp/ci-kids-story-ios/assetmap.json --assetmap tmp/ci-kids-story-android/assetmap.json --output tmp/ci-kids-story-asset-gate.json

      - name: Retain Kids Stories asset gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-story-asset-gate
          path: tmp/ci-kids-story-asset-gate.json
          if-no-files-found: ignore
