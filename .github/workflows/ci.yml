name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (primary gate)
        run: npm run typecheck

      # node:assert suites run via tsx. Excludes the Jest-owned dirs
      # (screens/utils/contexts/components __tests__ — see jest.config.js).
      - name: Unit tests (node:assert via tsx)
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r f; do
            echo "▶ $f"
            if ! NODE_OPTIONS="--require $PWD/scripts/test-asset-stub.cjs" npx tsx "$f"; then
              echo "::error file=$f::test failed"
              fail=1
            fi
          done < <(find src \( -name '*.test.ts' -o -name '*.test.tsx' \) \
                   | grep -vE '/(screens|utils|contexts|components)/__tests__/' | sort)
          [ "$fail" -eq 0 ] || { echo "One or more tsx tests failed."; exit 1; }
          echo "All tsx tests passed."

      - name: Reader/component tests (Jest)
        run: npm run test:readers
