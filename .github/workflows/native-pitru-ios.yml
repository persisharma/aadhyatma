name: Native iOS Pitru Smaran journey

# Release (Hermes bytecode) build on the iOS Simulator, then the shared
# पितृ स्मरण Maestro journey: add an entry through the pickers, cold relaunch,
# list row with its solved date, both stages of the detail screen's staged
# reveal, the vidhi hand-off, a re-entry served from the persisted solve cache,
# and delete. Scoped to the cooperative solve hooks and their screens so it runs
# only when that path changes. Simulator evidence is not low-end Android timing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/src/panchang/usePitruSmaranSolves.ts'
      - 'mobile/src/panchang/useJanmaTithi.ts'
      - 'mobile/src/panchang/pitruSmaranSolves.ts'
      - 'mobile/src/panchang/pitruSmaran.ts'
      - 'mobile/src/panchang/backgroundWork.ts'
      - 'mobile/src/screens/PitruSmaran*.tsx'
      - 'mobile/src/screens/JanmaTithi*.tsx'
      - 'mobile/.maestro/pitru-smaran.yaml'
      - '.github/workflows/native-pitru-ios.yml'

permissions:
  contents: read

concurrency:
  group: native-pitru-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      NATIVE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
      NATIVE_SMOKE_DRIVER_CHECK: '1'
      NATIVE_SMOKE_SCOPE: host
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select matching XCTest toolchain
        run: |
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Install pinned native test driver
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/pitru-maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/pitru-maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/pitru-maestro.zip" -d "$RUNNER_TEMP/pitru-tools"
          echo "$RUNNER_TEMP/pitru-tools/maestro/bin" >> "$GITHUB_PATH"
      - name: Record tested head and toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/native-output"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/native-output/tested-head.txt"
          xcodebuild -version | tee "$GITHUB_WORKSPACE/native-output/toolchain.txt"
      - name: Generate unsigned simulator project
        run: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        run: pod install --project-directory=ios
      - name: Build Release, install and launch on iOS Simulator
        run: bash scripts/native-ios-smoke.sh
      - name: Pitru Smaran native journey
        run: |
          node scripts/run-native-diagnostic.cjs --timeout-ms 1500000 maestro --device "$SIMULATOR_UDID" test \
            --config .maestro/config.yaml --format junit --output "$GITHUB_WORKSPACE/native-output/pitru-smaran.xml" \
            .maestro/pitru-smaran.yaml 2>&1 | tee "$GITHUB_WORKSPACE/native-output/pitru-smaran.log"
      - name: Capture failure screen and device log
        if: failure() && env.SIMULATOR_UDID != ''
        run: |
          node scripts/run-native-diagnostic.cjs xcrun simctl io "$SIMULATOR_UDID" screenshot "$GITHUB_WORKSPACE/native-output/pitru-failure.png" || true
          node scripts/run-native-diagnostic.cjs xcrun simctl spawn "$SIMULATOR_UDID" log show --last 5m --style compact \
            --predicate 'process == "Vedansh"' > "$GITHUB_WORKSPACE/native-output/pitru-device.log" 2>&1 || true
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pitru-ios-${{ github.run_id }}
          path: |
            native-output/*.txt
            native-output/*.log
            native-output/*.png
            native-output/*.xml
            native-output/*.ips
          retention-days: 14
          if-no-files-found: warn
      - name: Stop simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: node scripts/run-native-diagnostic.cjs xcrun simctl shutdown "$SIMULATOR_UDID"
