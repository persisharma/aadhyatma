name: Correct visit counter (one-off)

# Sets the counter total to the pre-Cloudflare seed (133) plus Cloudflare's
# unique visitors 28–30 Sep 2026 (575). MAX() so it never lowers the count.
on:
  push:
    branches: [feat/vedansh-app-website]
    paths: ['.github/workflows/counter-correct.yml']

jobs:
  correct:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          npx --yes wrangler@4 d1 execute vedansh-hits --remote --yes --command "UPDATE hits SET n = MAX(n, 708) WHERE k = 'total'"
          npx --yes wrangler@4 d1 execute vedansh-hits --remote --command "SELECT k, n FROM hits WHERE k = 'total'"
