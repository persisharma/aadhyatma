name: Publish reviewed festival paintings
on:
  workflow_dispatch:
  push:
    branches: [codex/year-round-occasion-cards]
    paths:
      - 'mobile/assets/festival-hero/**'
      - 'docs/reviews/festival-hero/provenance.json'
      - 'scripts/publish-festival-heroes.mjs'
      - '.github/workflows/festival-art-publication.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upload reviewed bytes and verify public hashes
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/publish-festival-heroes.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: festival-publication-${{ github.sha }}
          path: festival-publication/**
          if-no-files-found: error
          retention-days: 14
