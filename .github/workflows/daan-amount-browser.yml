name: Daan amount browser verification
on:
  push:
    branches: [codex/daan-amount-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm ci
        working-directory: mobile/visual/daan-amount
      - run: npx playwright install --with-deps chromium
        working-directory: mobile/visual/daan-amount
      - run: node mobile/visual/daan-amount/build.mjs
      - run: node mobile/visual/daan-amount/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daan-amount-browser-evidence
          path: mobile/visual/daan-amount/captures/
          if-no-files-found: warn
