name: Deploy website (Cloudflare Pages)

# Second host for vedansh.app. Every push deploys the same build here as well as
# to Netlify; DNS decides which one visitors reach. Skips itself until the
# CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID exist.
on:
  push:
    branches: [main, feat/vedansh-app-website]
    paths: ['website/**', '.github/workflows/deploy-website-cloudflare.yml', '.github/scripts/**']
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROJECT: vedansh
  KV_TITLE: vedansh-hits
  D1_NAME: vedansh-hits

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare credentials not set yet — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: |
          .github/scripts/build-dist.sh
          cp website/cloudflare/_headers website/cloudflare/_redirects website/dist/

      - name: Ensure the Pages project and counter storage exist
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          id=$(npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).find(x=>x.title===process.env.KV_TITLE);process.stdout.write(n?n.id:"")})')
          if [ -z "$id" ]; then
            npx --yes wrangler@4 kv namespace create "$KV_TITLE" >/dev/null
            id=$(npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(x=>x.title===process.env.KV_TITLE).id)})')
          fi
          echo "KV_ID=$id" >> "$GITHUB_ENV"
          # The counter lives in D1 (atomic increments); KV only holds the
          # pre-D1 counts the seed step below carries over.
          npx --yes wrangler@4 d1 create "$D1_NAME" >/dev/null 2>&1 || true
          db=$(npx --yes wrangler@4 d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const n=JSON.parse(s).find(x=>x.name===process.env.D1_NAME);process.stdout.write(n?n.uuid:"")})')
          [ -n "$db" ] || { echo "::error::could not create or find D1 database $D1_NAME"; exit 1; }
          cat > wrangler.toml <<EOF
          name = "$PROJECT"
          pages_build_output_dir = "dist"
          compatibility_date = "2026-09-01"

          [[kv_namespaces]]
          binding = "HITS"
          id = "$id"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "$db"
          EOF
          sed -i 's/^          //' wrangler.toml

      - name: Carry the visit counts over from KV once
        # INSERT OR IGNORE: rows that already exist (every run after the first)
        # are left alone, so this never rewinds the live count.
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: |
          sql="CREATE TABLE IF NOT EXISTS hits (k TEXT PRIMARY KEY, n INTEGER NOT NULL);"
          for k in total 'page:/' 'page:/privacy/' 'page:/terms/' 'page:/support/' 'page:/get/' 'page:/hi/' 'page:/hi/privacy/' 'page:/hi/terms/' 'page:/hi/support/'; do
            # Judge by exit status: a missing key prints an error to stdout.
            if v=$(npx --yes wrangler@4 kv key get "$k" --namespace-id "$KV_ID" --remote 2>/dev/null) && [ "$v" -ge 0 ] 2>/dev/null; then
              sql="$sql INSERT OR IGNORE INTO hits (k, n) VALUES ('$k', $v);"
            fi
          done
          npx --yes wrangler@4 d1 execute "$D1_NAME" --remote --yes --command "$sql"
          npx --yes wrangler@4 d1 execute "$D1_NAME" --remote --command "SELECT k, n FROM hits ORDER BY k"

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Attach custom domains
        # Idempotent: adding a domain that is already attached just returns it.
        # Prints each domain's status so a pending or failed validation shows
        # in the log rather than as a 522 on the live site.
        if: steps.creds.outputs.ready == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          for d in vedansh.app www.vedansh.app; do
            curl -s -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d "{\"name\":\"$d\"}" >/dev/null
          done
          curl -s "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success){console.log("API error:",JSON.stringify(j.errors));return}for(const d of j.result)console.log(d.name,"status="+d.status,"validation="+(d.validation_data&&d.validation_data.status),"verification="+(d.verification_data&&d.verification_data.status),d.verification_data&&d.verification_data.error_message||"")})'
