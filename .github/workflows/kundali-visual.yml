name: Kundali browser visual checks
on:
  pull_request:
    paths:
      - 'mobile/src/components/KundaliLearning.tsx'
      - 'mobile/src/components/KundaliArtwork.tsx'
      - 'mobile/src/components/NorthIndianChart.tsx'
      - 'mobile/visual/kundali/**'
      - '.github/workflows/kundali-visual.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Install isolated browser-test dependencies without changing the app lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts react-dom@19.1.0 react-native-web@0.21.0 vite@6.1.0 playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Render production components across languages and sizes
        run: node visual/kundali/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kundali-browser-visuals
          path: mobile/visual-output/kundali
          if-no-files-found: warn
