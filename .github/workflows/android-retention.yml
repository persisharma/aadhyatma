name: Android retention
on:
  pull_request:
    paths:
      - 'mobile/src/retention/**'
      - 'services/retention/**'
      - '.github/workflows/android-retention.yml'
jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types --test services/retention/retention.test.mjs
