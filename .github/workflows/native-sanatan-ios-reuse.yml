name: Sanatan iOS saved-binary acceptance
on:
  push:
    branches: ['codex/sanatan-ios-native-qa']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sanatan-ios-saved-binary
  cancel-in-progress: true
jobs:
  ios:
    strategy:
      fail-fast: false
      matrix:
        phase: [collections, standard, enlarged]
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: mobile
    env:
      CI: '1'
      SANATAN_REBUNDLE_JS: '1'
      SANATAN_NATIVE_PHASES: ${{ matrix.phase }}
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify unchanged production source
        run: |
          git fetch --no-tags --depth=1 origin 62af7ebf11ca8232c325e45b4a29ba7623ddff37
          git fetch --no-tags --depth=1 origin a469ea3696f29baf588b3783fee83c9c1e000202
          git diff --exit-code 62af7ebf11ca8232c325e45b4a29ba7623ddff37 HEAD -- src assets App.tsx index.ts app.json app.config.js package.json package-lock.json plugins modules babel.config.js metro.config.js
          node scripts/sanatan-native-sdk-compatible.cjs
      - uses: actions/download-artifact@v4
        with:
          name: sanatan-ios-42168692889
          run-id: 42168692889
          github-token: ${{ github.token }}
          path: native-reuse
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install verified simulator app and exercise Sanatan
        run: bash scripts/native-sanatan-ios-reuse.sh
      - name: Retain native screens and driver results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanatan-ios-review-${{ github.run_id }}-${{ matrix.phase }}
          path: native-sanatan-output/**
          retention-days: 7
          if-no-files-found: warn
      - name: Expose selected native evidence for visual review
        if: always()
        env:
          QA_PHASE: ${{ matrix.phase }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,json,os
          root=Path('../native-sanatan-output')
          phase=os.environ['QA_PHASE']
          names={'collections':['sanatan-entry-home.png','sanatan-entry-hub.png'],
                 'standard':['sanatan-collection-Gujarati-Large-local.png','sanatan-collection-Kannada-Large-local.png'],
                 'enlarged':['sanatan-home-frame-Hindi-Large-local.png','sanatan-diagram-Kannada-Large-local.png']}[phase]
          print('NATIVE_RESULT', (root/'result.json').read_text() if (root/'result.json').exists() else 'not reached')
          for name in names:
              matches=list(root.rglob(name))
              if not matches:
                  matches=list(root.rglob(name.replace('-local.png','-ios-'+('standard' if phase=='standard' else 'enlarged')+'.png')))
              if matches:
                  data=matches[0].read_bytes()
                  print('NATIVE_PNG_BEGIN '+name)
                  encoded=base64.b64encode(data).decode()
                  for offset in range(0,len(encoded),8000):print(encoded[offset:offset+8000])
                  print('NATIVE_PNG_END '+name)
          PY
      - name: Stop simulator
        if: always() && env.SIMULATOR_UDID != ''
        run: xcrun simctl shutdown "$SIMULATOR_UDID"
