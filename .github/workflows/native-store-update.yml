name: Native store update nudge
on:
  workflow_dispatch:
  push:
    branches: [codex/optional-store-update-154]
    paths:
      - '.github/workflows/native-store-update.yml'
      - 'mobile/scripts/native-store-update-*'
      - 'mobile/.maestro/store-update-native-*'
      - 'mobile/src/components/LaunchAskHost.tsx'
      - 'mobile/src/components/StoreUpdateSheet.tsx'
      - 'mobile/src/components/storeUpdateNudge.ts'
      - 'mobile/src/data/storeUpdate.ts'
permissions:
  contents: read
  actions: read
concurrency:
  group: native-store-update-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
env:
  CI: '1'
  TZ: Asia/Kolkata
  EXPO_NO_DOTENV: '1'
  META_TRACKING_ENABLED: 'false'
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: mobile
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set native reference timezone
        run: |
          sudo systemsetup -listtimezones > /tmp/update-timezones.txt
          UPDATE_TIMEZONE=$(python3 - <<'PY'
          from pathlib import Path
          zones={line.strip() for line in Path('/tmp/update-timezones.txt').read_text().splitlines()}
          print(next(zone for zone in ['Asia/Kolkata','Asia/Calcutta'] if zone in zones))
          PY
          )
          sudo systemsetup -settimezone "$UPDATE_TIMEZONE"
      - run: npm ci
      - name: Check immutable fixture reuse eligibility
        id: fixture-source
        run: |
          SOURCE=181de37554f7209f95857ae1b1239a7cc3d1b504
          if git cat-file -e "$SOURCE:mobile" 2>/dev/null && \
             [[ "$(python3 scripts/native-store-update-fingerprint.py "$SOURCE")" == "$(python3 scripts/native-store-update-fingerprint.py)" ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        id: previous-fixtures
        if: steps.fixture-source.outputs.eligible == 'true'
        continue-on-error: true
        with:
          name: native-update-ios-fixtures-42211025918
          run-id: 42211025918
          github-token: ${{ github.token }}
          path: native-update-output/fixtures
      - name: Verify reusable binaries and their original source
        id: verified-fixtures
        if: steps.previous-fixtures.outcome == 'success'
        continue-on-error: true
        run: |
          FIXTURES="$GITHUB_WORKSPACE/native-update-output/fixtures"
          test "$(cat "$FIXTURES/tested-head.txt")" = 181de37554f7209f95857ae1b1239a7cc3d1b504
          cmp <(xcodebuild -version) "$FIXTURES/toolchain.txt"
          test "$(uname -m)" = "$(cat "$FIXTURES/architecture.txt")"
          (cd "$FIXTURES"; shasum -a 256 -c SHA256SUMS)
      - name: Compile both native runtime fixtures
        if: steps.verified-fixtures.outcome != 'success'
        run: |
          rm -f "$GITHUB_WORKSPACE/native-update-output/fixtures/Vedansh-1.5.3.zip" "$GITHUB_WORKSPACE/native-update-output/fixtures/Vedansh-1.5.4.zip"
          bash scripts/native-store-update-ios-build.sh
      - name: Record verified production and consumer identity
        run: |
          FIXTURES="$GITHUB_WORKSPACE/native-update-output/fixtures"
          python3 scripts/native-store-update-fingerprint.py > "$FIXTURES/production-fingerprint.txt"
          git rev-parse HEAD > "$FIXTURES/verified-consumer-head.txt"
          printf 'Compiled source: %s\nConsumer source: %s\nImmutable reuse: %s\n' \
            "$(cat "$FIXTURES/tested-head.txt")" "$(git rev-parse HEAD)" \
            '${{ steps.verified-fixtures.outcome == 'success' }}' > "$FIXTURES/binary-origin.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: native-update-ios-fixtures-${{ github.run_id }}
          path: native-update-output/fixtures/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-update-ios-build-${{ github.run_id }}
          path: native-update-output/*.log
          retention-days: 7
          if-no-files-found: warn
  ios:
    needs: ios-build
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [compact, wide]
        system: [standard, enlarged]
    env:
      NATIVE_IOS_PROFILE: ${{ matrix.profile }}
      NATIVE_SYSTEM_SIZE: ${{ matrix.system }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: mobile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set native reference timezone
        run: |
          sudo systemsetup -listtimezones > /tmp/update-timezones.txt
          UPDATE_TIMEZONE=$(python3 - <<'PY'
          from pathlib import Path
          zones={line.strip() for line in Path('/tmp/update-timezones.txt').read_text().splitlines()}
          print(next(zone for zone in ['Asia/Kolkata','Asia/Calcutta'] if zone in zones))
          PY
          )
          sudo systemsetup -settimezone "$UPDATE_TIMEZONE"
      - uses: actions/download-artifact@v4
        with:
          name: native-update-ios-fixtures-${{ github.run_id }}
          path: native-update-fixtures
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/update-maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/update-maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/update-maestro.zip" -d "$RUNNER_TEMP/update-tools"
          echo "$RUNNER_TEMP/update-tools/maestro/bin" >> "$GITHUB_PATH"
      - name: Exercise verified native runtime fixtures
        run: bash scripts/native-store-update-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-update-ios-${{ matrix.profile }}-${{ matrix.system }}-${{ github.run_id }}
          path: |
            native-update-output/**
            !native-update-output/ios-derived/**
            mobile/e2e-shots/update-*.png
            ~/.maestro/tests/**
          retention-days: 7
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: mobile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Install Maestro
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/update-maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/update-maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/update-maestro.zip" -d "$RUNNER_TEMP/update-tools"
          echo "$RUNNER_TEMP/update-tools/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile and exercise native runtime fixtures
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: mobile
          script: bash scripts/native-store-update-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-update-android-${{ github.run_id }}
          path: |
            native-update-output/**
            !native-update-output/ios-derived/**
            mobile/e2e-shots/update-*.png
            ~/.maestro/tests/**
          retention-days: 7
          if-no-files-found: warn
