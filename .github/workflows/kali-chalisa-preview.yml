name: A4 Kali Chalisa component preview
on:
  pull_request:
    paths:
      - 'mobile/src/data/kali-chalisa/**'
      - 'mobile/visual/kali-chalisa/**'
      - '.github/workflows/kali-chalisa-preview.yml'
permissions:
  contents: read
jobs:
  web-component-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm ci
        working-directory: mobile/visual/sanatan
      - name: Install pinned browser capture tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/a4-preview" --no-save playwright@1.56.1
          "$RUNNER_TEMP/a4-preview/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build and capture actual reader through web adapters
        run: |
          node mobile/visual/kali-chalisa/build.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/a4-preview/node_modules/playwright" node mobile/visual/kali-chalisa/capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: a4-kali-actual-component-web-not-native
          path: mobile/visual/kali-chalisa/captures/
          if-no-files-found: error
