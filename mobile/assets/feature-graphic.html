<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1024px;
  height: 500px;
  overflow: hidden;
  font-family: 'Georgia', serif;
}
.banner {
  width: 1024px;
  height: 500px;
  background: linear-gradient(135deg, #1a0a00 0%, #3d1a00 30%, #B8621B 70%, #e8a44c 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.ornament-top, .ornament-bottom {
  position: absolute;
  left: 0; right: 0;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.4;
}
.ornament-top { top: 20px; }
.ornament-bottom { bottom: 20px; }
.ornament-line {
  width: 60%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #f4d68c, transparent);
}
.corner {
  position: absolute;
  width: 80px;
  height: 80px;
  border: 1px solid rgba(244, 214, 140, 0.3);
}
.corner-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
.corner-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
.corner-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
.corner-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
.content {
  text-align: center;
  z-index: 2;
}
.om {
  font-size: 48px;
  color: rgba(244, 214, 140, 0.6);
  margin-bottom: 10px;
}
.title {
  font-size: 72px;
  color: #fff;
  letter-spacing: 8px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  margin-bottom: 12px;
}
.subtitle {
  font-size: 24px;
  color: #f4d68c;
  letter-spacing: 3px;
  font-style: italic;
  margin-bottom: 20px;
}
.tagline {
  font-size: 18px;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 1px;
  max-width: 600px;
  line-height: 1.5;
}
.mandala {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  border: 1px solid rgba(244, 214, 140, 0.1);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.mandala::after {
  content: '';
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 1px solid rgba(244, 214, 140, 0.08);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div class="banner">
  <div class="mandala"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="ornament-top"><div class="ornament-line"></div></div>
  <div class="ornament-bottom"><div class="ornament-line"></div></div>
  <div class="content">
    <div class="om">&#x0950;</div>
    <div class="title">VEDANSH</div>
    <div class="subtitle">A Portion of the Vedas</div>
    <div class="tagline">Sacred Hindu Texts in Hindi & English</div>
  </div>
</div>
</body>
</html>
