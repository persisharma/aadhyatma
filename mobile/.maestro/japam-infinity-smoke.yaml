appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- scrollUntilVisible:
    element:
      text: "JapMala. Tap to open."
    direction: DOWN
- tapOn: "JapMala. Tap to open."
- tapOn: "Om Namah Shivaya\\..*Tap to open\\."
- extendedWaitUntil:
    visible:
      id: "japam-style-infinity"
    timeout: 15000
- tapOn:
    id: "japam-style-infinity"
- assertVisible: ".*शुरू करने के लिए स्पर्श करें.*[0-9]+ of 108.*"
# Om Namah Shivaya uses its complete-text cadence (1s at 1×); long mantras use their own pacing.
# Verify tempo changes only pace the loop and never add a bead themselves.
- tapOn: "Faster"
- tapOn: "Slower"
# Each completed silent loop counts once. Do not wait for the looping motion
# to end; the second tap pauses motion and counting.
- tapOn:
    id: "japam-counter-infinity"
- extendedWaitUntil:
    visible: ".*रोकने के लिए स्पर्श करें.*[1-9][0-9]* of 108.*"
    timeout: 15000
- tapOn:
    id: "japam-counter-infinity"
- assertVisible: ".*शुरू करने के लिए स्पर्श करें.*[0-9]+ of 108.*"
# Review the full lotus/beaded frame, curved bands and compact infinity.
# Paused rings, word colour and jyoti must hold; reading text scrolls below.
- takeScreenshot: e2e-shots/japam-infinity-ornamental-paused
- tapOn:
    id: "japam-style-mala"
- tapOn: ".*Tap to count one bead.*"
- assertVisible: ".*[1-9][0-9]* of 108 on this mala.*"
- tapOn:
    id: "japam-style-infinity"
- assertVisible: ".*शुरू करने के लिए स्पर्श करें.*[1-9][0-9]* of 108.*"
- tapOn: "Back"
- tapOn: "Om Namah Shivaya\\..*Tap to open\\."
- assertVisible: ".*शुरू करने के लिए स्पर्श करें.*[1-9][0-9]* of 108.*"
- stopApp
- launchApp:
    clearState: false
    arguments:
      RCT_jsLocation: "${typeof METRO_PORT === 'undefined' ? '127.0.0.1:8084' : '127.0.0.1:' + METRO_PORT}"
- extendedWaitUntil:
    visible: "JapMala. Tap to open."
    timeout: 90000
- tapOn: "JapMala. Tap to open."
- tapOn: "Om Namah Shivaya\\..*Tap to open\\."
- assertVisible: ".*शुरू करने के लिए स्पर्श करें.*[1-9][0-9]* of 108.*"
- tapOn: "Back"
# The full Gayatri keeps its four-second canonical cadence. Review its native
# script, complete reading text and ornate frame; a saved count must survive.
- tapOn: "Gayatri Mantra\\..*Tap to open\\."
- assertVisible: ".*Gayatri Mantra.*शुरू करने के लिए स्पर्श करें.*[0-9]+ of 108.*"
- tapOn:
    id: "japam-counter-infinity"
- extendedWaitUntil:
    visible: ".*Gayatri Mantra.*रोकने के लिए स्पर्श करें.*[1-9][0-9]* of 108.*"
    timeout: 20000
- tapOn:
    id: "japam-counter-infinity"
- takeScreenshot: e2e-shots/japam-gayatri-ornamental-paused
- stopApp
