# Review single-language top branding and joined English .app footer in an actual export.
# Requires a native host and published/cached Hanuman art; no messages are sent.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- openLink: "vedansh://widget/verse?sourceId=hanuman-chalisa&verseIndex=3"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: { id: "devotional-subject-hanuman" }
    timeout: 20000
- assertVisible: { id: "devotional-header-brand" }
- takeScreenshot: e2e-shots/daily-flute-reader-header
- scrollUntilVisible:
    element: { id: "devotional-footer" }
    direction: DOWN
- takeScreenshot: e2e-shots/daily-flute-reader-footer
- scrollUntilVisible:
    element: { text: "Share verse" }
    direction: UP
- tapOn: "Share verse"
- tapOn: "Card style: Daily Bhakti card"
- extendedWaitUntil:
    visible: "Card language: Hindi"
    timeout: 20000
- tapOn: "Card language: Hindi"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- takeScreenshot: e2e-shots/daily-flute-preview-hi
- tapOn: "Card language: English"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- takeScreenshot: e2e-shots/daily-flute-preview-en
- tapOn: "Card language: Gujarati"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- takeScreenshot: e2e-shots/daily-flute-preview-gu
- tapOn: "Card language: Kannada"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- takeScreenshot: e2e-shots/daily-flute-preview-kn
- scrollUntilVisible:
    element: { text: "Share to other apps" }
    direction: DOWN
- tapOn: "Share to other apps"
- extendedWaitUntil:
    visible: "Copy|Save Image|AirDrop|Nearby Share|Quick Share"
    timeout: 30000
- takeScreenshot: e2e-shots/daily-flute-native-export-sheet
