# PRD-16 Phase 4 (personalised Tarabala/Chandrabala) native-build smoke
#
# The §8 journey: finder results with NO saved Kundali (strip absent; the one
# footer line is the only trace) → save a Kundali profile → results again
# (the आपके लिए row is present) → day detail (full strip with the janma
# explainer) → share stays free of personal rows (the absence itself is
# pinned deterministically in MuhuratPersonalStrip.test.tsx — a screenshot
# can't prove a negative, so this flow only walks the share sheet open).
#
# Prerequisite: install the native debug app on the target simulator with
# `npx expo run:ios --device <UDID> --port 8084` (isolated-simulator recipe in
# wiki/runbooks/e2e-verification.md). Launches the real bundle; never Expo Go.

appId: com.prashantsharma.vedansh
---
- launchApp:
    appId: com.prashantsharma.vedansh
    clearState: true
    arguments:
      RCT_jsLocation: "127.0.0.1:8084"
- waitForAnimationToEnd:
    timeout: 30000
# clearState resets the notification permission — dismiss the boot alert first
# (native alert; it blocks everything underneath).
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "Skip tour"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Skip tour"
    optional: true
# Skipping the tour on a fresh install hands over to the language + reading-size
# sheet — accept defaults ("Begin") so the flow lands on Home (hi/Standard baseline).
- tapOn:
    text: "Begin"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Got it"
    optional: true
- tapOn:
    text: "Not now|अभी नहीं|હમણાં નહીં|ಈಗ ಬೇಡ"
    optional: true
- extendedWaitUntil:
    # Canary: the above-the-fold Panchang card — the Good Habits tile sits below
    # the first viewport since Home gained the daily recommendation cards.
    visible: ".*Today.s Panchang.*|.*आज का पंचांग.*"
    timeout: 60000

# English chrome for stable assertions (same recipe as the other smokes).
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd

# ── 1. No profile: strip absent; only the footer line ────────────────────────
- scrollUntilVisible:
    element:
      text: "Muhurat\\..*Tap to open\\."
    direction: DOWN
- tapOn: "Muhurat\\..*Tap to open\\."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Find a Muhurat"
    timeout: 20000
- tapOn:
    id: "muhurat-occasion-vahan"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Best dates|More suitable dates"
    timeout: 60000
- assertNotVisible: "For you|आपके लिए"
- scrollUntilVisible:
    element:
      id: "muhurat-bala-footer"
    direction: DOWN

# ── 2. Save a Kundali through the footer's own deep link ─────────────────────
- tapOn: { id: "muhurat-bala-footer" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kundali|कुंडली"
    timeout: 20000
# The shipped Kundali form — same steps as kundali-smoke.yaml (which owns its
# full coverage): picker date, stepper time, searched birth city, generate.
# The footer deep-links straight to the form screen, so the landing CTA only
# appears if the route lands on the Jyotish landing instead.
- tapOn:
    text: "Create Kundali"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "kundali-date-input"
- tapOn: ".*tap to change year"
- tapOn: "Month August"
- tapOn: "Year 1992"
- tapOn: "14 August 1992"
- tapOn: "Confirm date"
- waitForAnimationToEnd
- tapOn:
    id: "kundali-city-button"
- waitForAnimationToEnd
- tapOn:
    id: "kundali-city-search"
- inputText: "Ujjain"
- tapOn: "Select Ujjain birth city"
- waitForAnimationToEnd
- tapOn:
    id: "kundali-generate-button"
- waitForAnimationToEnd:
    timeout: 20000
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# ── 3. With the profile: the quiet row on cards, the strip on the detail ─────
- extendedWaitUntil:
    visible: "Best dates|More suitable dates"
    timeout: 60000
- extendedWaitUntil:
    visible: "For you|आपके लिए"
    timeout: 30000
- assertNotVisible: { id: "muhurat-bala-footer" }
- tapOn:
    text: "Shreshtha.*|Madhyam.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*DrikPanchang convention.*"
    timeout: 20000
- assertVisible: { id: "muhurat-bala-strip" }
# The explainer names the janma nakshatra it counted from and the contract.
- assertVisible: ".*janma nakshatra.*|.*जन्म नक्षत्र.*"
