# Standard smoke followed by Large through ordinary app settings.
appId: com.prashantsharma.vedansh
---
- runFlow: comic-native-smoke.yaml
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element: { text: "Reading size,.*" }
    centerElement: true
- tapOn: "Reading size,.*"
- tapOn: "Large"
- tapOn: "हो गया|Done|થઈ ગયું|ಮುಗಿಯಿತು"
- tapOn: { id: "tab-home" }
- scrollUntilVisible:
    element: { id: "home-kids-stories-card" }
    centerElement: true
- tapOn: { id: "home-kids-stories-card" }
- scrollUntilVisible:
    element: { id: "kids-story-comic-balakanda-v1" }
    centerElement: true
- tapOn: { id: "kids-story-comic-balakanda-v1" }
- scrollUntilVisible:
    element: { id: "comic-episode-bk-05" }
    centerElement: true
- tapOn: { id: "comic-episode-bk-05" }
- repeat:
    times: 3
    commands:
      - swipe:
          start: 85%, 45%
          end: 15%, 45%
          duration: 400
- assertVisible: { id: "comic-page-bk-05-03a" }
- takeScreenshot: comic-native-large-dasharatha-en
- tapOn: { id: "lang-toggle-hi" }
- assertVisible: { id: "comic-page-bk-05-03a" }
- takeScreenshot: comic-native-large-dasharatha-hi
- scrollUntilVisible:
    element: { id: "comic-image-bk-05-03a" }
    centerElement: true
- takeScreenshot: comic-native-large-dasharatha-art
- tapOn: "Back"
- scrollUntilVisible:
    element: { id: "comic-episode-bk-29" }
    timeout: 60000
    centerElement: true
- tapOn: { id: "comic-episode-bk-29" }
- assertVisible: { id: "comic-page-bk-29-01" }
- repeat:
    times: 3
    commands:
      - swipe:
          start: 85%, 45%
          end: 15%, 45%
          duration: 400
- assertVisible: { id: "comic-page-bk-29-04" }
- assertVisible: "140 / 140"
- takeScreenshot: comic-native-last-large-hi
- tapOn: { id: "lang-toggle-en" }
- assertVisible: "140 / 140"
- takeScreenshot: comic-native-last-large-en
