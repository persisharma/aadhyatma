# Executed by the native search matrix; parsing this file is not device evidence.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- runFlow: _sanatan-home-entry.yaml
- tapOn: { id: home-sanatan-card }
- tapOn: { id: lang-toggle-en }
- scrollUntilVisible:
    element: { id: sanatan-collection-dikpal }
    direction: DOWN
    timeout: 60000
- tapOn: { id: sanatan-collection-dikpal, retryTapIfNoChange: true }
- scrollUntilVisible:
    element: { id: sanatan-start }
    direction: DOWN
    timeout: 60000
- tapOn: { id: sanatan-start, retryTapIfNoChange: true }
- scrollUntilVisible:
    element: { id: sanatan-next, above: { id: tab-home } }
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn: { id: sanatan-next, retryTapIfNoChange: true }
# Figure page: the painted teaching plate (language-picked) replaces the old vector schematic.
- scrollUntilVisible:
    element: { id: sanatan-explore-dikpal }
    direction: DOWN
    timeout: 60000
- assertVisible: { id: sanatan-explore-dikpal }
- takeScreenshot: e2e-shots/sanatan-dikpal-plate
- tapOn: Back
- tapOn: Back
- scrollUntilVisible:
    element: { id: sanatan-search }
    direction: UP
    timeout: 60000
- tapOn: { id: sanatan-search }
- inputText: Maitreyi
- pressKey: Enter
- scrollUntilVisible:
    element: { id: sanatan-collection-rishis }
    direction: DOWN
    timeout: 60000
- tapOn: { id: sanatan-collection-rishis, retryTapIfNoChange: true }
- scrollUntilVisible:
    element: { text: "Maitreyi’s distinct question" }
    direction: DOWN
    timeout: 60000
- tapOn: "Maitreyi’s distinct question"
- assertVisible: "3\\s*/\\s*3"
- takeScreenshot: e2e-shots/sanatan-search-maitreyi-exact-page
- tapOn: Back
- tapOn: Back
- assertVisible: { id: sanatan-search, text: Maitreyi }
