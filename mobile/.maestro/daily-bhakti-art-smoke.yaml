# All eighteen formerly neutral Daily Bhakti subjects, through real widget links.
# Use -e METRO_PORT=<isolated Metro port>; default stays 8084.
# Captures are for visual review; mapping assertions prove the selected subject.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- openLink: "vedansh://widget/verse?sourceId=lakshmi-chalisa&verseIndex=0"
- runFlow:
    when: { visible: "Open" }
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: { id: "devotional-subject-lakshmi" }
    timeout: 15000
- assertVisible: { id: "devotional-share-verse" }
- takeScreenshot: e2e-shots/daily-art-lakshmi
