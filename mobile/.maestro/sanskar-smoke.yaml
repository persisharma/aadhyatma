# Sanskar Category Smoke Test (PRD-07)
#
# Verifies:
#   1. Home shows the Sanskar category tile
#   2. CategoryList shows all 7 sanskar sections
#   3. Reader opens with the intro page (परिचय / Introduction)
#   4. Language toggle flips text from Hindi to English
#   5. Swipe pagination works (intro → next verse)
#   6. Back navigation returns to Home
#   7. Surya Namaskar step indicator (चरण N) appears on step verses
#
# Selectors: visible text + accessibilityLabel. LibraryCard's label format is
# "<NameEn>. <sub>. Tap to open." so we use the NameEn substring; Maestro
# regex-matches it inside the full label string. CategoryCard's shorter
# "<NameEn>. Tap to open." matches the same substring.
#
# No pixel coordinates — modal-sheet visibility handled by config.yaml's
# snapshotKeyHonorModalViews: false.

appId: host.exp.Exponent
---
# ── Step 1: Boot Vedansh in Expo Go ──
- runFlow: _launch.yaml

# ── Step 2: Verify all 6 categories visible on Home (full accessibilityLabel match) ──
- assertVisible: "Sacred Books. Tap to open."      # Granth
- assertVisible: "Hymns & Praise. Tap to open."    # Stotram
- assertVisible: "Chalisa. Tap to open."
- assertVisible: "Japa & Mantras. Tap to open."    # Japam
- assertVisible: "Aarti. Tap to open."
- assertVisible: "Good Habits. Tap to open."       # Sanskar

# ── Step 3: Open Sanskar category, verify all 7 sections (regex for LibraryCard) ──
- tapOn: "Good Habits. Tap to open."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Morning Slokas\\..*Tap to open\\."
    timeout: 15000
- assertVisible: "Surya Namaskar\\..*Tap to open\\."
- assertVisible: "Tulsi Puja\\..*Tap to open\\."
- assertVisible: "Meal Prayer\\..*Tap to open\\."
- assertVisible: "Serving Cows & Birds\\..*Tap to open\\."
- assertVisible: "Evening Lamp\\..*Tap to open\\."
- assertVisible: "Bedtime Slokas\\..*Tap to open\\."

# ── Step 4: Open Morning Slokas, toggle to English, assert intro pill ──
# Maestro's iOS accessibility tree doesn't reliably expose standalone
# Devanagari text nodes — so we toggle to English first and assert the
# English label "Introduction" instead of "परिचय".
- tapOn: "Morning Slokas\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# If a previous session left reading progress, the ResumeReadingSheet modal
# appears after a short animation. Wait, then optionally tap "Start over".
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd
- tapOn: "English"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Introduction"
    timeout: 15000

# ── Step 5: Swipe to next verse — intro should no longer be visible ──
- swipe:
    direction: LEFT
- waitForAnimationToEnd
- assertNotVisible: "Introduction"

# ── Step 6: Restart and verify Surya Namaskar step indicator ──
# Reopens fresh because the reader's nav stack is already deep.
- stopApp:
    appId: host.exp.Exponent
- runFlow: _launch.yaml
- tapOn: "Good Habits. Tap to open."
- waitForAnimationToEnd
- tapOn: "Surya Namaskar\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss Resume sheet if present (wait then optional tap)
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd
- tapOn: "English"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Introduction"
    timeout: 15000
# Swipe to first step — pill should now say "Step 1 · <Asana>"
- swipe:
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: "Step 1.*"  # SanskarVersePage.tsx:36 — "Step ${n}" prefix

# ── Cleanup ──
- stopApp:
    appId: host.exp.Exponent
