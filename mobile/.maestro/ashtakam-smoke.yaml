# Ashtakam Category Smoke Test (PRD-A — Content Breadth Engine)
#
# Ashtakam (अष्टकम्) is the catalog home for standalone Ashtak/Ashtakam texts.
# New PRD-A texts use AshtakamReader (`ashtakamId`); the pre-existing Sankat
# Mochan Hanuman Ashtak keeps its dedicated reader but lives in this category.
# Verifies:
#   1. Home shows the Ashtakam category tile
#   2. CategoryList shows all 14 sections: Sankat Mochan Hanuman Ashtak,
#      Lingashtakam, Madhurashtakam, Achyutashtakam, plus the PRD-A §A.4.2
#      deity-expansion texts (Mahalakshmi, Surya, Radha, Subrahmanya, Ganga,
#      Bhavani, Narasimha, Datta, Shani, Kalika) — scroll down the list
#   3. Reader opens; language toggle flips Hindi → English (title becomes "Lingashtakam")
#   4. Back returns to the list
#
# Selectors: visible text + accessibilityLabel. CategoryCard uses
# "<NameEn>. Tap to open."; LibraryCard uses "<NameEn>. <sub>. Tap to open." —
# match on the NameEn substring. No pixel coordinates (RULEBOOK §9).

appId: com.prashantsharma.vedansh
---
# ── Step 1: Boot Vedansh in Expo Go ──
- runFlow: _launch.yaml

# ── Step 2: Find + open the Ashtakam category tile (row 3 — scroll if needed) ──
- scrollUntilVisible:
    element:
      text: "Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- tapOn: "Ashtakam\\..*Tap to open\\."
- waitForAnimationToEnd

# ── Step 3: CategoryList lists every ashtakam section (library order); scroll through all 14 ──
- extendedWaitUntil:
    visible: "Sankat Mochan Hanuman Ashtak\\..*Tap to open\\."
    timeout: 15000
- extendedWaitUntil:
    visible: "Lingashtakam\\..*Tap to open\\."
    timeout: 15000
# PRD-A §A.4.2 deity-expansion sections — the list is several screens tall,
# so scroll to each in library order (RULEBOOK §2 row 15 / §9).
- scrollUntilVisible:
    element:
      text: "Madhurashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Achyutashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Mahalakshmi Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Surya Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Radhashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Subrahmanya Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Gangashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Bhavani Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Narasimha Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Datta Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Shani Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Kalika Ashtakam\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000

# ── Step 3b: Open Lingashtakam (representative reader — scroll back up) ──
- scrollUntilVisible:
    element:
      text: "Lingashtakam\\..*Tap to open\\."
    direction: UP
    visibilityPercentage: 60
    timeout: 15000
- tapOn: "Lingashtakam\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss the Resume sheet if a prior session left progress
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: "resume-start-over"
    optional: true
- waitForAnimationToEnd

# ── Step 4: Toggle to English; the reader title shows "Lingashtakam" ──
- tapOn:
    id: "lang-toggle-en"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Lingashtakam"
    timeout: 15000

# ── Cleanup ──
- stopApp:
    appId: com.prashantsharma.vedansh
