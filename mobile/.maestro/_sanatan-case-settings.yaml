# Begin each language case at the Home root, retaining preferences and reading history.
appId: com.prashantsharma.vedansh
---
- stopApp
- launchApp:
    clearState: false
    arguments:
      RCT_jsLocation: "${typeof METRO_PORT === 'undefined' ? '127.0.0.1:8084' : '127.0.0.1:' + METRO_PORT}"
- extendedWaitUntil:
    visible: { id: home-settings }
    timeout: 90000
- extendedWaitUntil:
    notVisible: { id: brand-launch-reveal }
    timeout: 8000
- tapOn: { id: home-settings, retryTapIfNoChange: true }
