- runFlow:
    file: _sanatan-collection-journey.yaml
    env: { TOPIC: symbols }
- runFlow:
    file: _sanatan-collection-journey.yaml
    env: { TOPIC: plants }
- runFlow:
    file: _sanatan-collection-journey.yaml
    env: { TOPIC: temples }
- runFlow:
    file: _sanatan-collection-journey.yaml
    env: { TOPIC: elements }
- runFlow:
    file: _sanatan-collection-journey.yaml
