# Start inside the lower content viewport, away from fixed headers and nested carousels.
appId: com.prashantsharma.vedansh
---
- repeat:
    times: 24
    while:
      notVisible: { id: "${TARGET}" }
    commands:
      - swipe:
          start: "85%, 82%"
          end: "85%, 35%"
          duration: 700
- assertVisible: { id: "${TARGET}" }
