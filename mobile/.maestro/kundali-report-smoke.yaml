# PRD-20 compiled Kundali report native-build smoke
#
# Verifies the report path: birth input (golden fixture Aarav/Ujjain) →
# Kundali Overview CTA → full reading with disclaimers at both ends, every
# section heading, and the warned birth-details share preview.
#
# Prerequisite: install the native debug app on the target simulator with
# `npx expo run:ios --device <UDID> --port 8084`. This flow launches the real
# app bundle with React Native's native Metro-location argument; it never opens
# Expo Go or depends on the simulator's previous packager.

appId: com.prashantsharma.vedansh
---
- launchApp:
    appId: com.prashantsharma.vedansh
    clearState: true
    arguments:
      RCT_jsLocation: "127.0.0.1:8084"
- waitForAnimationToEnd:
    timeout: 30000
# clearState resets the notification permission — dismiss the boot alert first
# (native alert; it blocks everything underneath).
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "Skip tour"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Skip tour"
    optional: true
# Skipping the tour on a fresh install hands over to the language + reading-size
# sheet — accept defaults ("Begin") so the flow lands on Home (hi/Standard baseline).
- tapOn:
    text: "Begin"
    optional: true
- tapOn:
    text: "English"
    optional: true
- tapOn:
    text: "Begin|आरंभ करें"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Got it"
    optional: true
- tapOn:
    text: "Not now|अभी नहीं|હમણાં નહીં|ಈಗ ಬೇಡ"
    optional: true
- tapOn: { text: "Allow", optional: true }
- tapOn: { text: "Don.t Allow", optional: true }
- waitForAnimationToEnd
- tapOn: { text: "SKIP|Skip|Skip tour", optional: true }
- tapOn: { text: "Begin", optional: true }
- extendedWaitUntil:
    # Canary: the above-the-fold Panchang card — the Good Habits tile sits below
    # the first viewport since Home gained the daily recommendation cards.
    visible: ".*Today.s Panchang.*|.*आज का पंचांग.*"
    timeout: 60000

# Use English for stable visible-text assertions.
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd

# Home permanent launcher → create the golden-fixture chart.
- scrollUntilVisible:
    element:
      text: "Kundali. New. Tap to open."
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: "Kundali. New. Tap to open."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Understand Jyotish"
    timeout: 60000
- tapOn: "Create Kundali"
- waitForAnimationToEnd
- tapOn:
    text: "Edit birth details"
    optional: true
- tapOn:
    id: "kundali-name-input"
- inputText: "Aarav"
- tapOn:
    id: "kundali-date-input"
- waitForAnimationToEnd
- tapOn: ".*tap to change year"
- tapOn: "Month August"
# The year list is a non-virtualized ScrollView in a transparent Modal: Maestro
# can't scrollUntilVisible it, visibility guards see every (off-screen) row, and
# an off-screen testID tap hits the backdrop and dismisses the sheet. iOS lands
# 1992 with a fixed fast-swipe count; Android's fling scrolling varies too much,
# so it slow-drags PAST 1992 (deterministic, no fling, no dismiss) then
# self-corrects: tap 1992 (a safe no-op while off-screen) and nudge the list up
# until the day grid opens. Both branches end on August 1992's day grid.
- runFlow:
    when:
      platform: iOS
    commands:
      - repeat:
          times: 4
          commands:
            - swipe: { start: "50%, 70%", end: "50%, 50%", duration: 250 }
      - waitForAnimationToEnd
      - tapOn: "Year 1992"
- runFlow:
    when:
      platform: Android
    commands:
      - repeat:
          times: 18
          commands:
            - swipe: { start: "50%, 78%", end: "50%, 64%", duration: 1000 }
            - waitForAnimationToEnd
      - repeat:
          times: 15
          while:
            notVisible: "14 August 1992"
          commands:
            - tapOn: { text: "Year 1992", optional: true }
            - swipe: { start: "50%, 72%", end: "50%, 86%", duration: 1000 }
            - waitForAnimationToEnd
- tapOn: "14 August 1992"
- tapOn: "Confirm date"
- waitForAnimationToEnd
- tapOn:
    id: "kundali-time-input"
- waitForAnimationToEnd
- repeat:
    times: 18
    commands:
      - tapOn: "Decrease Minute"
- tapOn:
    id: "kundali-time-input"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "kundali-city-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "kundali-city-button"
- waitForAnimationToEnd
- tapOn:
    id: "kundali-city-search"
- inputText: "Ujjain"
- tapOn: "Select Ujjain birth city"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "kundali-generate-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "kundali-generate-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kundali result"
    timeout: 60000

# Overview CTA → full reading.
- scrollUntilVisible:
    element:
      text: "Open full Kundali reading"
    direction: DOWN
    timeout: 15000
- tapOn: "Open full Kundali reading"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Full Kundali reading"
    timeout: 15000
- assertVisible: ".*not a certain prediction.*"
- assertVisible: ".*Birth details and chart summary.*"
- assertVisible: "Aarav"
- assertVisible: ".*Ujjain.*"
- scrollUntilVisible:
    element:
      text: ".*Career and work.*"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Current classical observations.*"
    direction: DOWN
    timeout: 20000
- assertVisible: ".*Sade Sati.*"
# Mahadasha sits under Sade Sati — below the fold on Android; scroll to it.
# Low visibilityPercentage: on iOS it's already partly on-screen at the bottom,
# so the default 100% is never met and the scroll runs past it.
- scrollUntilVisible:
    element:
      text: ".*Mahadasha \\(current\\).*"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 10
# The closing disclaimer sits under the last section.
- scrollUntilVisible:
    element:
      text: ".*not a basis for medical, financial, or legal decisions.*"
    direction: DOWN
    timeout: 20000

# One Share button; the sheet offers the warned card AND the full-text export.
- scrollUntilVisible:
    element:
      text: "Full Kundali reading"
    direction: UP
    timeout: 20000
- tapOn: "Share chart summary"
- waitForAnimationToEnd
- assertVisible: ".*include the chart name, birth date, time, and city.*"
- assertVisible: "Open share sheet"
- assertVisible: "Share the full reading as text"
- tapOn: "Close share preview"
- waitForAnimationToEnd

- stopApp:
    appId: com.prashantsharma.vedansh
