# One-off verification: Kids -> Ramayan Comic shelf -> Ayodhya -> reader art.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- scrollUntilVisible:
    element: { id: "home-kids-stories-card" }
    centerElement: true
- tapOn: { id: "home-kids-stories-card" }
- scrollUntilVisible:
    element: { id: "kids-story-ramayan-comic" }
    centerElement: true
- tapOn: { id: "kids-story-ramayan-comic" }
# The seven-kanda shelf: two live, five coming soon.
- assertVisible: { id: "ramayan-kanda-bala" }
- assertVisible: { id: "ramayan-kanda-ayodhya" }
- assertVisible: { id: "ramayan-kanda-aranya" }
- assertVisible: { id: "ramayan-kanda-uttara" }
- takeScreenshot: ayodhya-01-shelf
# Open Ayodhya -> its chapter listing.
- tapOn: { id: "ramayan-kanda-ayodhya" }
- extendedWaitUntil:
    visible: { id: "comic-episodes" }
    timeout: 60000
- assertVisible: { id: "comic-scope" }
- assertVisible: { id: "comic-episode-ay-page-001" }
- takeScreenshot: ayodhya-02-chapters
# Open the first prasang -> reader; wait for the CDN sheet to load.
- tapOn: { id: "comic-episode-ay-page-001" }
- extendedWaitUntil:
    visible: { id: "comic-image-ay-p001-s1" }
    timeout: 60000
- takeScreenshot: ayodhya-03-reader-hi
- tapOn: { id: "lang-toggle-en" }
- assertVisible: { id: "comic-page-ay-page-001" }
- takeScreenshot: ayodhya-04-reader-en
