# Wishlist (Bookmarks) Smoke Test — #46/#51/#55 (bookmark → wishlist round-trip)
#
# Bookmarks are verse-level favorites saved from the ♡ button inside a reader
# (#51 moved bookmark + share into the shloka row). The Wishlist screen lives
# in MoreStackNavigator (More tab → Wishlist) and lists saved verses with a
# verse-number pill (#46/#55 fixed the pill's visibility and localization).
#
# Saves Sundarkand + Gita chapter 1 verse 1, filters by canonical source,
# tests Cancel/Remove through independent accessibility targets, opens the
# exact saved Gita verse and re-enters Settings to verify session retention.
# Counts/order may include existing user saves; remove only the two test saves.
# Native execution is required separately from YAML parsing.

appId: com.prashantsharma.vedansh
---
# ── Step 1: Boot Vedansh in Expo Go (exits on Home) ──
- runFlow: _launch.yaml

# ── Step 2: Set global reading language to English (More tab) ──
- runFlow: _open-settings.yaml
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"   # More now opens a Language picker sheet, not inline pills
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd

# ── Step 3: Open the Sundarkand reader (Home → Sacred Books → Sundarkand) ──
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd
- assertVisible: "Sacred Books. Tap to open."
- tapOn: "Sacred Books. Tap to open."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sundarkand\\..*Tap to open\\."
    timeout: 15000
- tapOn: "Sundarkand\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Sundarkand is chaptered → this lands on the SundarkandChapters index. Dismiss
# a resume sheet if prior progress popped one (returns to the index), then open
# Chapter 1 to reach the reader where the bookmark control lives.
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Chapter 1\\..*Tap to open\\."
    timeout: 15000
- tapOn: "Chapter 1\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000

# ── Step 4: Ensure the current verse is bookmarked ──
- tapOn:
    text: "Jump to beginning"
    optional: true
# Optional tap: if the verse is already bookmarked, "Add bookmark" is absent
# (it reads "Remove bookmark") and the tap is skipped — either way it ends up
# bookmarked.
- tapOn:
    text: "Add bookmark"
    optional: true
- waitForAnimationToEnd
- assertVisible: "Remove bookmark"
# A new save qualifies for rating when the shared daily opportunity is available.
- tapOn:
    text: "Maybe later"
    optional: true

# Add a second source so automatic filters become useful.
- tapOn: { id: "tab-home" }
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd
- tapOn: "Sacred Books\\..*Tap to open\\."
- tapOn: "Bhagavad Gītā\\..*Tap to open\\."
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd
- tapOn: "Chapter 1\\..*Tap to open\\."
- waitForAnimationToEnd
- tapOn:
    text: "Jump to beginning"
    optional: true
- tapOn:
    text: "Add bookmark"
    optional: true
- assertVisible: "Remove bookmark"
# A new save qualifies for rating when the shared daily opportunity is available.
- tapOn:
    text: "Maybe later"
    optional: true

# ── Step 5: Open the Wishlist (More tab → Wishlist) ──
# The More card's a11y label is composed ("Wishlist, N verses saved"), and
# Maestro matches the full string — anchor with .* not the bare word.
- runFlow: _open-settings.yaml
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Wishlist.*"
    direction: UP
    timeout: 15000
- extendedWaitUntil:
    visible: "Wishlist.*"
    timeout: 15000
- tapOn: "Wishlist.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sundarkand.*"
    timeout: 15000

# Filter to Gita; unrelated saved verses disappear.
- tapOn: { id: "saved-source-bhagavad-gita" }
- assertVisible: { id: "saved-verse-bhagavad-gita:1:0" }
- assertNotVisible: { id: "saved-verse-sundarkand:1:0" }
- tapOn: { id: "remove-saved-bhagavad-gita:1:0" }
- assertVisible: "Remove from wishlist?"
- tapOn: "Cancel"
- assertVisible: { id: "saved-verse-bhagavad-gita:1:0" }

# Exact reader handoff, then re-entry through Home's settings gear.
- tapOn: { id: "saved-verse-bhagavad-gita:1:0" }
- waitForAnimationToEnd
- assertVisible: "Verse 1\\.1.*"
- assertVisible: "Remove bookmark"
# A new save qualifies for rating when the shared daily opportunity is available.
- tapOn:
    text: "Maybe later"
    optional: true
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element: { text: "Wishlist.*" }
    direction: UP
- tapOn: "Wishlist.*"
- waitForAnimationToEnd
- assertVisible: { id: "saved-verse-bhagavad-gita:1:0" }
- assertNotVisible: { id: "saved-verse-sundarkand:1:0" }

# Remove that save after confirmation. Any remaining Gita saves retain the filter.
- tapOn: { id: "remove-saved-bhagavad-gita:1:0" }
- tapOn: "Remove"
- assertNotVisible: { id: "saved-verse-bhagavad-gita:1:0" }
- tapOn:
    id: "saved-source-all"
    optional: true
- scrollUntilVisible:
    element: { id: "saved-verse-sundarkand:1:0" }
- tapOn: { id: "remove-saved-sundarkand:1:0" }
- tapOn: "Remove"
- assertNotVisible: { id: "saved-verse-sundarkand:1:0" }
- stopApp:
    appId: com.prashantsharma.vedansh
