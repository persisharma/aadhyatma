appId: com.prashantsharma.vedansh
---
# Run after prepare-mahakaal.mjs --publish / --activate and reloading that JS.
# This deliberately requires Mahakaal to be visible; pending publication is not a pass.
- runFlow: _launch.yaml
- tapOn: { id: "tab-bhakti" }
- tapOn: { id: "open-suvichar" }
- tapOn: { id: "suvichar-mode-custom" }
# The deity picker is a nested horizontal rail; Maestro's scrollUntilVisible
# direction:RIGHT does not engage it reliably, so drive the rail with explicit
# left swipes (at the rail's vertical centre) until Mahakaal — second from the
# end of the catalogue — is on screen, then nudge once more so it is not clipped
# at the right edge before tapping.
- repeat:
    times: 12
    while: { notVisible: { id: "suvichar-deity-mahakaal" } }
    commands:
      - swipe: { start: "85%,46%", end: "20%,46%", duration: 350 }
      - waitForAnimationToEnd
- swipe: { start: "85%,46%", end: "20%,46%", duration: 350 }
- waitForAnimationToEnd
- tapOn: { id: "suvichar-deity-mahakaal" }
- tapOn: { id: "suvichar-frame-mandir-jharokha" }
- assertVisible: { id: "suvichar-card" }
- takeScreenshot: mahakaal-mandir-jharokha
- tapOn: { id: "suvichar-frame-pushp-aangan" }
- assertVisible: { id: "suvichar-card" }
- takeScreenshot: mahakaal-pushp-aangan
- tapOn: { id: "suvichar-frame-bhakti-patra" }
- assertVisible: { id: "suvichar-card" }
- takeScreenshot: mahakaal-bhakti-patra
- scrollUntilVisible:
    element: { id: "suvichar-share" }
- assertVisible: { id: "suvichar-share" }
# Manually inspect the full shared image at Standard and Large sizes.
# Do not send to a recipient as part of this flow.
