# Granth Category Smoke Test
#
# Verifies the Granth category and its 3 active sections render correctly.
# Sections: Bhagavad Gītā, Sundarkand, Ramcharitmanas Mangalacharan.
#
# Bhagavad Gītā has a chapter index (GitaChaptersIndexScreen); other two go
# straight to a reader. This flow opens Sundarkand to keep the verify path
# simple (no chapter selection).

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# Verify Granth tile and open it
- assertVisible: "Sacred Books. Tap to open."
- tapOn: "Sacred Books. Tap to open."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Bhagavad Gītā\\..*Tap to open\\."
    timeout: 15000
- assertVisible: "Sundarkand\\..*Tap to open\\."
- assertVisible: "Ramcharitmanas Mangalacharan\\..*Tap to open\\."

# Open Sundarkand reader
- tapOn: "Sundarkand\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss Resume sheet if a prior session left reading progress
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd

# Language toggle test
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: "Hindi"
- waitForAnimationToEnd

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: com.prashantsharma.vedansh
