appId: com.prashantsharma.vedansh
---
- runFlow: _open-settings.yaml
# Settings is a tab, so it keeps the previous case's scroll position. When that
# left Language above the screen, scrolling down never found it (CI, Android
# enlarged, third case). Start from the top: the back button is its first item.
- scrollUntilVisible:
    element: { id: settings-back }
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element: { text: "Language,.*" }
    direction: DOWN
    timeout: 60000
- tapOn: "Language,.*"
- tapOn: "${READING_LANGUAGE}"
- scrollUntilVisible:
    element: { text: "Reading size,.*" }
    direction: DOWN
    timeout: 60000
- tapOn: "Reading size,.*"
- tapOn: "${READING_SIZE}"
- tapOn: "हो गया|Done|થઈ ગયું|ಮುಗಿಯಿತು"
- tapOn: { id: tab-home }
- runFlow: _sanatan-home-entry.yaml
- takeScreenshot: "e2e-shots/sanatan-home-frame-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
- tapOn: { id: home-sanatan-card }
- scrollUntilVisible:
    element: { id: sanatan-collection-dikpal }
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 50
    centerElement: true
- takeScreenshot: "e2e-shots/sanatan-hub-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
- runFlow:
    file: _sanatan-open-row.yaml
    env:
      ROW_ID: sanatan-collection-dikpal
# Centre the button before tapping: at enlarged iOS text the scroll stopped with
# Open lesson cut off at the bottom edge, and the tap at its centre missed (CI).
- scrollUntilVisible:
    element: { id: sanatan-start }
    direction: DOWN
    timeout: 60000
    centerElement: true
- takeScreenshot: "e2e-shots/sanatan-collection-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
- tapOn: { id: sanatan-start }
- takeScreenshot: "e2e-shots/sanatan-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
# Large Gujarati and Kannada pages are long: reaching Next took 48 of 60 seconds
# on CI, leaving too little for the centring swipes. Allow two minutes.
- scrollUntilVisible:
    element: { id: sanatan-next }
    direction: DOWN
    timeout: 120000
    centerElement: true
- tapOn: { id: sanatan-next }
- assertVisible: "2\\s*/\\s*3"
- scrollUntilVisible:
    element: { id: sanatan-explore-dikpal }
    direction: DOWN
    timeout: 120000
- takeScreenshot: "e2e-shots/sanatan-diagram-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
