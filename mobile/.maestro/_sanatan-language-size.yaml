appId: com.prashantsharma.vedansh
---
- runFlow: _open-settings.yaml
# Settings retains its scroll offset. Return to its first row before searching
# downward, even if iOS still exposes a partially clipped language row.
- scrollUntilVisible:
    element: { id: settings-back }
    direction: UP
    speed: 65
    timeout: 90000
- scrollUntilVisible:
    element: { text: "Language,.*" }
    direction: DOWN
    speed: 20
    centerElement: true
    timeout: 90000
- scrollUntilVisible:
    element: { text: "Language,.*" }
    direction: UP
    speed: 15
    centerElement: true
    timeout: 20000
- runFlow:
    when: { notVisible: { text: "Language, ${READING_LANGUAGE}" } }
    commands:
      - tapOn: "Language,.*"
      - tapOn: "${READING_LANGUAGE}"
- assertVisible: "Language, ${READING_LANGUAGE}"
- scrollUntilVisible:
    element: { text: "Reading size,.*", above: { id: tab-home } }
    direction: DOWN
    timeout: 60000
- tapOn: "Reading size,.*"
- tapOn: "${READING_SIZE}"
- tapOn: "हो गया|Done|થઈ ગયું|ಮುಗಿಯಿತು"
- tapOn: { id: tab-home }
- runFlow: _sanatan-home-entry.yaml
- takeScreenshot: "e2e-shots/sanatan-home-frame-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
- tapOn: { id: home-sanatan-card }
- runFlow:
    file: _sanatan-reveal-row.yaml
    env: { ROW_ID: "sanatan-collection-dikpal" }
- takeScreenshot: "e2e-shots/sanatan-hub-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
- tapOn: { id: sanatan-collection-dikpal, retryTapIfNoChange: true }
- runFlow:
    file: _sanatan-reveal-row.yaml
    env: { ROW_ID: "sanatan-start" }
- takeScreenshot: "e2e-shots/sanatan-collection-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
- tapOn: { id: sanatan-start, retryTapIfNoChange: true }
- takeScreenshot: "e2e-shots/sanatan-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
# Capture the adjacent lesson page using the reader's native horizontal pager.
# The collections journey separately exercises the Next button on every topic.
- swipe: { start: "88%,60%", end: "12%,60%", duration: 350 }
- extendedWaitUntil:
    visible: "2\\s*/\\s*3"
    timeout: 15000
- scrollUntilVisible:
    element: { id: sanatan-explore-dikpal, above: { id: tab-home } }
    direction: DOWN
    timeout: 60000
- takeScreenshot: "e2e-shots/sanatan-diagram-${READING_LANGUAGE}-${READING_SIZE}-${CAPTURE_SUFFIX}"
