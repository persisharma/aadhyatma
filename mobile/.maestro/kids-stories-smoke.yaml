# Home → deity → story reader; swipe-only paging and return to the Krishna shelf.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- scrollUntilVisible:
    element: { id: "home-kids-stories-card" }
    centerElement: true
- tapOn: { id: "home-kids-stories-card" }
- assertVisible: { id: "kids-story-deity-krishna" }
- assertVisible: { id: "kids-story-deity-ganesha" }
- assertVisible: { id: "kids-story-deity-hanuman" }
- tapOn: { id: "kids-story-deity-krishna" }
- assertVisible: { id: "kids-story-planned-kaliya-nag" }
- tapOn: { id: "kids-story-krishna-janma" }
- assertVisible: { id: "story-pager" }
- assertVisible: "1 / 16"
# Swipe-only navigation: no Previous/Next buttons, just the horizontal pager.
- swipe:
    start: 85%, 45%
    end: 15%, 45%
    duration: 600
- assertVisible: "2 / 16"
- swipe:
    start: 85%, 45%
    end: 15%, 45%
    duration: 600
- assertVisible: "3 / 16"
- swipe:
    start: 15%, 45%
    end: 85%, 45%
    duration: 600
- assertVisible: "2 / 16"
- assertVisible: { id: "story-caption" }
- repeat:
    times: 14
    commands:
      - swipe:
          start: 85%, 45%
          end: 15%, 45%
          duration: 300
- assertVisible: "16 / 16"
- assertVisible: { id: "story-page-safe" }
- tapOn: "Back"
- assertVisible: { id: "kids-story-krishna-janma" }
