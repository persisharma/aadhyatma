# Installed native evidence still required: this file is not a visual verdict.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- assertNotVisible:
    id: brand-launch-reveal
- assertNotVisible:
    id: brand-particle-webview
- assertVisible:
    id: vedansh-wordmark-hi
- assertVisible:
    id: home-wordmark-crest
- assertVisible:
    id: home-wordmark-artwork-frame
- assertVisible:
    id: home-settings
- takeScreenshot: e2e-shots/brand-home-flute-compact-om-crest
- stopApp
- launchApp:
    arguments:
      RCT_jsLocation: "${typeof METRO_PORT === 'undefined' ? '127.0.0.1:8084' : '127.0.0.1:' + METRO_PORT}"
- extendedWaitUntil:
    visible:
      id: brand-launch-reveal
    timeout: 5000
- takeScreenshot: e2e-shots/brand-cold-particles
- extendedWaitUntil:
    notVisible:
      id: brand-launch-reveal
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: vedansh-wordmark-hi
    timeout: 30000
- assertNotVisible:
    id: brand-particle-webview

# A warm reopen must replay while the existing navigator remains mounted.
- pressKey: Home
- launchApp:
    stopApp: false
    arguments:
      RCT_jsLocation: "${typeof METRO_PORT === 'undefined' ? '127.0.0.1:8084' : '127.0.0.1:' + METRO_PORT}"
- extendedWaitUntil:
    visible:
      id: brand-launch-reveal
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: brand-launch-reveal
    timeout: 8000
- assertVisible:
    id: home-wordmark-crest

# Repeat immediately, with no minimum background delay.
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: brand-launch-reveal
    timeout: 5000
- takeScreenshot: e2e-shots/brand-immediate-reopen
- extendedWaitUntil:
    notVisible:
      id: brand-launch-reveal
    timeout: 8000
- assertVisible:
    id: home-wordmark-crest
