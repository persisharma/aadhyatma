# Home Today-First Smoke Test (design.md §18/§48/§49)
#
# Covers the three surfaces added by the Home redesign:
#   1. The "आज · Today" strip renders on Home (a11y label "Today's Panchang. …").
#   2. The व्रत (Vrat & Parv) launcher tile opens the Panchang stack's
#      ObservanceList — and, because the tile navigates via panchangTabTarget
#      (initial: false), backing out lands on PanchangHome (the calendar),
#      proving the vrat door did not hijack the lazily-mounted stack's
#      initial route.
#   3. Reading a page of a text surfaces the "Continue reading" card on Home,
#      and tapping it resumes the reader.
#
# Language note (same as panchang-smoke / vrat-catalog-smoke): default Hindi
# renders Devanagari, which Maestro's iOS tree can't read — flip to English on
# More first. Tile/card a11y labels are English by contract either way.
#
# Selector notes (per vrat-catalog-smoke):
#   - The PanchangHome segment Pressable exposes accessibilityLabel
#     "Vrat and Parv", not the visible "Vrat & Parv" text.
#   - ObservanceList's back button exposes "Back" (English mode).
#   - The Continue-reading card sits below the 3×3 grid → scrollUntilVisible.

appId: host.exp.Exponent
---
- runFlow: _launch.yaml

# ── Global reading language → English ──
- tapOn: "More, tab.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: "Home, tab.*"
- waitForAnimationToEnd

# ── 1. Today strip on Home ──
- assertVisible: "Today's Panchang\\..*Tap to open\\."

# ── 2. व्रत tile → Vrat catalog → back lands on the Panchang calendar ──
- assertVisible: "Vrat & Parv\\..*Tap to open\\."
- tapOn: "Vrat & Parv\\..*Tap to open\\."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Vrat"
    timeout: 15000
- tapOn: "Back"
- waitForAnimationToEnd
# The [Calendar | Vrat and Parv] segment lives on PanchangHome — visible only
# if the calendar screen sits under ObservanceList in the stack (initial: false).
- assertVisible: "Vrat and Parv"
- tapOn: "Home, tab.*"
- waitForAnimationToEnd

# ── 3. Continue-reading card after reading ──
- tapOn: "Chalisa\\..*Tap to open\\."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Hanuman Chalisa\\..*Tap to open\\."
    timeout: 15000
- tapOn: "Hanuman Chalisa\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
- swipe:
    direction: LEFT
- waitForAnimationToEnd
- tapOn: "Back to home"
- waitForAnimationToEnd
- tapOn: "Home, tab.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Continue reading\\..*Tap to resume\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 15000
- tapOn: "Continue reading\\..*Tap to resume\\."
- waitForAnimationToEnd
- assertVisible: "Back to home"
