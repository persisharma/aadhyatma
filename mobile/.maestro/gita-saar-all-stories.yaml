# Native gallery sweep: every theme card opens its distinct story and picture.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- scrollUntilVisible:
    element: { text: "Sacred Books.*Tap to open." }
    direction: DOWN
- tapOn: "Sacred Books.*Tap to open."
- scrollUntilVisible:
    element: { text: "Gita Saar\\..*Tap to open\\..*" }
    direction: DOWN
- tapOn: "Gita Saar\\..*Tap to open\\..*"
- extendedWaitUntil:
    visible: { id: gita-saar-featured }
    timeout: 30000
- scrollUntilVisible:
    element: { id: gita-saar-theme-true-prema }
    direction: DOWN
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 30000
- assertVisible: { id: gita-saar-theme-art-true-prema }
- tapOn: { id: gita-saar-theme-true-prema }
- extendedWaitUntil:
    visible: { id: gita-saar-story-image-true-prema }
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 30000
- takeScreenshot: e2e-shots/gita-saar-story-true-prema
- tapOn: Back
