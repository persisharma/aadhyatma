# Open a Sanatan collection row, or the topic's Open lesson button, that a
# centring scroll has just brought into view.
# Env: ROW_ID, the row's or button's testID.
# Guards iOS CI misses where the tap COMPLETED but the screen did not change:
# - a tap that lands while the list is still coasting is taken by the ScrollView;
# - Maestro's centring is one-sided, so a tall enlarged-text row or button can stop
#   just under the header (a 495pt row centred at y 110; Open lesson at y 62-163 in
#   Kannada Large). Tapping 75% down stays below the header.
appId: com.prashantsharma.vedansh
---
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: ${ROW_ID}
    point: "50%,75%"
- waitForAnimationToEnd:
    timeout: 3000
# The opened topic or reader replaces the previous screen in the native stack, so
# the row or button is only still visible when the tap was lost.
- runFlow:
    when:
      visible:
        id: ${ROW_ID}
    commands:
      - tapOn:
          id: ${ROW_ID}
          point: "50%,75%"
