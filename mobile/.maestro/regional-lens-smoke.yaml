# Regional Lens Smoke Test (PRD-42 W2 follow-up — region tags, bulk controls, "what does it bring")
#
# The defect this guards, from the Sept 2026 report: turning जैन on changed the
# calendar by a day nobody could point to ("it still shows everything"), and the
# other twenty calendars changed nothing at all. Now:
#   1. Every calendar BRINGS something — the hidden rules it adds plus the
#      universal rules tagged as its own (`regions`) — and the sheet row says so.
#      Select all / Clear all sit in the header, each hidden when a no-op.
#   2. The Vrat & Parv landing grows a "From your calendars" card listing the
#      calendar's observances by soonest date, each opening its detail, with
#      "See all n" into the per-calendar list.
#   3. The detail hero carries a ❖ chip per calendar the observance belongs to.
#
# Specific DATES are date-dependent and belong to the unit suites (lens.test.ts);
# what a device can assert is that the Rajasthan row toggles on, Gangaur appears
# under the card (Gangaur is a universal rule — the tag put it there, not a lens),
# opens a detail page carrying a Rajasthan chip, and that Select all → Clear all
# round-trips the header count.
#
# Language note (same as vrat-catalog-smoke): the screen reads the global reading
# language; default Hindi is Devanagari which Maestro's iOS tree can't read, so we
# flip to English on More first, then assert English content.
#
# Selector notes:
#   - The ledger's third column is a button labelled "Regional calendars, none
#     selected" / ", n on" / ", all n on".
#   - Lens rows are checkboxes labelled "<Name> calendar. <examples>. Brings n: …".
#   - Bulk controls carry testIDs lens-select-all / lens-clear-all.
#   - The additions card carries testID lens-additions; its rows are buttons
#     labelled "<NameEn>, next <date>" → match "Gangaur.*"; the per-group link is
#     "See all n Rajasthan observances".
#   - The offered count is 22 (every registered calendar brings something);
#     lens.test.ts pins it, so update the two assertions below together.

appId: com.prashantsharma.vedansh
---
# ── Boot Vedansh (exits on Home) ──
- runFlow: _launch.yaml

# ── Global reading language → English ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd

# ── Panchang → Vrat & Parv → open the lens sheet from the ledger ──
- tapOn: { id: "tab-panchang" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Vrat & Parv"
    timeout: 30000
- tapOn: "Vrat & Parv"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Browse by type"
    timeout: 15000
- assertNotVisible: { id: "lens-additions" }
- tapOn: "Regional calendars,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Regional calendars"
    timeout: 15000

# ── Every row says what it brings ──
- assertVisible: "None selected · 22 available"
- assertVisible: "Rajasthan calendar.*Brings .*Gangaur.*"

# ── Select all: header count flips, Clear all appears, Select all hides ──
- assertVisible: { id: "lens-select-all" }
- tapOn: { id: "lens-select-all" }
- waitForAnimationToEnd
- assertVisible: "All 22 on"
- assertVisible: { id: "lens-clear-all" }
- assertNotVisible: { id: "lens-select-all" }

# ── Clear all: back to none, Select all returns ──
- tapOn: { id: "lens-clear-all" }
- waitForAnimationToEnd
- assertVisible: "None selected · 22 available"
- assertVisible: { id: "lens-select-all" }
- assertNotVisible: { id: "lens-clear-all" }

# ── One deliberate tap: Rajasthan ──
- tapOn: "Rajasthan calendar.*"
- waitForAnimationToEnd
- assertVisible: "1 on · 21 more available"
# Dismiss the sheet by tapping the backdrop (top of the screen).
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd

# ── The landing now lists what Rajasthan brings; "See all" opens the calendar's list ──
- extendedWaitUntil:
    visible: "From your calendars"
    timeout: 15000
- assertVisible: { id: "lens-additions" }
- assertVisible: "Regional calendars, 1 on"
- tapOn: "See all .* Rajasthan observances"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Search within this list…"
    timeout: 15000
- tapOn: "Search within this list…"
- inputText: "Gangaur"
- hideKeyboard
- extendedWaitUntil:
    visible: "Gangaur"
    timeout: 15000
- tapOn: "Gangaur"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "About"
    timeout: 15000
- assertVisible: "Next · .*"
- assertVisible: "Rajasthan calendar"
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Back"
- waitForAnimationToEnd

# ── Cleanup: turn Rajasthan back off so the next flow starts unlensed ──
- extendedWaitUntil:
    visible: "Browse by type"
    timeout: 15000
- tapOn: "Regional calendars,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "lens-clear-all" }
    timeout: 15000
- tapOn: { id: "lens-clear-all" }
- waitForAnimationToEnd
- assertVisible: "None selected · 22 available"
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd

# ── Restore Hindi default (best-effort) + cleanup ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
    optional: true
- tapOn:
    text: "Language,.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Hindi"
    optional: true
- waitForAnimationToEnd
- stopApp:
    appId: com.prashantsharma.vedansh
