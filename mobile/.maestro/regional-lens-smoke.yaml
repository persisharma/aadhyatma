# Regional Lens Smoke Test (PRD-42 W2 — sheet bulk controls + "what did it add")
#
# The defect this guards, from the Sept 2026 report: turning जैन on changed the
# calendar by a day nobody could point to ("it still shows everything"), and
# seeing every calendar took twenty-two taps. Two surfaces answer it:
#   1. The lens sheet's header carries Select all / Clear all, each hidden when
#      it would be a no-op, and every row's third line names what it adds.
#   2. The Vrat & Parv landing grows a "From your calendars" card listing the
#      lensed rules by calendar, each opening its detail.
#
# Specific DATES are date-dependent and belong to the unit suites (lens.test.ts);
# what a device can assert is that the Jain row toggles on, Rohini Vrat appears
# under the card, opens a detail page, and that Select all → Clear all round-trips
# the header count.
#
# Language note (same as vrat-catalog-smoke): the screen reads the global reading
# language; default Hindi is Devanagari which Maestro's iOS tree can't read, so we
# flip to English on More first, then assert English content.
#
# Selector notes:
#   - The ledger's third column is a button labelled "Regional calendars, none
#     selected" / ", n on" / ", all 22 on".
#   - Lens rows are checkboxes labelled "<Name> calendar. <examples>. Adds …".
#   - Bulk controls carry testIDs lens-select-all / lens-clear-all.
#   - The additions card carries testID lens-additions; its rows are buttons
#     labelled "<NameEn>, next <date>" → match "Rohini Vrat.*".

appId: com.prashantsharma.vedansh
---
# ── Boot Vedansh (exits on Home) ──
- runFlow: _launch.yaml

# ── Global reading language → English ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd

# ── Panchang → Vrat & Parv → open the lens sheet from the ledger ──
- tapOn: { id: "tab-panchang" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Vrat & Parv"
    timeout: 30000
- tapOn: "Vrat & Parv"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Browse by type"
    timeout: 15000
- assertNotVisible: { id: "lens-additions" }
- tapOn: "Regional calendars,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Regional calendars"
    timeout: 15000

# ── Select all: header count flips, Clear all appears, Select all hides ──
- assertVisible: { id: "lens-select-all" }
- tapOn: { id: "lens-select-all" }
- waitForAnimationToEnd
- assertVisible: "All 22 on"
- assertVisible: { id: "lens-clear-all" }
- assertNotVisible: { id: "lens-select-all" }

# ── Clear all: back to none, Select all returns ──
- tapOn: { id: "lens-clear-all" }
- waitForAnimationToEnd
- assertVisible: "None selected · 22 available"
- assertVisible: { id: "lens-select-all" }
- assertNotVisible: { id: "lens-clear-all" }

# ── One deliberate tap: Jain. Its row already says what it adds. ──
- scrollUntilVisible:
    element:
      text: "Jain calendar.*"
    centerElement: true
- assertVisible: "Jain calendar.*Adds 1: Rohini Vrat"
- tapOn: "Jain calendar.*"
- waitForAnimationToEnd
- assertVisible: "1 on · 21 more available"
# Dismiss the sheet by tapping the backdrop (top of the screen).
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd

# ── The landing now says exactly what Jain added, and the row opens ──
- extendedWaitUntil:
    visible: "From your calendars"
    timeout: 15000
- assertVisible: { id: "lens-additions" }
- assertVisible: "Regional calendars, 1 on"
- tapOn: "Rohini Vrat.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "About"
    timeout: 15000
- assertVisible: "Next · .*"
- tapOn: "Back"
- waitForAnimationToEnd

# ── Cleanup: turn Jain back off so the next flow starts unlensed ──
- extendedWaitUntil:
    visible: "Browse by type"
    timeout: 15000
- tapOn: "Regional calendars,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "lens-clear-all" }
    timeout: 15000
- tapOn: { id: "lens-clear-all" }
- waitForAnimationToEnd
- assertVisible: "None selected · 22 available"
- tapOn:
    point: "50%,8%"
- waitForAnimationToEnd

# ── Restore Hindi default (best-effort) + cleanup ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
    optional: true
- tapOn:
    text: "Language,.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Hindi"
    optional: true
- waitForAnimationToEnd
- stopApp:
    appId: com.prashantsharma.vedansh
