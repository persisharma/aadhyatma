# Reselect Home to pop its stack, then return to the header in the same session.
appId: com.prashantsharma.vedansh
---
- tapOn: { id: tab-home }
- waitForAnimationToEnd
- tapOn: { id: tab-home }
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: home-settings }
    direction: UP
    timeout: 90000
# A partially exposed gear can sit behind the iOS safe area.
- swipe: { direction: DOWN }
- waitForAnimationToEnd
- tapOn: { id: home-settings, retryTapIfNoChange: true }
- waitForAnimationToEnd
