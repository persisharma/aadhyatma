# Continuous full-card master comparison: approved existing scene and new subject.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- openLink: "vedansh://widget/verse?sourceId=ganesh-chalisa&verseIndex=0"
- extendedWaitUntil:
    visible: { id: "devotional-subject-ganesha" }
    timeout: 20000
- takeScreenshot: e2e-shots/daily-full-existing-ganesha
- openLink: "vedansh://widget/verse?sourceId=lakshmi-chalisa&verseIndex=0"
- extendedWaitUntil:
    visible: { id: "devotional-subject-lakshmi" }
    timeout: 20000
- takeScreenshot: e2e-shots/daily-full-lakshmi
- stopApp:
    appId: com.prashantsharma.vedansh
- launchApp:
    appId: com.prashantsharma.vedansh
    clearState: false
    arguments:
      RCT_jsLocation: "${typeof METRO_PORT === 'undefined' ? '127.0.0.1:8084' : '127.0.0.1:' + METRO_PORT}"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "आज के लिए|FOR TODAY"
    timeout: 30000
- openLink: "vedansh://widget/verse?sourceId=lakshmi-chalisa&verseIndex=0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: { id: "devotional-subject-lakshmi" }
    timeout: 20000
- takeScreenshot: e2e-shots/daily-full-lakshmi-cached
- tapOn: "Share verse"
- extendedWaitUntil:
    visible: "Card language: Hindi"
    timeout: 20000
- tapOn: "Card language: Hindi"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: e2e-shots/daily-full-lakshmi-share-hi
- tapOn: "Share to other apps"
- extendedWaitUntil:
    visible: "Copy|Save Image|AirDrop"
    timeout: 30000
- takeScreenshot: e2e-shots/daily-full-lakshmi-export-hi-sheet
