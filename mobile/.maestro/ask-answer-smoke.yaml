# जिज्ञासा · Ask Vedansh — answer path (PRD-25 Phases 1 + 3, design.md §67)
#
# The Search box answers a QUESTION above the library results. This flow asks
# the bhog question the PRD opens with, reads the answer card, expands its
# "show the working" trail, takes the primary action into Observance Detail,
# and then uses that screen's ask-from-context row to ask a follow-up that
# resolves against the seeded observance without naming it.
#
# Verifies:
#   1. FAB → Search; typing "what to offer ganesha" renders an answer card
#      (a11y "Answer. <headline>") headed "Naivedya for Shri Ganesha".
#   2. The card carries the निषेध row (Tulsi) and a collapsed working trail that
#      expands on tap to name the registry entry it read (ganesha-bhog).
#   3. The primary action ("Observance") lands on Ganesh Chaturthi's detail on
#      the Panchang stack.
#   4. The detail's "Ask about Ganesh Chaturthi" row reopens Search seeded; the
#      bare word "katha" then answers with that observance's katha.
#
# Language: English first (same recipe as search-smoke) — the card's headline,
# labels and actions read from the English half of every Localized string.
#
# Selector notes (verified against AskAnswerCard.tsx / SearchScreen.tsx /
# ObservanceDetailScreen.tsx):
#   - Answer card a11y label: "Answer. <headline.en>"; abstain card: "No answer"
#     or "Question declined".
#   - The working toggle exposes "Show the working" (English mode).
#   - Action buttons expose their English label; bhog.offer's first action is
#     "Observance", katha.find's is "Read katha".
#   - The ask-from-context row exposes "Ask about <rule.nameEn>".

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# ── Reading language → English ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd

# ── 1. Ask the question ──
- tapOn: "Search verses, sections, and mantras"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Search input"
    timeout: 15000
- tapOn: "Search input"
- inputText: "what to offer ganesha"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Answer.*"
    timeout: 15000
- assertVisible: "Naivedya for Shri Ganesha"

# ── 2. The निषेध row and the working trail ──
- assertVisible: ".*Tulsi.*"
- assertNotVisible: ".*ganesha-bhog.*"
- tapOn: "Show the working"
- waitForAnimationToEnd
- assertVisible: ".*ganesha-bhog.*"

# ── 3. The primary action opens the observance ──
- tapOn: "Observance"
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: "Ganesh Chaturthi"
    timeout: 15000

# ── 4. Ask-from-context: the seeded follow-up ──
- scrollUntilVisible:
    element:
      text: "Ask about Ganesh Chaturthi"
    centerElement: true
- tapOn: "Ask about Ganesh Chaturthi"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Search input"
    timeout: 15000
- tapOn: "Search input"
- inputText: "katha"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Answer.*"
    timeout: 15000
- assertVisible: "Read katha"

- stopApp:
    appId: com.prashantsharma.vedansh
