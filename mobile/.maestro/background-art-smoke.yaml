# Devotional background art smoke (PR #306)
#
# PR #306 added dedicated devotional background plates (11 new deity plates +
# a Kavacham category plate) wired through data/backgrounds.ts. Maestro cannot
# assert pixels, so this flow proves the runtime half: every screen that
# resolves one of the NEW plates must render its content (a broken asset
# require crashes the screen before its list draws), and each surface is
# screenshotted for visual review.
#
# Covered new plates:
#   - deity_shani                    → पाठ → deity index → Shani Dev (DeityListScreen)
#   - deity_kali                     → deity index → Maa Kali
#   - category_kavacham_protection   → पाठ → Kavacham (CategoryListScreen)
#
# Data-side completeness (every deity/category resolves a plate, no dangling
# keys) is pinned by src/data/__tests__/backgrounds.coverage.jest.test.ts;
# this flow is the runtime/visual half.
#
# Selector notes: deity cards expose "<NameEn>. …" merged labels (wildcard the
# tail); category tiles use the badge-tolerant "X\..*Tap to open\." form.

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# ── Home → पाठ → deity index → Shani Dev (new deity_shani plate) ──
# The Home "By Deity" tile retired with the grid: the देवता rail now leads the
# पाठ library, and its "All N deities" overflow chip opens the same index
# (TRD-42 §5.3). The count is registry-derived, so match it as \\d+.
- runFlow: _open-library.yaml
- scrollUntilVisible:
    element:
      text: "All \\d+ deities"
    direction: UP
    timeout: 10000
- tapOn: "All \\d+ deities"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Shani Dev\\..*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Shani Dev\\..*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Shani Ashtakam.*"
    timeout: 15000
- takeScreenshot: /tmp/vedansh-bg-art-shani
- tapOn: "Back"
- waitForAnimationToEnd

# ── Deity index → Maa Kali (new deity_kali plate) ──
- scrollUntilVisible:
    element:
      text: "Maa Kali\\..*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Maa Kali\\..*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kalika Ashtakam.*"
    timeout: 15000
- takeScreenshot: /tmp/vedansh-bg-art-kali
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Back"
- waitForAnimationToEnd

# ── Back out to the पाठ library → Kavacham (category_kavacham_protection) ──
- scrollUntilVisible:
    element:
      text: "Kavacham\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 30000
- tapOn: "Kavacham\\..*Tap to open\\."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Rama Raksha Stotra.*Tap to open\\."
    timeout: 15000
- takeScreenshot: /tmp/vedansh-bg-art-kavacham

- stopApp:
    appId: com.prashantsharma.vedansh
