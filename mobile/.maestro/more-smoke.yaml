# More Tab — Profile, Disclaimer & Settings Cards Smoke Test
#
# The More tab (MoreScreen) is the app's settings/profile hub, but every other
# flow only PASSED THROUGH it to flip the reading language — its contents were
# never asserted. This flow covers three previously-untested surfaces that all
# live under More:
#   • the More cards themselves (Wishlist / Reminders / Language / About) — PR #66
#   • the Sadhak Profile insights screen, incl. the lifetime/monthly/daily
#     range toggle — PR #33
#   • the About & Disclaimer modal (foundational; src/data/help/content.ts)
#
# Language is set to English on the More "Language" card so Profile's English
# stat/range labels are assertable, then restored to Hindi before the modal
# (the More card titles + disclaimer headings are hardcoded English, so they
# read the same in either language).
#
# Selector notes:
#   • The More redesign uses single-language row labels, so rows are matched by
#     their composed English a11y labels: "Wishlist, N verses saved",
#     "Reminders, …", "Language, <current>", the Profile row is "Open Sadhak
#     profile", and About is "About and disclaimer".
#   • Language & Reading-size are no longer inline — the row opens a bottom-sheet
#     picker. Set English by tapping the "Language, …" row, then "English" in the
#     sheet (selecting closes the sheet).
#   • ProfileScreen's back button is an unlabeled "‹" glyph — the only one on
#     the screen — so it is tapped directly.
#   • The disclaimer Modal is presentationStyle pageSheet; config.yaml's
#     snapshotKeyHonorModalViews:false lets Maestro read its RN content.
#     "Disclaimer & Fair Use" is helpContent.en.disclaimerHeading.

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# ── Open More, set reading language to English (Language row → picker sheet) ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Language,.*"
    timeout: 15000
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- extendedWaitUntil:
    visible: "English"
    timeout: 10000
- tapOn: "English"
- waitForAnimationToEnd

# ── Assert the More cards render (Pressables expose composed a11y labels —
#    "Wishlist, N verses saved", "Reminders, daily verse …" — so match with .*) ──
- assertVisible: "Wishlist.*"
- assertVisible: "Reminders.*"
# The Instagram row is present but never tapped — tapping leaves the app for the
# Instagram profile (browser or installed app), which the flow can't come back from.
- scrollUntilVisible:
    element:
      text: "Follow on Instagram"
    centerElement: true
- assertVisible: "Follow on Instagram"
- scrollUntilVisible:
    element:
      text: "Open Sadhak profile"
    centerElement: true

# ── Sadhak Profile: insights screen + lifetime/monthly/daily range toggle ──
- tapOn: "Open Sadhak profile"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sadhak"
    timeout: 15000
- assertVisible: "DAY STREAK"
- assertVisible: "Lifetime"
# Switch range → Monthly shows the current month caption; Daily shows "Today".
- tapOn: "Monthly"
- waitForAnimationToEnd
# Month caption is "<Month> <Year>" (ProfileScreen EN_MONTHS) — match ANY month
# so the flow doesn't rot each calendar month (was hardcoded "June").
- assertVisible: "(January|February|March|April|May|June|July|August|September|October|November|December) 20\\d\\d"
- tapOn: "Daily"
- waitForAnimationToEnd
- assertVisible: "Today"
# Back to More (unlabeled "‹" glyph — the only one on Profile).
- tapOn: "‹"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Wishlist.*"
    timeout: 15000

# ── Restore Hindi (best-effort): reopen the Language sheet and pick Hindi ──
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
    optional: true
- tapOn:
    text: "Language,.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Hindi"
    optional: true
- waitForAnimationToEnd

# ── About & Disclaimer modal: opens, shows content, closes ──
# The link Pressable's a11y label is "About and disclaimer" (the visible text is
# "About & Disclaimer") — match both with a tolerant pattern.
- scrollUntilVisible:
    element:
      text: "About.*[Dd]isclaimer.*"
    centerElement: true
- tapOn: "About.*[Dd]isclaimer.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Disclaimer & Fair Use"
    timeout: 10000
- tapOn: "Close"
- waitForAnimationToEnd
- assertVisible: "About.*[Dd]isclaimer.*"

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: com.prashantsharma.vedansh
