appId: com.prashantsharma.vedansh
---
# Run on an installed native app after the shared launch/language setup.
# Browser screenshots and this parsed flow are not native verification.
- runFlow: _launch.yaml
- openLink: "vedansh://widget/panchang?date=2026-11-08"
- scrollUntilVisible:
    element:
      id: "compact-occasion-card"
    direction: DOWN
- assertVisible: "17:55.*19:50"
- takeScreenshot: occasion-diwali
- scrollUntilVisible:
    element: { id: compact-occasion-open-vrat }
    direction: DOWN
- tapOn: { id: compact-occasion-open-vrat }
- extendedWaitUntil:
    visible: { id: occasion-timings-card }
    timeout: 30000
- assertNotVisible: { id: compact-occasion-card }
- takeScreenshot: occasion-diwali-vrat
- scrollUntilVisible:
    element: { id: occasion-detail-diwali-lakshmi }
    direction: DOWN
- tapOn: { id: occasion-detail-diwali-lakshmi }
- waitForAnimationToEnd
- tapOn: Back
- scrollUntilVisible:
    element: { id: occasion-timings-card }
    direction: UP
- takeScreenshot: occasion-diwali-vrat-back
# Proposal 08: reach the individual share from the retained dated catalog.
# Native payload inspection (including Copy) is documented in the review checklist.
- scrollUntilVisible:
    element: { id: occasion-share }
    direction: DOWN
- tapOn: { id: occasion-share }
- tapOn: "Card language: English"
- scrollUntilVisible:
    element: { text: "Send as text" }
    direction: DOWN
- assertVisible: "Send as text"
- tapOn: "Cancel"
- assertVisible: { id: occasion-share }
- openLink: "vedansh://widget/panchang?date=2026-10-20"
- scrollUntilVisible:
    element:
      id: "compact-occasion-card"
    direction: DOWN
- assertVisible: "13:59.*14:44"
- takeScreenshot: occasion-shastra
- openLink: "vedansh://widget/panchang?date=2026-11-12"
- assertNotVisible:
    id: "compact-occasion-card"
- takeScreenshot: occasion-ordinary
