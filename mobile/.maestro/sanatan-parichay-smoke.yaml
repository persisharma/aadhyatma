# Requires a native build of this branch. Research bibliography must not appear in the app.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- runFlow: _sanatan-home-entry.yaml
- takeScreenshot: e2e-shots/sanatan-entry-home
- tapOn: { id: home-sanatan-card }
- tapOn: { id: lang-toggle-en }
- assertVisible: "Every tradition.*"
- takeScreenshot: e2e-shots/sanatan-entry-hub
- tapOn: { id: sanatan-search }
- inputText: "33 koti devta"
- pressKey: Enter
- runFlow:
    file: _sanatan-reveal-row.yaml
    env: { ROW_ID: "sanatan-collection-thirty" }
- tapOn: "Thirty-three devata"
- runFlow:
    file: _sanatan-reveal-row.yaml
    env: { ROW_ID: "sanatan-start" }
- tapOn: { id: sanatan-start, retryTapIfNoChange: true }
- scrollUntilVisible:
    element: { text: "Save for later", above: { id: tab-home } }
    direction: DOWN
    timeout: 60000
- tapOn: "Save for later"
- runFlow:
    file: _sanatan-reveal-row.yaml
    env: { ROW_ID: "sanatan-next" }
- tapOn: { id: sanatan-next, retryTapIfNoChange: true }
- assertVisible: "2\\s*/\\s*3"
# The illustrated lesson now explains the 33 deities on its teaching plate.
- scrollUntilVisible:
    element: { id: sanatan-plate-thirty, above: { id: tab-home } }
    direction: DOWN
    timeout: 60000
- assertVisible: "In this Upanishadic dialogue, 8 Vasus, 11 Rudras, 12 Adityas, Indra and Prajapati make 33[.]"
- takeScreenshot: e2e-shots/sanatan-thirty-three-en
- assertNotVisible: "Sources & context"
- assertNotVisible: "https?://.*"
- tapOn: Back
- tapOn: Back
- scrollUntilVisible:
    element: { id: sanatan-search, text: "33 koti devta" }
    direction: UP
    timeout: 60000
# Relaunch without clearing AsyncStorage: resume must restore the exact second page.
- stopApp
- launchApp:
    clearState: false
    arguments:
      RCT_jsLocation: "${typeof METRO_PORT === 'undefined' ? '127.0.0.1:8084' : '127.0.0.1:' + METRO_PORT}"
- extendedWaitUntil:
    visible: { id: tab-home }
    timeout: 90000
- tapOn:
    text: "Maybe later"
    optional: true
- runFlow: _sanatan-home-entry.yaml
- tapOn: { id: home-sanatan-card }
- runFlow:
    file: _sanatan-reveal-row.yaml
    env: { ROW_ID: "sanatan-resume" }
- tapOn: { id: sanatan-resume }
- assertVisible: "2\\s*/\\s*3"
