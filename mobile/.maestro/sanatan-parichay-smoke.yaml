# Requires a native build of this branch. Source credits must stay inside the app.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- runFlow: _sanatan-home-entry.yaml
- takeScreenshot: e2e-shots/sanatan-entry-home
- tapOn: { id: home-sanatan-card }
- tapOn: { id: lang-toggle-en }
- assertVisible: "Every tradition.*"
- takeScreenshot: e2e-shots/sanatan-entry-hub
- tapOn: { id: sanatan-search }
- inputText: "33 koti devta"
- pressKey: Enter
- runFlow:
    file: _sanatan-scroll-text.yaml
    env: { TARGET: "Thirty-three devata" }
- tapOn: "Thirty-three devata"
- runFlow:
    file: _sanatan-scroll-id.yaml
    env: { TARGET: sanatan-start }
- tapOn: { id: sanatan-start }
- runFlow:
    file: _sanatan-scroll-text.yaml
    env: { TARGET: "Save for later" }
- tapOn: "Save for later"
- runFlow:
    file: _sanatan-scroll-id.yaml
    env: { TARGET: sanatan-next }
- tapOn: { id: sanatan-next }
- assertVisible: "2\\s*/\\s*3"
- runFlow:
    file: _sanatan-scroll-text.yaml
    env: { TARGET: "11 · Rudras" }
- tapOn: "11 · Rudras"
- runFlow:
    file: _sanatan-scroll-text.yaml
    env: { TARGET: "Ten pranas and the self.*" }
- takeScreenshot: e2e-shots/sanatan-thirty-three-en
- runFlow:
    file: _sanatan-scroll-text.yaml
    env: { TARGET: "Sources & context" }
- tapOn: "Sources & context"
- assertVisible: "This is a short editorial introduction.*"
- assertNotVisible: "https?://.*"
- tapOn: Back
- tapOn: Back
- tapOn: Back
- assertVisible: "33 koti devta"
# Relaunch without clearing AsyncStorage: resume must restore the exact second page.
- stopApp
- launchApp:
    clearState: false
    arguments:
      RCT_jsLocation: "${typeof METRO_PORT === 'undefined' ? '127.0.0.1:8084' : '127.0.0.1:' + METRO_PORT}"
- extendedWaitUntil:
    visible: { id: tab-home }
    timeout: 90000
- tapOn:
    text: "Maybe later"
    optional: true
- runFlow: _sanatan-home-entry.yaml
- tapOn: { id: home-sanatan-card }
- runFlow:
    file: _sanatan-scroll-id.yaml
    env: { TARGET: sanatan-resume }
- tapOn: { id: sanatan-resume }
- assertVisible: "2\\s*/\\s*3"
