# Theerth Category Smoke Test (PRD-08)
#
# Verifies the pilgrimage information architecture end-to-end:
#   Home → Pilgrimage tile → LISTING (By State / By Category toggle, no map,
#   no ＋ add-to-routine) → drill into a category → real India map + flat
#   single-category list → tap a temple → detail with sourced "Sources" footer
#   → back to the listing → switch to By State.
#
# Loads THIS worktree's bundle directly via openLink so the run is deterministic
# even when several Conductor worktrees each serve a "Vedansh" dev server.
# Override the port per worktree by editing the openLink line below.
#
# Notes:
#  - Maestro anchors a text selector to an element's FULL text. The Pilgrimage
#    tile carries a NEW badge → ".*Pilgrimage.*Tap to open.*"; detail prose →
#    ".*Sources.*".
#  - In a drill-in a temple is both a map pin and a list row → pin tap uses index 0.
appId: com.prashantsharma.vedansh
---
# Native dev-client build: launch reconnects to Metro and lands on Home.
- launchApp:
    appId: com.prashantsharma.vedansh
    clearState: true
- waitForAnimationToEnd:
    timeout: 30000
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Don't Allow"
    optional: true
- tapOn:
    text: "Skip tour"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Got it"
    optional: true

# Home → Pilgrimage tile lands directly on the Theerth listing (no intermediate
# library-entry list anymore). The tile shows a NEW badge → regex.
- extendedWaitUntil:
    visible: ".*Pilgrimage.*Tap to open.*"
    timeout: 120000
- tapOn: ".*Pilgrimage.*Tap to open.*"
- waitForAnimationToEnd

# Listing: force English, then confirm the By State / By Category toggle is here.
- tapOn: "English"
- waitForAnimationToEnd
- assertVisible: "By State"
- assertVisible: "By Category"

# By Category (default) → drill into Char Dham (a flat, single-category list).
- tapOn: "Char Dham"
- waitForAnimationToEnd:
    timeout: 15000

# Tap a temple on the real map (index 0 = the map pin) → detail with sourced prose.
- tapOn:
    text: "Dwarkadhish"
    index: 0
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: ".*Sources.*"
    timeout: 15000

# Back to the drill-in, back to the listing, then switch to By State.
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "By State"
- waitForAnimationToEnd
- assertVisible: "Gujarat"

- stopApp:
    appId: com.prashantsharma.vedansh
