# Theerth Category Smoke Test (PRD-08)
#
# Verifies the real-India-map pilgrimage surface end-to-end:
#   Home → Pilgrimage tile → Famous Theerths → real map renders →
#   tap a pin → temple detail (with the §10.3 pending-verification placeholder) →
#   back → By-State view (compact map + state-focus hint).
#
# Loads THIS worktree's bundle directly via openLink (instead of the project-list
# tap) so the run is deterministic even when several Conductor worktrees each
# serve a "Vedansh" Expo dev server. Override the port per worktree:
#   maestro test -e EXPO_URL=exp://127.0.0.1:8083 .maestro/theerth-smoke.yaml
#
# Note: Maestro anchors a text selector to an element's FULL text, so labels
# with a subtitle use `<name>\..*Tap to open\.` and the detail-screen prose
# uses `.*RULEBOOK.*`.
appId: host.exp.Exponent
---
- stopApp:
    appId: host.exp.Exponent
# Point this at your worktree's Metro dev server (Expo default is 8081; use a
# distinct port if another Conductor worktree already holds 8081).
# Verified passing end-to-end against this worktree's Metro on port 8083.
- openLink:
    link: "exp://127.0.0.1:8081"

# Home → Theerth (Pilgrimage) category
- extendedWaitUntil:
    visible: "Pilgrimage. Tap to open."
    timeout: 120000
- tapOn: "Pilgrimage. Tap to open."
- waitForAnimationToEnd

# Open the all-temples map ("Famous Theerths" LibraryCard carries a subtitle)
- extendedWaitUntil:
    visible: "Famous Theerths\\..*Tap to open\\."
    timeout: 15000
- tapOn: "Famous Theerths\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000

# Force English so the view-mode labels are deterministic, then confirm the
# real TheerthMap surface rendered.
- tapOn: "English"
- waitForAnimationToEnd
- assertVisible: "By State"
- assertVisible: "By Yatra"

# Tap a pin on the real map → temple detail. Dense pin clusters may open a
# neighbouring temple, so assert the temple-agnostic §10.3 placeholder.
- tapOn: "Somnath"
- waitForAnimationToEnd:
    timeout: 15000
- extendedWaitUntil:
    visible: ".*RULEBOOK.*"
    timeout: 15000

# Back to the map, then switch to the By-State view (compact map + highlight)
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "By State"
- waitForAnimationToEnd
- assertVisible: "Tap a state name to locate it on the map"

# Clean up so the next flow starts from a cold launch.
- stopApp:
    appId: host.exp.Exponent
