# Japam Alarms end-to-end flow (JS/UI layer).
# Covers the full editor surface: add → repeat-day chips → label input →
# confirm → row summary → edit → skip-next → toggle → delete-path entry.
# Native alarm firing is NOT covered (no native module in Expo Go) — expected.
#
# Editor controls are addressed via accessibility labels ("Repeat Monday",
# "Alarm label", "Confirm alarm", "Skip next alarm"). If the transparent
# Modal's tree is invisible to Maestro on iOS Expo Go, run this flow on an
# Android target where Modal children are part of the view hierarchy.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# Set reading language to English for stable assertions
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- tapOn: "Language,.*"   # More now opens a Language picker sheet, not inline pills
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd

# (1) Japam Alarms card on the More screen (entry point).
# The card is a Pressable with an explicit accessibilityLabel, which collapses
# its child Text — so match the a11y label, not the inner "Japam Alarms" text.
- assertVisible: "Japam alarms, none set"
- takeScreenshot: jalarms-1-more-card

# (2) Open the Japam Alarms screen — empty state
- tapOn: "Japam alarms, none set"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "No alarms yet"
    timeout: 10000
- assertVisible: "Add your first Japam alarm to begin."
- takeScreenshot: jalarms-2-empty

# (3) Open the new-alarm editor: day chips + label input + preview must render.
- tapOn: "Add alarm"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Repeat Sunday"
    timeout: 10000
- assertVisible: "Repeat Saturday"
- assertVisible: "Alarm label"
- assertVisible: "Next ring preview"
- takeScreenshot: jalarms-3-editor

# (4) Repeat selection: deselect Sunday + Saturday → "Weekdays"
- tapOn: "Repeat Sunday"
- tapOn: "Repeat Saturday"
- assertVisible: "Weekdays"

# (5) Label the alarm
- tapOn: "Alarm label"
- inputText: "Morning Japa"
- hideKeyboard
- takeScreenshot: jalarms-4-editor-filled

# (6) Confirm add (defaults to 06:00, first mantra). The row's a11y label is
# stable 24h regardless of the device's 12/24h display convention.
- tapOn: "Confirm alarm"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Edit alarm at 06:00"
    timeout: 10000
- takeScreenshot: jalarms-5-after-add

# (7) Reopen in EDIT mode — the skip-next control only exists here.
- tapOn: "Edit alarm at 06:00"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Skip next alarm"
    timeout: 10000
- tapOn: "Skip next alarm"
- takeScreenshot: jalarms-6-skip-armed
- tapOn: "Confirm alarm"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Edit alarm at 06:00"
    timeout: 10000
- takeScreenshot: jalarms-7-after-skip-save

# (8) Toggle the alarm switch off (persistence write path)
- tapOn: "Toggle alarm"
- waitForAnimationToEnd
- takeScreenshot: jalarms-8-toggled

# (9) Reopen editor once more (proves edit entry-point + persistence read)
- tapOn: "Edit alarm at 06:00"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Confirm alarm"
    timeout: 10000
- takeScreenshot: jalarms-9-editor-edit

- stopApp:
    appId: com.prashantsharma.vedansh
