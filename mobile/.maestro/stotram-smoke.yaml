# Stotram Category Smoke Test
#
# Verifies the Stotram category and its 7 active sections render correctly.
# Sections: Shiva Stotram, Durga Stotram, Ganesh Stotram, Vishnu Sahasranama
#           Excerpt, Krishna Stotram, Sankat Mochan Hanuman Ashtak, Bajrang Baan,
#           Ram Stuti.
#
# Opens Bajrang Baan as the representative reader — it has a smoke test
# (BajrangBaanReaderScreen.test.tsx) which validates first-verse render,
# matching this Maestro flow's check.

appId: host.exp.Exponent
---
- runFlow: _launch.yaml

# Open Stotram category. The tile label is "Hymns & Praise. Tap to open." but
# becomes "Hymns & Praise. New. Tap to open." for upgrading users (stotram holds
# debut-new sections). The `.*` tolerates either form — this flow verifies the
# category opens, not its badge state (that's new-content-badge-*-smoke's job).
- assertVisible: "Hymns & Praise\\..*Tap to open\\."
- tapOn: "Hymns & Praise\\..*Tap to open\\."
- waitForAnimationToEnd

# Verify all 8 sections appear in CategoryList (post-merge adds Krishna Stotram).
# Top half visible immediately; bottom entries require scrolling.
- extendedWaitUntil:
    visible: "Shiva Stotram\\..*Tap to open\\."
    timeout: 15000
- assertVisible: "Durga Stotram\\..*Tap to open\\."
- assertVisible: "Ganesh Stotram\\..*Tap to open\\."
- assertVisible: "Vishnu Sahasranama Excerpt\\..*Tap to open\\."
- assertVisible: "Krishna Stotram\\..*Tap to open\\."
# Scroll to reveal the lower entries
- scrollUntilVisible:
    element:
      text: "Ram Stuti\\..*Tap to open\\."
    direction: DOWN
    timeout: 10000
- assertVisible: "Sankat Mochan Hanuman Ashtak\\..*Tap to open\\."
- assertVisible: "Bajrang Baan\\..*Tap to open\\."

# Open Bajrang Baan reader
- tapOn: "Bajrang Baan\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss Resume sheet if a prior session left reading progress
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd

# Language toggle test
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: "Hindi"
- waitForAnimationToEnd

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: host.exp.Exponent
