# Feature Tour — first-launch walkthrough e2e
#
# The tour auto-shows once per install and then never again, which is not
# deterministic to assert from a shared simulator whose AsyncStorage persists
# between flows. Instead we drive it through the **replay** affordance
# (More → "Show App Tour"), which calls resetTour() and re-opens the
# same overlay from step 1 — identical UI to the first-launch path, but on
# demand.
#
# What this covers:
#   • replay entry point on the More hub
#   • the overlay renders step 1 with Skip + Next controls
#   • Next drives the walk-through forward AND navigates the live app across the
#     whole sequence — the 5 tabs, then the Home routine card / categories /
#     Japa (+ mantra list) / Theerth (+ map), Bhakti verse + share, the Panchang
#     muhurat → vrat drill, the Bhajan library, the More reminder/alarm drill,
#     and the More Language + Reading Size rows that close the walkthrough
#   • Back steps returns to the previous step
#   • Done on the final step dismisses the tour
#   • the first-run setup sheet then opens: all four languages offered, a size
#     pick keeps it open, and "Begin" applies + dismisses it
#
# Selector notes:
#   • The replay row's visible label and a11y label are both the constant
#     English "Show App Tour" for `en`; the a11y label stays "Show App Tour" in
#     every language, so matching it works whatever reading language persists.
#   • Tour controls expose constant a11y labels: "Skip tour", "Next step",
#     "Previous step", "Done" — matched directly rather than the bilingual
#     visible captions ("Next · आगे" etc.).
#   • Each step's English subtitle ("Home", "Panchang", …) renders regardless
#     of language (the tour is intentionally bilingual), so it is a stable
#     per-step anchor.

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# ── Open More and replay the tour ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Show App Tour"
    centerElement: true
- tapOn: "Show App Tour"
- waitForAnimationToEnd

# ── Step 1: Home (tab) ──
# Wait for the overlay itself to mount — "Skip tour" is tour-only, whereas "Home"
# is exposed both as the tour subtitle and (as "Home, tab, 1 of 5") by the tab
# bar; waiting on the Skip control avoids passing before the tour has rendered.
# NB: controls expose only their a11y label ("Skip tour"), and Maestro matches
# the WHOLE string — "Skip" alone never matches "Skip tour".
- extendedWaitUntil:
    visible: "Skip tour"
    timeout: 10000
- assertVisible: "Home"

# ── Walk forward through every step, asserting each card's English subtitle ──
# Tabs 2–5
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Daily Bhakti"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Panchang"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Bhajan"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "More"

# Home: routine card, categories, Japa (+ mantra list), Theerth (+ map)
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Daily Practice"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Categories"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Japa"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Japa . Mantras"   # step titleEn is "Japa — Mantras" (— matched by .)

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Pilgrimage"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Sacred Journeys"

# Bhakti: verse + share
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Daily Verse"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Share"

# Panchang: muhurat → vrat & parv → vrat list → follow → My Vrat
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Daily Muhurat"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Vrat . Parv"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Vrat List"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Follow a Vrat"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "My Vrat . Reminders"

# Bhajan library
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Bhajan Library"

# More: daily reminder → reminder times → japam alarm
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Daily Reminder"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Reminder Times"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Japam Alarm"

# More: the two settings the setup sheet asks for right after the tour
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Language"

- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Reading Size"

# ── Back returns to the previous step ──
- tapOn: "Previous step"
- waitForAnimationToEnd
- assertVisible: "Language"

# ── Forward again to the final step, then finish ──
- tapOn: "Next step"
- waitForAnimationToEnd
- assertVisible: "Reading Size"
- tapOn: "Done"
- waitForAnimationToEnd

# ── Tour dismissed: its controls are gone ──
- assertNotVisible: "Skip tour"
- assertNotVisible: "Next step"

# ── The first-run setup sheet takes over: pick a language + size, then Begin ──
# resetTour() clears the setup key too, so the replay path reproduces the real
# fresh-install sequence (tour → setup sheet) deterministically.
- extendedWaitUntil:
    visible: "Choose your reading language"
    timeout: 10000
# All four languages are offered, each labelled with its constant English a11y
# name (the sheet's own chrome is bilingual hi+en — no language is set yet).
- assertVisible: "Gujarati"
- assertVisible: "Kannada"
- tapOn: "Hindi"
- waitForAnimationToEnd
# Size pills live in the same sheet; picking one does NOT dismiss it.
- tapOn: "Large reading size"
- waitForAnimationToEnd
- assertVisible: "Choose your reading language"
- tapOn: "Standard reading size"
- waitForAnimationToEnd
- tapOn: "Begin"
- waitForAnimationToEnd
- assertNotVisible: "Choose your reading language"

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: com.prashantsharma.vedansh
