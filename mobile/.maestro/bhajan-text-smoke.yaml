# Bhajan Text Shelf Smoke Test (design.md §34.1, RULEBOOK §34)
#
# Path: Home → Bhajan tab → "Bhajan Lyrics" door → deity-grouped list →
# fold/unfold the first group → open its first bhajan → reader shows a stanza
# and the plain "Composed by" credit → Back → list → Back → Bhajan tab.
#
# The door is always shown (owner decision, 27 Nov 2026). With no bhajans yet
# it reads "Coming soon" and the shelf shows its empty line; the group/reader
# block below is guarded on a group header and runs once the first text ships.
#
# Selectors: the door's a11y label is "Bhajan Lyrics. <n> bhajans with meaning.
# Tap to open." in every reading language; group headers carry
# `bhajan-group-<groupId>`.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

- tapOn: { id: "tab-bhajan" }
- waitForAnimationToEnd

- tapOn: { id: "bhajan-shelf-door" }
- waitForAnimationToEnd
- assertVisible: { id: "bhajan-list" }

- runFlow:
    when:
      visible: { id: "bhajan-group-.*" }
    commands:
      # First group header folds closed and open again.
      - tapOn: { id: "bhajan-group-.*", index: 0 }
      - waitForAnimationToEnd
      - tapOn: { id: "bhajan-group-.*", index: 0 }
      - waitForAnimationToEnd
      # Open the first bhajan card (LibraryCard a11y label ends "Tap to open.").
      - tapOn: { text: ".*with meaning.*Tap to open.*", index: 0 }
      - waitForAnimationToEnd
      - assertVisible: { id: "bhajan-attribution" }
      - tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
      - waitForAnimationToEnd
      - assertVisible: { id: "bhajan-list" }

- runFlow:
    when:
      visible: { id: "bhajan-list-empty" }
    commands:
      - assertVisible: { id: "bhajan-list-empty" }

- tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
- waitForAnimationToEnd
- assertVisible: { id: "bhajan-shelf-door" }
