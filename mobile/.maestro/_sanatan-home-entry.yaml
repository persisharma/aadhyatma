# Swipe inside the outer Home margin, away from nested horizontal carousels.
appId: com.prashantsharma.vedansh
---
- repeat:
    times: 16
    while:
      notVisible: { id: home-sanatan-card }
    commands:
      - swipe:
          start: "97%, 82%"
          end: "97%, 30%"
          duration: 700
- scrollUntilVisible:
    element: { id: home-sanatan-card }
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- assertVisible: { id: home-sanatan-card }
