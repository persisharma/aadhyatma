# पितृ स्मरण — native end-to-end coverage for the complete prototype flow.
#
# Scope — what this flow covers and deliberately omits:
#   - COVERS the More → पितृ स्मरण row, the reverent empty state, adding an entry
#     through the month/paksha/tithi pickers (माघ कृष्ण अष्टमी — the PRD's
#     canonical example), the solved next-date row on the list, the detail hero +
#     गीता पाठ rows, and the delete confirm sheet. Add-then-delete is net zero,
#     so back-to-back runs stay clean.
#   - COVERS the pinned Vrat-catalog ledger row, the new-entry default-on
#     reminder, and the shared civil-date calendar's real select/confirm/derive
#     path.
#   - COVERS both stages of the detail screen's staged reveal (the hero pill is
#     solved and published ahead of अगले वर्ष / पितृ पक्ष) and a re-entry, which
#     reads the prewarmed answers back out of the persisted solve cache. Load
#     TIMING is not assertable here — the ms budget is pinned by the measurements
#     in design.md §63 and by the engine-call counts in the Jest suite.
#   - Calendar-year edge cases and notification fire dates remain pinned by pure
#     tests because OS time cannot be safely changed during a simulator flow.
#
# Selector notes (verified against the screens):
#   - The More row's a11y label is composed: "Pitru Smaran, none saved" /
#     "Pitru Smaran, N entries" — anchor with a wildcard.
#   - Picker chips expose constant English a11y labels ("Month Magha",
#     "Paksha Krishna", "Tithi Ashtami"); actions are "Add smaran", "Save smaran",
#     "Smaran Father, …" (list row), "Delete smaran entry", "Confirm delete".
#   - The default reading language is Hindi, so visible copy asserted here is
#     Devanagari; control labels stay English constants (Maestro-stable).

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# ── Empty catalog invitation remains a standing Panchang entry point ──
- tapOn: { id: "tab-panchang" }
- waitForAnimationToEnd
- tapOn: "Vrat & Parv"
- extendedWaitUntil:
    visible: "Pitru Smaran.*Add remembrance dates"
    timeout: 15000

# ── Open More → पितृ स्मरण ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Pitru Smaran.*"
    centerElement: true
- tapOn: "Pitru Smaran.*"
- waitForAnimationToEnd

# ── Empty state: two reverent lines + the add action ──
- extendedWaitUntil:
    visible: "अपने पितरों की तिथियाँ जोड़ें"
    timeout: 15000
- assertVisible: "Add smaran"

# ── Add flow (तिथि ज्ञात है): माघ कृष्ण अष्टमी for पिताजी ──
- tapOn: "Add smaran"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "स्मरण जोड़ें"
    timeout: 15000
- tapOn: "Relation Father"
- scrollUntilVisible:
    element:
      text: "Month Magha"
    centerElement: true
- tapOn: "Month Magha"
- scrollUntilVisible:
    element:
      text: "Paksha Krishna"
    centerElement: true
- tapOn: "Paksha Krishna"
- scrollUntilVisible:
    element:
      text: "Tithi Ashtami"
    centerElement: true
- tapOn: "Tithi Ashtami"
- scrollUntilVisible:
    element:
      text: "Save smaran"
    centerElement: true
- tapOn: "Save smaran"
- waitForAnimationToEnd

# ── List: one row, tithi caption in words, solved next date at right ──
- extendedWaitUntil:
    visible: ".*माघ कृष्ण अष्टमी.*"
    timeout: 15000
- assertVisible: ".*पिताजी.*"

# ── Same ledger is pinned under My Vrat in the Vrat & Parv catalog ──
- tapOn: { id: "tab-panchang" }
- waitForAnimationToEnd
- tapOn: "Vrat & Parv"
- extendedWaitUntil:
    visible: "Pitru Smaran.*1 entries"
    timeout: 15000
- tapOn: "Pitru Smaran.*1 entries"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*माघ कृष्ण अष्टमी.*"
    timeout: 15000

# ── Detail: hero + next pill + गीता पाठ rows ──
- tapOn: "^Smaran Father,.*$"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "श्राद्ध तिथि.*"
    timeout: 15000
- assertVisible: "अगला.*"
# The pill is published on its own solve; अगले वर्ष and पितृ पक्ष follow in a
# second stage. Both must actually arrive — asserting only the pill would pass
# even if stage two never ran.
- extendedWaitUntil:
    visible: "अगले वर्ष"
    timeout: 15000
- extendedWaitUntil:
    visible: "पितृ पक्ष.*में"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Smaran reminder"
    centerElement: true
- assertVisible: "Smaran reminder"
- scrollUntilVisible:
    element:
      text: "Open Gita — Adhyaya 15"
    centerElement: true
- assertVisible: "Open Gita — Adhyaya 15"
- scrollUntilVisible:
    element:
      text: "Open Gita — Adhyaya 2"
    centerElement: true
- assertVisible: "Open Gita — Adhyaya 2"

# ── Re-entry serves the cached answers: every row is present again ──
- tapOn: "Back"
- waitForAnimationToEnd
- tapOn: "^Smaran Father,.*$"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "अगला.*"
    timeout: 15000
- assertVisible: "अगले वर्ष"
- assertVisible: "पितृ पक्ष.*में"

# ── Delete round-trip: confirm sheet, then back to the empty state ──
- scrollUntilVisible:
    element:
      text: "Delete smaran entry"
    centerElement: true
- tapOn: "Delete smaran entry"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Confirm delete"
    timeout: 10000
- tapOn: "Confirm delete"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "अपने पितरों की तिथियाँ जोड़ें"
    timeout: 15000

# ── Civil-date branch reuses the shared calendar sheet ──
- tapOn: "Add smaran"
- waitForAnimationToEnd
- tapOn: "Only date known"
- tapOn: "Date of passing"
- extendedWaitUntil:
    visible: "देहावसान तिथि चुनें"
    timeout: 10000
- assertVisible: "Confirm date"
- tapOn: ".*Today"
- tapOn: "Confirm date"
- extendedWaitUntil:
    visible: "पंचांग से निकली तिथि — पुष्टि करें"
    timeout: 15000
- assertVisible: "Choose the tithi myself"
- tapOn: "Back"

# Clean up — termination resets navigation for the next flow.
- stopApp:
    appId: com.prashantsharma.vedansh
