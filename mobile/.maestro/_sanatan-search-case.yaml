appId: com.prashantsharma.vedansh
---
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element: { text: "Language,.*" }
    direction: DOWN
    timeout: 60000
- tapOn: "Language,.*"
- tapOn: "${READING_LANGUAGE}"
- extendedWaitUntil:
    visible: { text: "Language, ${READING_LANGUAGE}" }
    timeout: 15000
- tapOn: { id: tab-home }
- runFlow: _sanatan-home-entry.yaml
- tapOn: { id: home-sanatan-card }
- tapOn: { id: sanatan-search }
- inputText: "${QUERY}"
- pressKey: Enter
- assertVisible: { id: sanatan-search, text: "${QUERY}" }
# A matching card alone could be the unfiltered catalogue. Prove the empty
# result state, then restore the real query before capturing its matched topic.
- tapOn: { id: sanatan-search }
- eraseText
- inputText: "zzzz-no-match"
- pressKey: Enter
- scrollUntilVisible:
    element:
      text: "कोई परिचय नहीं मिला। दूसरा शब्द आज़माएँ।|No introductions found. Try another word.|કોઈ પરિચય નહીં મિલા। દૂસરા શબ્દ આજ઼માએઁ।|ಕೋಈ ಪರಿಚಯ ನಹೀಂ ಮಿಲಾ। ದೂಸರಾ ಶಬ್ದ ಆಜ಼ಮಾಏಁ।"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element: { id: sanatan-search }
    direction: UP
    timeout: 15000
- tapOn: { id: sanatan-search }
- eraseText
- inputText: "${QUERY}"
- pressKey: Enter
- assertVisible: { id: sanatan-search, text: "${QUERY}" }
- scrollUntilVisible:
    element: { id: sanatan-collection-symbols }
    direction: DOWN
    visibilityPercentage: 50
    timeout: 60000
- takeScreenshot: "e2e-shots/sanatan-search-${READING_LANGUAGE}"
