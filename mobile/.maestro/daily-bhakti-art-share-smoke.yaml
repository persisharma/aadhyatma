# Native preview in four scripts, then a real capture to the OS sheet without sending.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- openLink: "vedansh://widget/verse?sourceId=lakshmi-chalisa&verseIndex=0"
- runFlow:
    when: { visible: "Open" }
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: { id: "devotional-subject-lakshmi" }
    timeout: 15000
- tapOn: "Share verse"
- tapOn: "Card style: Daily Bhakti card"
- extendedWaitUntil:
    visible: "Card language: English"
    timeout: 20000
- scrollUntilVisible:
    element: { text: "Card language: Hindi" }
    direction: UP
- tapOn: "Card language: Hindi"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Share to other apps" }
    direction: DOWN
- assertVisible: "Share to other apps"
- takeScreenshot: e2e-shots/daily-art-share-hi
- scrollUntilVisible:
    element: { text: "Card language: English" }
    direction: UP
- tapOn: "Card language: English"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Share to other apps" }
    direction: DOWN
- assertVisible: "Share to other apps"
- takeScreenshot: e2e-shots/daily-art-share-en
- scrollUntilVisible:
    element: { text: "Card language: Gujarati" }
    direction: UP
- tapOn: "Card language: Gujarati"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Share to other apps" }
    direction: DOWN
- assertVisible: "Share to other apps"
- takeScreenshot: e2e-shots/daily-art-share-gu
- scrollUntilVisible:
    element: { text: "Card language: Kannada" }
    direction: UP
- tapOn: "Card language: Kannada"
- extendedWaitUntil:
    visible: { id: "devotional-preview-ready" }
    timeout: 20000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Share to other apps" }
    direction: DOWN
- assertVisible: "Share to other apps"
- takeScreenshot: e2e-shots/daily-art-share-kn
- scrollUntilVisible:
    element: { text: "Share to other apps" }
    direction: DOWN
- tapOn: "Share to other apps"
- extendedWaitUntil:
    visible: "Copy|Save Image|AirDrop"
    timeout: 30000
- takeScreenshot: e2e-shots/daily-art-native-share-sheet
