appId: com.prashantsharma.vedansh
---
- launchApp
- extendedWaitUntil:
    visible:
      id: store-update-heading
    timeout: 45000
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: store-update-heading
    timeout: 15000
- takeScreenshot: e2e-shots/${CAPTURE}
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: store-update-later
- assertNotVisible:
    id: store-update-heading
- extendedWaitUntil:
    visible: ".*Today.s Panchang.*|.*आज का पंचांग.*"
    timeout: 30000
