# Shared boot flow — used as a subflow at the start of every category smoke test.
#
# Why a separate file: the Expo Go launch + project select + first-load wait
# is identical across every smoke test. Keeping it here means a single change
# (e.g., the Expo Go version updates and the open URL changes) ripples to all
# flows at once.
#
# Caller contract:
#   - Caller's appId MUST be host.exp.Exponent (Expo Go).
#   - This flow exits with the Vedansh Home screen rendered and Maestro able
#     to read past the Expo dev-menu sheet (config.yaml sets
#     snapshotKeyHonorModalViews: false).
#   - The "Good Habits. Tap to open." assertion is the canary that confirms
#     the bundle finished executing.
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
- tapOn: "Vedansh"
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible: "Good Habits. Tap to open."
    timeout: 60000
