# Shared boot flow — used as a subflow at the start of every category smoke test.
#
# Why a separate file: the Expo Go launch + project select + first-load wait
# is identical across every smoke test. Keeping it here means a single change
# (e.g., the Expo Go version updates and the open URL changes) ripples to all
# flows at once.
#
# Caller contract:
#   - Caller's appId MUST be host.exp.Exponent (Expo Go).
#   - This flow exits with the Vedansh Home screen rendered and Maestro able
#     to read past the Expo dev-menu sheet (config.yaml sets
#     snapshotKeyHonorModalViews: false).
#   - The "Good Habits. Tap to open." assertion is the canary that confirms
#     the bundle finished executing.
#   - Expo Go can leave a native dev-menu bottom sheet open after project load;
#     the downward swipe dismisses it when present and is harmless on Home.
#   - On first launch one onboarding surface may auto-appear over Home and
#     block downstream flows until dismissed: a genuine fresh install gets the
#     feature tour (dismiss via "Skip"); a returning user on the debut release
#     gets the What's New sheet (dismiss via its "Close" ✕). Both optional taps
#     are harmless no-ops once the surface has been seen, and only one of them
#     is ever present at a time (they're mutually exclusive).
appId: host.exp.Exponent
---
- launchApp:
    appId: host.exp.Exponent
- tapOn: "Vedansh"
- waitForAnimationToEnd:
    timeout: 30000
- extendedWaitUntil:
    visible: "Good Habits\\..*Tap to open\\."
    timeout: 60000
# Dismiss whichever first-launch onboarding surface auto-appeared (fresh
# install → feature tour, dismissed via its "Skip tour" a11y label; returning
# user → What's New "Close"). The tour control exposes only its a11y label and
# Maestro matches the whole string, so this must be "Skip tour", not "Skip".
- tapOn:
    text: "Skip tour"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd
- swipe:
    direction: DOWN
- waitForAnimationToEnd
