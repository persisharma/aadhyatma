# Panchang Tab Smoke Test (PRD-07)
#
# Panchang is a BOTTOM-TAB screen (TabNavigator.tsx, tabBarLabel "Panchang"),
# NOT a Home category like the other smokes — so this flow taps the tab bar,
# not a CategoryCard.
#
# Verifies:
#   1. The Panchang tab is reachable from the bottom tab bar.
#   2. The screen renders the real astronomy engine output (the sun/moon time
#      block: Sunrise, Sunset, Moonrise, Brahma Muhurta).
#   3. The "Ujjain" reference header renders (the redundant on-screen "Panchang"
#      title/subtitle/pill were removed in the layout redesign — the bottom-tab
#      label "Panchang" is now the only on-screen occurrence).
#   4. The Purnimant/Amanta toggle renders and its selected state flips on tap
#      (the old "Reference: … · <system>" line was removed in the header redesign
#      — the segmented pill is now the only calendar-system indicator).
#   5. Compact date navigation changes the selected date.
#   6. The expandable calendar can move months and select a date.
#   7. The "Vrat & Observances" and "Upcoming" sections render.
#   8. Global reading-language switching (useGitaLanguage) reflects on the screen.
#   9. The Daily Muhurat glance card renders and lands (its "Today's Timings"
#      frame plus the solved Rahu Kaal / Abhijit tiles) — covering the
#      always-render skeleton + memoised-solve change (#190). The card used to
#      `return null` until the off-render solve landed, so it must now be present
#      as a stable frame first, then fill in with the real timings.
#
# Deliberately NOT asserted here — both are date-conditional, and this flow runs
# on whatever day the device is on:
#   - The kicker/Tithi-tile handover line ("then <Tithi> — rest of day") renders
#     only when the sunrise tithi hands over before midnight — most days, not all
#     (never on a kshaya day, nor when the tithi runs past the next sunrise).
#   - The moonrise-vrat line on a chandrodaya observance card ("Kept this
#     night — moonrise H:MM …") renders on ~one day a month.
#   Asserting either unconditionally would make this flow fail on a correct app.
#   They are pinned deterministically instead: prevailingTithi.test.ts and
#   observanceDates.test.ts (tsx, test:engine) and
#   MuhuratGlanceCardTithi.test.tsx (Jest) — see RULEBOOK §23.
#
# Why we switch to English first:
#   The screen reads the GLOBAL reading language (useGitaLanguage); the default
#   is Hindi, so most on-screen text is Devanagari, which Maestro's iOS
#   accessibility tree can't reliably read (see README "Element selection
#   rules"). We flip the default to English on the More tab, then assert the
#   real content in English. We restore Hindi at the end (best-effort).
#
# Selector notes (verified against the live iOS accessibility tree):
#   - Bottom tabs expose accessibilityText "<Label>, tab, N of 4", so we match
#     "Panchang, tab.*" / "More, tab.*". Bare "Panchang" does NOT match (the
#     regex is anchored). Bonus: "Panchang, tab.*" targets ONLY the tab, never
#     the "Panchang" disclosure card on the More screen — no ambiguity.
#   - "Sunrise"/"Sunset"/"Moonrise"/"Brahma Muhurta"/"Vrat & Observances"/
#     "Upcoming" are plain <Text> and appear ONLY on the Panchang screen → reliable.
#   - Calendar controls expose accessibility labels: "Next month",
#     "Previous month", and "Select <date>".
#   - The anga *names* (Shashthi, Ashwini, …) change with the run date and the
#     row labels (Tithi/Nakshatra/…) use textTransform:'uppercase' (exposed
#     value unreliable across RN versions), so we do NOT assert on those.
#
# No pixel coordinates — the shared launch flow dismisses Expo Go's native
# dev-menu sheet after config.yaml exposes the RN tree behind it.

appId: com.prashantsharma.vedansh
---
# ── Step 1: Boot Vedansh in Expo Go (exits on Home) ──
- runFlow: _launch.yaml

# ── Step 2: Set global reading language to English (More tab → Language picker) ──
# The More hub now shows the current reading language as a "Language" disclosure
# row (accessibilityLabel "Language, <current>") that opens LanguagePickerSheet —
# the old inline English/Hindi pills are gone (gu/kn added a 4-way picker). The
# sheet's rows opt out of the modal's accessibility wrappers (accessible={false}),
# so each language radio (accessibilityLabel = "English"/"Hindi"/…) is tappable.
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd

# ── Step 3: Open the Panchang tab ──
# "Panchang, tab.*" matches only the tab button, not the More "Panchang" card.
- tapOn: { id: "tab-panchang" }
- waitForAnimationToEnd

# ── Step 4: Assert the header, toggle, and calendar controls rendered (English) ──
# First open resolves the lunar calendar for festivals — allow generous time.
- extendedWaitUntil:
    visible: ".*Ujjain.*"   # Ujjain reference line = screen-loaded canary. (The bare
    timeout: 30000          #  "Panchang" tab label is exposed as "Panchang, tab, N of 4",
                            #  which never full-string-matches "Panchang" — drifted assertion.)
- assertVisible: ".*Ujjain.*"      # location chip label "Location: Ujjain"
- assertVisible: "Purnimant calendar system"
- assertVisible: "Amanta calendar system"
- assertVisible: "Today"
- assertVisible: "TITHI"
- assertVisible: "NAKSHATRA"
- assertVisible: "Expand calendar"
- tapOn: "Next date"
- waitForAnimationToEnd
# Next-date advanced the selection; confirm the panchang re-rendered (date-agnostic, and
# tolerant of the lazy off-render compute). Concrete date selection is verified below.
- extendedWaitUntil:
    visible: ".*Vikram Samvat.*"
    timeout: 10000
- tapOn: "Today"
- waitForAnimationToEnd
- tapOn: "Amanta calendar system"
- waitForAnimationToEnd
# The header redesign removed the "Reference: Ujjain, India · <system>" line; the
# calendar system is now shown ONLY as the segmented pill's selected state
# (accessibilityState.selected). Assert the tap flipped the selection.
- assertVisible:
    text: "Amanta calendar system"
    selected: true
- tapOn: "Expand calendar"
- waitForAnimationToEnd
- tapOn: "Next month"
- waitForAnimationToEnd
- tapOn: "Select 15 .*"
- waitForAnimationToEnd

# ── Step 5: Assert the Daily Muhurat glance card renders and lands (#190) ──
# The card sits directly under the date header, above the anga grid and the
# times card. It renders a "Today's Timings" skeleton frame immediately (no more
# `return null` pop-in), then fills in with the solved Rahu Kaal / Abhijit tiles
# a moment later. Assert the frame first (stable canary), then wait for the solve.
- scrollUntilVisible:
    element:
      text: "Today's Timings"
    direction: DOWN
    centerElement: true
    timeout: 10000
- extendedWaitUntil:
    visible: "Rahu Kaal"     # real card = solve landed (skeleton has no tile labels)
    timeout: 15000
- assertVisible: "Abhijit"

# ── Step 6: Assert the engine time block and observances render ──
# The time block is below the inline calendar on compact iPhone viewports.
- scrollUntilVisible:
    element:
      text: "Sunrise"
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible: "Sunset"
- assertVisible: "Moonrise"
- assertVisible: "Brahma Muhurta"
# Upcoming observances are resolved off the render path (just after first paint),
# so wait for the section to populate rather than asserting immediately.
- scrollUntilVisible:
    element:
      text: "Vrat & Observances"
    direction: DOWN
    centerElement: true
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Upcoming"              # observances section heading
    direction: DOWN
    centerElement: true
    timeout: 20000

# ── Step 7: Restore Panchang + language defaults (best-effort) ──
- scrollUntilVisible:
    element:
      text: ".*Ujjain.*"   # the "Location: Ujjain" chip in the sticky header (full-string match)
    direction: UP
    centerElement: true
    timeout: 20000
- tapOn: "Purnimant calendar system"
- waitForAnimationToEnd
- assertVisible:
    text: "Purnimant calendar system"
    selected: true
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
    optional: true
- tapOn:
    text: "Language,.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Hindi"
    optional: true
- waitForAnimationToEnd

# ── Cleanup — Expo Go termination resets navigation for the next flow ──
- stopApp:
    appId: com.prashantsharma.vedansh
