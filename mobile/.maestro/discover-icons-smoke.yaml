- assertVisible: "Add smaran"
- takeScreenshot: pitru-route
- tapOn: "Back"
- assertVisible: "Open Sadhak profile"
- tapOn: { id: "tab-home" }
- repeat:
    times: 9
    commands:
      - runFlow:
          when:
            notVisible: { id: "home-discover-jijnasa" }
          commands:
            - swipe: { start: "15%, 60%", end: "85%, 60%", duration: 800 }
