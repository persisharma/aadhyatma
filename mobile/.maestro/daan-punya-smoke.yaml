# दान-पुण्य Smoke Test (PRD-26, design.md §72)
#
# Covers the More-hub door, the educate-first home contract, and the
# ledger's 10-second entry path:
#   1. More → "Daan Punya, new" row opens the educate home.
#   1b. Today first: the today hero, a served-cause chip into its
#       दान-द्वार shelf, and the painted seva grid (design.md §73, Nov 2026).
#   2. The home renders the mahatva sections and NO give affordance —
#      the two standing doors sit in the sticky action bar and the
#      ledger door in the header (§2.7; the absence half is pinned in
#      DaanScreens.test.tsx, which this flow complements with the
#      presence half on device).
#   3. Ledger → entry form → category chip → save → entry visible.
#
# Language note (per home-today-smoke): default Hindi renders Devanagari,
# which Maestro's iOS tree can't read — flip to English on More first.
# Row/chip a11y labels are English by contract either way.
#
# Not covered here, deliberately: the Observance-Detail daan door (needs a
# daan-covered date — render condition pinned in unit tests), and the
# directory hand-off (Linking leaves the app; the interstitial contract is
# pinned in DaanScreens.test.tsx and the §6.1 store-review gate).

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# ── Global reading language → English (More → Language picker sheet) ──
- runFlow: _open-settings.yaml
- waitForAnimationToEnd
# The ऐप section (Language) sits below the fold on standard-height iPhones
# (the same scroll kundali-smoke.yaml uses); a blind tap misses the row.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd

# ── 1. More → Daan Punya ──
# The Language scroll can leave the Daan row out of view; bring it back.
- scrollUntilVisible:
    element:
      id: "more-daan-punya"
    direction: UP
    centerElement: true
- tapOn: { id: "more-daan-punya" }
- waitForAnimationToEnd
- assertVisible: "Daan Punya"

# ── 1b. Today first (design.md §73, Option B): today's vaar items and the
# causes they serve lead the home, before the week and the teaching. ──
- extendedWaitUntil:
    visible:
      id: "daan-today-hero"
    timeout: 15000
- assertVisible:
    id: "daan-today-items"
- takeScreenshot: daan-home-today
# A served-cause chip (painted icon + name) opens that cause's दान-द्वार shelf,
# which leads with the cause's mahatva. The regex skips the chips' icon ids.
- scrollUntilVisible:
    element:
      id: "daan-today-cause-[a-z]+"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn:
    id: "daan-today-cause-[a-z]+"
    index: 0
- waitForAnimationToEnd
- assertVisible:
    id: "daan-directory-filtered"
- takeScreenshot: daan-directory-cause
- tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
- waitForAnimationToEnd
# Option B: the three short reads sit between the vaar card and the seva grid.
- scrollUntilVisible:
    element:
      id: "daan-read-1"
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: daan-home-reads
# Each read opens the Learn reader at that page; Next walks the reads.
- tapOn:
    id: "daan-read-1"
- waitForAnimationToEnd
- assertVisible:
    id: "daan-learn-read-1"
- assertVisible:
    id: "daan-learn-dwaar"
- takeScreenshot: daan-learn-1
- tapOn:
    id: "daan-learn-next"
- waitForAnimationToEnd
- assertVisible:
    id: "daan-learn-read-2"
- takeScreenshot: daan-learn-2
- tapOn:
    id: "daan-learn-next"
- waitForAnimationToEnd
- assertVisible:
    id: "daan-learn-read-3"
- takeScreenshot: daan-learn-3
- tapOn:
    id: "daan-learn-next"
- waitForAnimationToEnd
# Every live cause is a painted seva tile; anna always has verified orgs. The
# painting itself is decorative (hidden from accessibility, so Maestro cannot
# see its id — Jest pins one icon per tile); the tile button is the target.
- scrollUntilVisible:
    element:
      id: "daan-seva-anna"
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: daan-home-seva
- tapOn:
    id: "daan-seva-anna"
- waitForAnimationToEnd
- assertVisible:
    id: "daan-cause-mahatva-anna"
- tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
- waitForAnimationToEnd

# ── 2. The educate home: shastra + kathas render; ledger door in the header ──
# By id: the verse label now carries its place ("What the shastra says · 1 of 5")
# and section labels render uppercase, so text matches would be brittle.
- extendedWaitUntil:
    visible:
      id: "daan-principle-carousel"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "daan-katha-shelf"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "daan-ledger-door"
    direction: DOWN
    timeout: 30000
# The register card closes the read and opens a new entry directly.
- scrollUntilVisible:
    element:
      id: "daan-register-record"
    direction: DOWN
    timeout: 30000
- takeScreenshot: daan-home-register
- tapOn:
    id: "daan-register-record"
- waitForAnimationToEnd
- assertVisible: "New daan"
- tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
- waitForAnimationToEnd

# ── 3. Ledger → new entry → save ──
- tapOn: { id: "daan-ledger-door" }
- waitForAnimationToEnd
- assertVisible: "Daan Punya register"
- tapOn: { id: "daan-ledger-add" }
- waitForAnimationToEnd
- assertVisible: "New daan"
- tapOn: { id: "daan-cat-anna" }
- scrollUntilVisible:
    element: { id: "daan-entry-amount" }
    direction: DOWN
- tapOn: { id: "daan-entry-amount" }
- inputText: "1,00"
# iOS's decimal pad has no return key; the amount field's Done bar (an
# InputAccessoryView) dismisses it and blurs the field, which runs the
# validation. hideKeyboard, taps and drags all failed to dismiss it natively.
- tapOn: { id: "daan-amount-done" }
- scrollUntilVisible:
    element: { id: "daan-entry-save" }
    direction: DOWN
- tapOn: { id: "daan-entry-save" }
- assertVisible: { id: "daan-amount-error" }
- assertVisible: { id: "daan-entry-screen" }
- tapOn: { id: "daan-entry-amount" }
- eraseText
- inputText: "1,000.50"
- tapOn: { id: "daan-amount-done" }
- scrollUntilVisible:
    element: { id: "daan-amount-preview" }
    direction: DOWN
- takeScreenshot: daan-amount-preview
- scrollUntilVisible:
    element: { id: "daan-entry-save" }
    direction: DOWN
- tapOn: { id: "daan-entry-save" }
- waitForAnimationToEnd
- assertVisible: "Daan Punya register"
- assertVisible: "Anna"

# ── Confirmation keeps the record until explicitly removed ──
- tapOn: { id: "daan-entry-remove-.*", index: 0 }
- assertVisible: { id: "daan-remove-dialog" }
- takeScreenshot: daan-remove-confirmation
- tapOn: { id: "daan-remove-cancel" }
- assertNotVisible: { id: "daan-remove-dialog" }
- assertVisible: "Anna"
- tapOn: { id: "daan-entry-remove-.*", index: 0 }
- tapOn: { id: "daan-remove-confirm" }
- assertNotVisible: { id: "daan-remove-dialog" }

# ── Back out cleanly ──
- tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
- waitForAnimationToEnd
- assertVisible: "Daan Punya"
