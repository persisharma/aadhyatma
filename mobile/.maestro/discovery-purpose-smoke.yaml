# Intent Discovery Smoke Test
#
# PRD-B path: Home → पाठ → Protection → Rama Raksha Stotra → reader.
# Verifies the उद्देश्य chips, cross-deity purpose list, route dispatch, and the
# first-page-only "When to Recite" panel.
#
# The Home "By Purpose" tile retired with the 16-tile grid (TRD-42 §5.3). Its
# destination was an index of these same chips, so the chips on the Library
# ARE that index and open the purpose list directly — one screen fewer, not a
# lost one.

appId: com.prashantsharma.vedansh
---
# Native build: launch via the shared _launch subflow (clearState, first-launch
# tour / What's New / notification dismiss, lands on Home). Category and tile
# a11y labels are English by contract regardless of display language.
- runFlow: _launch.yaml

# Flip the reading language to English so the reader's WhenToRecitePanel renders
# "When to Recite" / "Best Days" (Latin) rather than the default Devanagari,
# which Maestro can't reliably read. Category/purpose tile a11y labels are
# English by contract, so only the reader body needs this.
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd

- extendedWaitUntil:
    # Canary: the above-the-fold Panchang card. The पाठ door sits well below the
    # first viewport, so _open-library.yaml scrolls to it.
    visible: ".*Today.s Panchang.*|.*आज का पंचांग.*"
    timeout: 60000

# ── Home → पाठ library ──
- runFlow: _open-library.yaml

# ── The उद्देश्य row renders every intent chip ──
- extendedWaitUntil:
    visible: "Protection. Tap to open."
    timeout: 15000
- assertVisible: "Wealth. Tap to open."
- assertVisible: "Knowledge. Tap to open."

# ── Protection list shows tagged texts across deities ──
- tapOn: "Protection. Tap to open."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Rama Raksha Stotra.*Tap to open\\."
    timeout: 15000
- assertVisible: "Durga Kavach.*Tap to open\\."

# ── Open a tagged text and verify the first-page metadata panel ──
- tapOn: "Rama Raksha Stotra.*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd
# The WhenToRecitePanel sits below the verse in the reader's ScrollView — scroll
# it into view (below the fold on Android's shorter viewport). The panel is
# expanded by default, so "Best Days" is present once the header is on-screen.
- scrollUntilVisible:
    element:
      text: ".*When to Recite.*"
    direction: DOWN
    timeout: 15000
- assertVisible: ".*Best Days.*"
