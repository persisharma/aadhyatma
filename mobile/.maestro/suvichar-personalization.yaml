appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- tapOn: { id: "tab-bhakti" }
- tapOn:
    id: "open-suvichar"
- scrollUntilVisible:
    element:
      id: "suvichar-name"
- tapOn:
    id: "suvichar-name"
- inputText: "Sharma family"
- hideKeyboard
- tapOn:
    id: "suvichar-message"
- inputText: "May your home be filled with love and peace."
- hideKeyboard
- scrollUntilVisible:
    element: { id: "suvichar-frame-pushp-aangan" }
    direction: UP
- tapOn:
    id: "suvichar-frame-pushp-aangan"
- scrollUntilVisible:
    element: { id: "suvichar-card-sender" }
- assertVisible: "सप्रेम — Sharma family"
- scrollUntilVisible:
    element:
      id: "suvichar-favorite"
- tapOn:
    id: "suvichar-favorite"
- stopApp
- launchApp
- tapOn: { id: "tab-bhakti" }
- tapOn:
    id: "open-suvichar"
- scrollUntilVisible:
    element: { id: "suvichar-name" }
- assertVisible: "Sharma family"
# With published artwork: share, select WhatsApp and inspect the complete exported
# PNG including name, all message lines and footer. Do not actually send a message.
