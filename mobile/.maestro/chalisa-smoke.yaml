# Chalisa Category Smoke Test
#
# Verifies the Chalisa category and its 9 active sections render correctly.
# Sections: Hanuman Chalisa, Shiv Chalisa, Durga Chalisa, Ganesh Chalisa, Lakshmi Chalisa,
#           Saraswati Chalisa, Vishnu Chalisa, Krishna Chalisa, Ram Chalisa.
#
# Chalisas share ChalisaReaderScreen (multi-instance pattern, dispatched by
# route.params.chalisaId). Opening Hanuman Chalisa verifies the dispatch
# resolves correctly — origin of the PR #31 regression that RULEBOOK §3
# explicitly guards against.

appId: host.exp.Exponent
---
- runFlow: _launch.yaml

# Open Chalisa category
- assertVisible: "Chalisa. Tap to open."
- tapOn: "Chalisa. Tap to open."
- waitForAnimationToEnd

# Verify all 4 sections appear in CategoryList
- extendedWaitUntil:
    visible: "Hanuman Chalisa\\..*Tap to open\\."
    timeout: 15000
- assertVisible: "Shiv Chalisa\\..*Tap to open\\."
- assertVisible: "Durga Chalisa\\..*Tap to open\\."
- assertVisible: "Ganesh Chalisa\\..*Tap to open\\."
# Lakshmi + Saraswati Chalisa are the newest cards (added 1.4.0)
- scrollUntilVisible:
    element:
      text: "Lakshmi Chalisa\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Saraswati Chalisa\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Vishnu Chalisa\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Krishna Chalisa\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Ram Chalisa\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000

# Scroll back up and open Hanuman Chalisa reader
- scrollUntilVisible:
    element:
      text: "Hanuman Chalisa\\..*Tap to open\\."
    direction: UP
    visibilityPercentage: 60
    timeout: 10000
- tapOn: "Hanuman Chalisa\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss Resume sheet if a prior session left reading progress
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd

# Language toggle test
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: "Hindi"
- waitForAnimationToEnd

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: host.exp.Exponent
