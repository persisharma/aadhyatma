# Run against this branch's installed native app/Metro. Does not prove visual QA by parsing.
appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml
- runFlow: _sanatan-home-entry.yaml
- tapOn: { id: home-sanatan-card }
- tapOn: { id: lang-toggle-en }
- tapOn: { id: sanatan-search }
- inputText: "how to draw swastika"
- pressKey: Enter
- scrollUntilVisible:
    element: { text: "Sacred symbols" }
    direction: DOWN
    timeout: 60000
    # Centre it: a row found at the bottom edge sits under the tab bar,
    # and the tap then lands on a tab instead (seen in CI on iOS).
    centerElement: true
- tapOn: "Sacred symbols"
- scrollUntilVisible:
    element: { text: "Four arms, four aims of life" }
    direction: DOWN
    timeout: 60000
    # Centre it: a row found at the bottom edge sits under the tab bar,
    # and the tap then lands on a tab instead (seen in CI on iOS).
    centerElement: true
- tapOn: "Four arms, four aims of life"
- assertVisible: "2\\s*/\\s*3"
- scrollUntilVisible:
    element: { text: "Moksha · Spiritual liberation" }
    direction: DOWN
    timeout: 60000
- takeScreenshot: e2e-shots/sanatan-swastika-four-aims
- scrollUntilVisible:
    element: { id: sanatan-next }
    direction: DOWN
    timeout: 60000
- tapOn: { id: sanatan-next }
- assertVisible: "3\\s*/\\s*3"
- scrollUntilVisible:
    element: { id: swastika-stage-0 }
    direction: DOWN
    timeout: 60000
- takeScreenshot: e2e-shots/sanatan-swastika-cross
- scrollUntilVisible:
    element: { id: swastika-stage-1 }
    direction: DOWN
    timeout: 60000
- takeScreenshot: e2e-shots/sanatan-swastika-four-bends
- scrollUntilVisible:
    element: { id: swastika-stage-2 }
    direction: DOWN
    timeout: 60000
- takeScreenshot: e2e-shots/sanatan-swastika-optional-dots
- scrollUntilVisible:
    element: { text: "This guide does not prescribe.*" }
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: { text: "Share" }
    direction: DOWN
    timeout: 60000
- assertVisible: "Share"
- tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
# The lesson list keeps its scroll position, so the title can be above view.
- scrollUntilVisible:
    element: { text: "Sacred symbols" }
    direction: UP
    timeout: 30000
- assertVisible: "Sacred symbols"
- tapOn: "Back|वापस|પાછા|ಹಿಂದೆ"
# The hub keeps its query and its scroll position; the search field sits above
# the results that were scrolled to, so bring it back (CI, Android: the hub
# showed the filtered results with the field out of view).
- scrollUntilVisible:
    element: { text: "how to draw swastika" }
    direction: UP
    timeout: 30000
- assertVisible: "how to draw swastika"
