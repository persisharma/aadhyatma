# Daily Bhakti Tab Smoke Test
#
# Daily Bhakti is a BOTTOM-TAB screen (TabNavigator.tsx, tabBarLabel "Bhakti"),
# like Panchang — so this flow taps the tab bar, not a Home category card.
#
# This is the screen a daily-reminder notification lands on. Maestro cannot
# deterministically schedule a local notification for a future instant,
# background the app, and tap the OS notification — so the notification-TAP +
# deep-link path is NOT covered here. That logic is unit-tested instead:
#   - src/notifications/__tests__/reminderVerseLookup.test.ts
#       (verse-identity round-trip via findVerse; per-slot distinctness)
#   - src/notifications/__tests__/scheduler.test.ts (fire-date helpers)
# This flow covers the LANDING SCREEN itself: that it renders a verse and the
# "next" control swaps to another verse without breaking.
#
# Verifies:
#   1. The Bhakti tab is reachable from the bottom tab bar.
#   2. The verse card renders (the "Daily Verse" subtitle + "Meaning" section).
#   3. The "↻ next" control fetches another verse and the screen stays intact.
#   4. Global reading-language switching reflects on the screen.
#   5. A pinned Gita verse exposes its meaning immediately at Standard size,
#      without spending the viewport on an illustration; Large remains scrollable.
#   6. The in-screen reading-language toggle (design.md §16/§23) re-languages
#      the card: Hindi hides the English meaning, English brings it back.
#   7. The setup strip (design.md §23), when up, rests on "Not now". It is
#      state-dependent: _launch.yaml grants notifications (no reminder ask) and
#      Expo Go has no widget extension (no widget ask), so it is usually absent;
#      a dev build shows the widget ask. Both branches are conditional so either
#      runtime passes; the gate itself is unit-tested in
#      src/components/__tests__/dailyBhaktiNudgeView.test.ts.
#
# Why we switch to English first:
#   The screen reads the GLOBAL reading language (useGitaLanguage); the default
#   is Hindi, so most on-screen text is Devanagari, which Maestro's iOS
#   accessibility tree can't reliably read (see README "Element selection
#   rules"). We flip the default to English on the More tab, then assert real
#   content in English. We restore Hindi at the end (best-effort).
#
# Selector notes (mirroring panchang-smoke.yaml, verified conventions):
#   - Bottom tabs expose accessibilityText "<Label>, tab, N of 4", so we match
#     "Bhakti, tab.*". Bare "Bhakti" is avoided to stay anchored to the tab.
#   - "Daily Verse" is a constant Latin subtitle rendered in both languages →
#     reliable anchor regardless of reading language.
#   - "Meaning" is the section label in English mode (isHindi ? 'अर्थ' : 'Meaning').
#   - The next control exposes accessibilityLabel "Next verse" in English mode
#     (isHindi ? 'अगला श्लोक' : 'Next verse') — reliable, unlike the "↻ next" glyph.

appId: com.prashantsharma.vedansh
---
# ── Step 1: Boot Vedansh in Expo Go (exits on Home) ──
- runFlow: _launch.yaml

# ── Step 2: Set global reading language to English (More tab) ──
- runFlow: _open-settings.yaml
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"   # More now opens a Language picker sheet, not inline pills
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "English"
    timeout: 15000
- tapOn: "English"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Reading size,.*" }
    centerElement: true
- tapOn: "Reading size,.*"
- tapOn: "Standard"
- tapOn: "हो गया|Done|થઈ ગયું|ಮುಗಿಯಿತು"

# ── Step 3: Open the Bhakti tab ──
- tapOn: { id: "tab-bhakti" }
- openLink: "vedansh://widget/verse?sourceId=bhagavad-gita&chapter=2&verseIndex=46"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd

# ── Step 3b: Rest the setup strip if one is up, before the layout asserts ──
- runFlow:
    when:
      visible:
        id: "daily-bhakti-nudge-reminder"
    commands:
      - tapOn: { id: "daily-bhakti-nudge-reminder-dismiss" }
      - assertNotVisible: { id: "daily-bhakti-nudge-reminder" }
- runFlow:
    when:
      visible:
        id: "daily-bhakti-nudge-widget"
    commands:
      - tapOn: { id: "daily-bhakti-nudge-widget-dismiss" }
      - assertNotVisible: { id: "daily-bhakti-nudge-widget" }

# ── Step 4: Assert the verse card rendered ──
- extendedWaitUntil:
    visible: "Daily Verse"
    timeout: 15000
- assertVisible: "Meaning.*"
# Pin layout verification to a known complete verse rather than assuming a
# random long verse/meaning must fit. This exercises the widget landing route,
# not an OS notification tap.
- assertVisible: "Your right is only to work.*"
- takeScreenshot: e2e-shots/daily-reading-standard
- tapOn: "Share verse"
- assertVisible: "Share to other apps"
- assertNotVisible: "Share all pages"
- tapOn: "Cancel"

# ── Step 4b: The card's own language toggle flips the reading in place ──
- tapOn: { id: "lang-toggle-hi" }
- waitForAnimationToEnd
- assertNotVisible: "Your right is only to work.*"
- tapOn: { id: "lang-toggle-en" }
- waitForAnimationToEnd
- assertVisible: "Your right is only to work.*"

# ── Step 5: Large keeps the whole reading reachable at the same type scale ──
- runFlow: _open-settings.yaml
- scrollUntilVisible:
    element: { text: "Reading size,.*" }
    centerElement: true
- tapOn: "Reading size,.*"
- tapOn: "Large"
- tapOn: "हो गया|Done|થઈ ગયું|ಮುಗಿಯಿತು"
- openLink: "vedansh://widget/verse?sourceId=bhagavad-gita&chapter=2&verseIndex=46"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: e2e-shots/daily-reading-large
- scrollUntilVisible:
    element: { text: "Next verse" }
    direction: DOWN
    centerElement: true
    timeout: 10000
- assertVisible: "Your right is only to work.*"

# ── Step 6: "next" swaps to another verse; the screen stays intact ──
- tapOn: "Next verse"
- waitForAnimationToEnd
- assertVisible: "Daily Verse"

# ── Step 7: Restore Hindi / Standard (best-effort language restore) ──
- runFlow: _open-settings.yaml
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Reading size,.*" }
    centerElement: true
- tapOn: "Reading size,.*"
- tapOn: "Standard"
- tapOn: "हो गया|Done|થઈ ગયું|ಮುಗಿಯಿತು"
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
    optional: true
- tapOn:
    text: "Language,.*"   # open the Language picker sheet (best-effort restore)
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Hindi"
    optional: true
- waitForAnimationToEnd

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: com.prashantsharma.vedansh
