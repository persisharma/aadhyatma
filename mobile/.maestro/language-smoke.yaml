# Language Smoke Test — Gujarati & Kannada reading languages (PR: gu/kn support)
#
# Vedansh's reading language was Hindi/English only. This flow proves the two
# new languages work end to end: selected on the More "Language" card, persisted
# across navigation, and actually rendering devotional content in the regional
# SCRIPT — which is derived at runtime by transliterating the bundled Devanagari
# (utils/transliterate.ts), not from any new content data.
#
# What it asserts:
#   • The Language card exposes Gujarati + Kannada radios (a11y labels
#     "Gujarati" / "Kannada" from LANGUAGES metadata).
#   • Selecting Gujarati re-scripts the More screen chrome — the Panchang card
#     title renders "પંચાંગ" (toGujarati('पंचांग')).
#   • Opening Hanuman Chalisa shows its title in Gujarati script
#     "હનુમાન ચાલીસા" (toGujarati('हनुमान चालीसा')) — proving the reader title +
#     the bundled Noto Serif Gujarati font render.
#   • The in-reader 4-way LanguageToggle switches to Kannada and the same title
#     re-renders as "ಹನುಮಾನ ಚಾಲೀಸಾ" (toKannada(...)).
#   • Hindi is restored so back-to-back suite runs start from the baseline.
#
# Selector notes:
#   • LibraryCard / CategoryCard a11y labels are always English ("${nameEn}.
#     … Tap to open.") regardless of reading language, so the tile taps are
#     language-independent — only the asserted SCRIPT strings change.
#   • The LanguageToggle segments and the More radios share a11y labels
#     ("Gujarati" / "Kannada" / "Hindi"), so the same tapOn text works on both.
#   • The transliterated strings are deterministic and pinned by
#     src/utils/__tests__/transliterate.test.ts.

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# ── Open More → Language picker sheet, select Gujarati ──
# Language selection moved from inline radios into LanguagePickerSheet; open it
# via the "Language, <current>" row first (same pattern as home-today).
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Gujarati"
    timeout: 15000
- tapOn: "Gujarati"
- waitForAnimationToEnd
# The More-screen chrome re-scripts to Gujarati — the Language row label itself
# renders "ભાષા" (pick(gu) of 'Language'), proving the reading-language switch
# re-scripted the UI. (The old "પંચાંગ" assertion pointed at a Panchang card that
# the More screen doesn't contain.) Reader-title assertions below further prove
# the bundled Gujarati font renders verse text.
- assertVisible: "Language, Gujarati"

# ── Open a reader to confirm verse-script rendering ──
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Chalisa\\..*Tap to open\\."
    timeout: 15000
- tapOn: "Chalisa\\..*Tap to open\\."
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Hanuman Chalisa\\..*Tap to open\\."
    timeout: 15000
- tapOn: "Hanuman Chalisa\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss the Resume sheet if a prior session left progress.
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd
# Reader title in Gujarati script. (Meaning/commentary also render in-script — proven
# deterministically by the unit tests src/utils/__tests__/localize.test.ts; the in-reader
# meaning body sits below the fold so it's not asserted from this flow.)
- assertVisible: "હનુમાન ચાલીસા"

# ── Switch to Kannada, then Hindi, via the More Language picker ──
# The in-reader LanguageToggle is a 2-segment [regional, English] pill (it only
# exposes the language chosen in More + English), so kn/hi are selected from the
# More picker rather than an in-reader lang-toggle-kn/hi chip that doesn't exist.
# The Language row keeps a stable English a11y label ("Language, <lang>") and the
# radios use Latin labels, so the same selectors work in any display script.
# Switching tabs preserves the Home stack, so returning to Home lands back on the
# open Hanuman Chalisa reader, now re-rendered in the newly chosen script.
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kannada"
    timeout: 15000
- tapOn: "Kannada"
- waitForAnimationToEnd
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd
- assertVisible: "ಹನುಮಾನ ಚಾಲೀಸಾ"

# ── Restore Hindi so the next flow starts from the suite baseline ──
- tapOn: { id: "tab-more" }
- waitForAnimationToEnd
# The ऐप section (Language/Reading size) sits below the fold on standard-height
# iPhones since the More hub grew (Janma Tithi / Kul Parampara / Vastu Disha rows) —
# tapping the off-screen row's estimated center hits the tab bar instead. Scroll first.
- scrollUntilVisible:
    element:
      text: "Language,.*"
    centerElement: true
- tapOn: "Language,.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Hindi"
    timeout: 15000
- tapOn: "Hindi"
- waitForAnimationToEnd
- tapOn: { id: "tab-home" }
- waitForAnimationToEnd
- assertVisible: "हनुमान चालीसा"

- stopApp:
    appId: com.prashantsharma.vedansh
