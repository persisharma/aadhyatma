# Aarti Category Smoke Test
#
# Verifies the Aarti category and its 7 active sections render correctly.
# Sections: Om Jai Jagdish Hare, Hanuman Ji Ki Aarti, Sankat Mochan
#           Hanumanashtak, Jai Ganesh Deva, Om Jai Shiv Omkara, Jai Ambe
#           Gauri, Aarti Kunj Bihari Ki.
#
# Aartis share AartiReaderScreen (multi-instance, dispatched by route param).
# Opens Om Jai Jagdish to verify the dispatch resolves correctly.

appId: host.exp.Exponent
---
- runFlow: _launch.yaml

# Open Aarti category
- assertVisible: "Aarti\\..*Tap to open\\."
- tapOn: "Aarti\\..*Tap to open\\."
- waitForAnimationToEnd

# Verify all 7 sections appear in CategoryList
# (Sankat Mochan Hanumanashtak was migrated to stotram category post-merge with main.)
- extendedWaitUntil:
    visible: "Om Jai Jagdish Hare\\..*Tap to open\\."
    timeout: 15000
- assertVisible: "Hanuman Ji Ki Aarti\\..*Tap to open\\."
- assertVisible: "Jai Ganesh Deva\\..*Tap to open\\."
- assertVisible: "Om Jai Shiv Omkara\\..*Tap to open\\."
- assertVisible: "Jai Ambe Gauri\\..*Tap to open\\."
- assertVisible: "Aarti Kunj Bihari Ki\\..*Tap to open\\."
# Saraswati Mata Ki Aarti is the last card — scroll to it (list now exceeds one screen)
- scrollUntilVisible:
    element:
      text: "Saraswati Mata Ki Aarti\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000

# Open Om Jai Jagdish Hare reader
- tapOn: "Om Jai Jagdish Hare\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss Resume sheet if a prior session left reading progress
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd

# Language toggle test
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: "Hindi"
- waitForAnimationToEnd

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: host.exp.Exponent
