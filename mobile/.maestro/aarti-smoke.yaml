# Aarti Category Smoke Test
#
# Verifies the 12 pre-existing Aarti category entries. The ten new entries
# are traversed by aarti-expansion-smoke.yaml at Standard and Large sizes.
# Sections: Om Jai Jagdish Hare, Hanuman Ji Ki Aarti, Jai Ganesh Deva,
#           Om Jai Shiv Omkara, Jai Ambe Gauri, Aarti Kunj Bihari Ki,
#           Saraswati Mata Ki Aarti, Gayatri Mata Ki Aarti, Om Jai Lakshmi Mata,
#           Shri Ram Chandra Ji Ki Aarti (reuses the Ram Stuti content),
#           Shri Khatu Shyam Ji Ki Aarti, Jay Adhya Shakti.
#
# Aartis share AartiReaderScreen (multi-instance, dispatched by route param).
# Opens Om Jai Jagdish to verify the dispatch resolves correctly.

appId: com.prashantsharma.vedansh
---
- runFlow: _launch.yaml

# Open Aarti category
- assertVisible: "Aarti\\..*Tap to open\\."
- tapOn: "Aarti\\..*Tap to open\\."
- waitForAnimationToEnd

# Verify all 12 sections appear in CategoryList
# (Sankat Mochan Hanumanashtak now lives in the Ashtakam category.)
- extendedWaitUntil:
    visible: "Om Jai Jagdish Hare\\..*Tap to open\\."
    timeout: 15000
- assertVisible: "Hanuman Ji Ki Aarti\\..*Tap to open\\."
- assertVisible: "Jai Ganesh Deva\\..*Tap to open\\."
- assertVisible: "Om Jai Shiv Omkara\\..*Tap to open\\."
- assertVisible: "Jai Ambe Gauri\\..*Tap to open\\."
- assertVisible: "Aarti Kunj Bihari Ki\\..*Tap to open\\."
# Saraswati & Gayatri Mata Ki Aarti are the last two cards — scroll to reach them
# (list now exceeds one screen). Gayatri (addedInVersion 1.4.4) shows a NEW badge,
# absorbed by the `.*` in the selector.
- scrollUntilVisible:
    element:
      text: "Saraswati Mata Ki Aarti\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Gayatri Mata Ki Aarti\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
# Om Jai Lakshmi Mata (addedInVersion 1.5.0) sits between Gayatri and Ram's
# aarti. Open it to prove the appended index 9 dispatches its own payload.
- scrollUntilVisible:
    element:
      text: "Om Jai Lakshmi Mata\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- tapOn: "Om Jai Lakshmi Mata\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Start over from the beginning"
    optional: true
- assertVisible: "ॐ जय लक्ष्मी माता.*"
- tapOn: "Back"
- waitForAnimationToEnd
# Ram's aarti reuses the Ram Stuti content (opens the RamStuti reader), listed
# here under the Aarti category. NEW badge absorbed by `.*`.
- scrollUntilVisible:
    element:
      text: "Shri Ram Chandra Ji Ki Aarti\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
# Khatu Shyam's aarti (addedInVersion 1.5.0, NEW badge absorbed by `.*`). Open
# it to prove the 9th aartiCollection index dispatches correctly.
- scrollUntilVisible:
    element:
      text: "Shri Khatu Shyam Ji Ki Aarti\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- tapOn: "Shri Khatu Shyam Ji Ki Aarti\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Start over from the beginning"
    optional: true
- assertVisible: "ॐ जय श्री श्याम हरे.*"
- tapOn: "Back"
- waitForAnimationToEnd
# Jay Adhya Shakti is the last card (addedInVersion 1.5.2, NEW badge absorbed by
# `.*`). Open it to prove the appended index 10 dispatches its own payload.
- scrollUntilVisible:
    element:
      text: "Jay Adhya Shakti\\..*Tap to open\\."
    direction: DOWN
    visibilityPercentage: 60
    timeout: 10000
- tapOn: "Jay Adhya Shakti\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: "Start over from the beginning"
    optional: true
- assertVisible: "जय आद्या शक्ति, मा जय आद्या शक्ति.*"
- tapOn: "Back"
- waitForAnimationToEnd

# Open Om Jai Jagdish Hare reader
- scrollUntilVisible:
    element:
      text: "Om Jai Jagdish Hare\\..*Tap to open\\."
    direction: UP
    visibilityPercentage: 60
    timeout: 10000
- tapOn: "Om Jai Jagdish Hare\\..*Tap to open\\."
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss Resume sheet if a prior session left reading progress
- tapOn:
    text: "Start over from the beginning"
    optional: true
- waitForAnimationToEnd

# Language toggle test
- tapOn: "English"
- waitForAnimationToEnd
- tapOn: "Hindi"
- waitForAnimationToEnd

# Clean up — Expo Go termination resets navigation stack for the next flow.
- stopApp:
    appId: com.prashantsharma.vedansh
