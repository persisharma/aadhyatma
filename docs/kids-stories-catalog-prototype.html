      kn:{title:'ಮಕ್ಕಳ ಚಿತ್ರಕಥೆಗಳು',pick:'ಯಾರ ಕಥೆಗಳನ್ನು ಓದುತ್ತೀರಿ?',stories:'ಕಥೆಗಳು',readings:'ಚಿತ್ರವಾಚನಗಳು',forms:'ನವರಾತ್ರಿಯ ಒಂಬತ್ತು ರೂಪಗಳು',more:'ದುರ್ಗಾ ಮಾತೆಯ ಇನ್ನಷ್ಟು ಕಥೆಗಳು',day:'ದಿನ',pages:'ಪುಟಗಳು',story:'ಕಥೆ',intro:'ಪರಿಚಯ'}
    };
    const params=new URLSearchParams(location.search);
    let lang=copy[params.get('lang')]?params.get('lang'):'en',deity=params.get('deity');
    const back=document.getElementById('back'),title=document.getElementById('title'),content=document.getElementById('content');
    const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    function card(s,form){
      const t=copy[lang],label=form?`${t.day} ${form.day} · ${form.name[lang]}`:'';
      return `<a class="story-card" data-story="${s.id}" href="${s.href}?lang=${lang}"><span class="cover-art" style="aspect-ratio:4 / ${5*s.frame}"><img src="${s.cover}" alt=""></span><span class="copy">${label?`<small>${esc(label)}</small>`:''}<strong>${esc(s.title[lang])}</strong><em>${esc(lang==='en'?s.title.hi:s.title.en)}</em><p>${esc(s.description[lang])}</p><small>${s.pages} ${t.pages} · ${s.ageMin}+${s.deityId==='durga'?` · ${s.kind==='introduction'?t.intro:t.story}`:''}</small></span><span class="chev" aria-hidden="true">›</span></a>`;
    }
    function render(){
      const t=copy[lang],selected=deities.find(d=>d.id===deity);document.documentElement.lang=lang;
      title.textContent=selected?selected.name[lang]:t.title;back.href=selected?'#':'kids-stories-home-prototype.html';
      if(!selected){
        content.innerHTML=`<p class="intro">${esc(t.pick)}</p>`+deities.map(d=>`<button class="deity-card" type="button" data-deity="${d.id}"><span class="bar" aria-hidden="true">${d.id==='durga'?'✿':esc(d.name.hi.slice(0,1))}</span><span class="copy"><strong>${esc(d.name[lang])}</strong><em>${esc(lang==='en'?d.name.hi:d.name.en)}</em><small>${catalog.filter(s=>s.deityId===d.id).length} ${d.id==='durga'?t.readings:t.stories}</small></span><span class="chev" aria-hidden="true">›</span></button>`).join('');
        content.querySelectorAll('[data-deity]').forEach(b=>b.addEventListener('click',()=>{deity=b.dataset.deity;render()}));
      }else{
        const stories=catalog.filter(s=>s.deityId===deity);
        if(deity==='durga'){
          const used=new Set(forms.map(f=>f.storyId)),nav=stories.find(s=>s.id==='durga-navaratri');
          content.innerHTML=card(nav)+`<h2 class="intro">${esc(t.forms)}</h2>`+forms.map(f=>card(stories.find(s=>s.id===f.storyId),f)).join('')+`<h2 class="intro">${esc(t.more)}</h2>`+stories.filter(s=>s.id!==nav.id&&!used.has(s.id)).map(s=>card(s)).join('');
        }else content.innerHTML=stories.map(s=>card(s)).join('');
      }
    }
    back.addEventListener('click',e=>{if(deity){e.preventDefault();deity=null;render()}});
    document.getElementById('language').value=lang;
    document.getElementById('language').addEventListener('change',e=>{lang=e.target.value;render()});render();
  </script>
</body>
</html>
