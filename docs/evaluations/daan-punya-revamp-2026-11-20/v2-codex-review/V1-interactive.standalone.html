<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daan-Punya guide · V1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100vh;background:#17120c;display:flex;justify-content:center;align-items:center;padding:20px;color:#1A0E03}.phone{width:390px;height:1500px;max-width:100%;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#F6ECD0 0%,#F1E3BF 100%);box-shadow:0 24px 80px rgba(0,0,0,.5)}.phone main{flex:1;min-height:0;overflow:auto}.phone .app-frame{width:390px;height:1500px;box-sizing:border-box;display:flex;flex-direction:column;background:linear-gradient(180deg,#F6ECD0 0%,#F1E3BF 100%);color:#1A0E03;font-family:'Noto Serif Devanagari',serif}.standalone-stage{width:100%;height:100%;display:flex;justify-content:center;align-items:center}button{font-family:inherit}a{color:#8A3E0B}a:hover{color:#5A3A1E}.icon-disc{flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF5E0 0%,#F8D291 100%);border:1.5px solid #A67C34;box-shadow:0 2px 6px rgba(90,58,30,.18);display:flex;align-items:center;justify-content:center}.cause-page{width:390px;height:1500px;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;padding:16px 16px 28px;background:linear-gradient(180deg,#F6ECD0 0%,#F1E3BF 100%);color:#1A0E03;font-family:'Noto Serif Devanagari',serif}.cause-page .back{width:44px;height:44px;box-sizing:border-box;flex-shrink:0;border-radius:22px;border:1px solid rgba(166,124,52,.3);background:#FFF9EE;display:flex;align-items:center;justify-content:center;text-decoration:none}.cause-page h1{font-size:21px;line-height:30px;margin:0;font-weight:700}.cause-page .cause-hero{position:relative;height:230px;border-radius:24px;overflow:hidden;box-shadow:0 8px 22px rgba(40,24,10,.2)}.cause-page .cause-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cause-page .cause-content{position:absolute;left:0;right:0;bottom:0;padding:50px 18px 16px;background:linear-gradient(180deg,rgba(22,10,3,0) 0%,rgba(22,10,3,.88) 45%,rgba(22,10,3,.95) 100%);color:#FFF4DC}.cause-page .cause-content .eyebrow{font:700 11px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#F2C46B}.cause-page .cause-content .title{font-weight:700;font-size:26px;line-height:36px}.cause-page .cause-content .lede{font-weight:500;font-size:13.5px;line-height:21px;color:#E9D8B6}.cause-page .white-card{border:1px solid rgba(166,124,52,.35);border-radius:20px;background:#FFF9EE;padding:16px 18px}.cause-page .eyebrow{font:700 11px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8A3E0B}.cause-page .body-copy{margin-top:8px;font-size:14.5px;line-height:25px}.cause-page .citation{margin-top:10px;font:600 12px Inter,sans-serif;color:#6E5230}.cause-page .triples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.cause-page .triple{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid rgba(166,124,52,.3);border-radius:16px;background:#FFF9EE;text-align:center;font-size:12.5px;line-height:18px}.cause-page .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.cause-page .day{min-height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:600 12px Inter,sans-serif}.cause-page .org{padding:12px 14px;border:1px solid rgba(166,124,52,.3);border-radius:18px;background:#FFF9EE;margin-top:10px}.cause-page .muted{font-size:12.5px;line-height:19px;color:#6E5230;text-align:center}.cause-page .record{min-height:50px;border:1.5px solid #B8621B;border-radius:999px;background:transparent;color:#8A3E0B;font:600 15px Inter,sans-serif}.cause-page .chips{display:flex;gap:8px;overflow:auto;margin:0 -16px;padding:0 16px 4px}.cause-page .chip{min-height:44px;flex-shrink:0;border-radius:999px;padding:4px 14px 4px 4px;display:flex;align-items:center;gap:6px;border:1px solid rgba(166,124,52,.3);background:#FFF9EE;color:#5A3A1E;font:600 13px Inter,sans-serif}
@media(max-height:1540px){body{align-items:flex-start}.phone{height:94vh;min-height:600px;margin:3vh 0}.phone .app-frame{height:100%}.cause-page{height:100%}}
@media(max-width:430px){body{padding:0}.phone{width:100vw;height:100dvh;max-height:none;margin:0}.phone .app-frame,.cause-page{width:100vw}}
</style>
</head>
<body>
<div class="phone" id="phone"><div class="standalone-stage" id="stage"></div></div>
<template id="main-template"><div style="width: 390px; height: {{frameH}}px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(180deg, #F6ECD0 0%, #F1E3BF 100%); color: #1A0E03; font-family: 'Noto Serif Devanagari', serif">

<div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 0">
<sc-if value="{{isIndex}}" hint-placeholder-val="{{true}}">
<button type="button" aria-label="{{c.backHome}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(166,124,52,0.30); background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); box-shadow: 0 2px 8px rgba(90, 58, 30, 0.14); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A3E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
</sc-if>
<sc-if value="{{isStep}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="{{c.backIndex}}" onClick="{{goIndex}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(166,124,52,0.30); background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); box-shadow: 0 2px 8px rgba(90, 58, 30, 0.14); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A3E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
</sc-if>
<div style="flex: 1; min-width: 0; font-family: {{titleFont}}; font-weight: 700; font-size: {{h1Size}}; line-height: 32px">{{c.title}}</div>
<sc-if value="{{isStep}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{goIndex}}" style="min-height: 44px; padding: 0 14px; border: 1px solid rgba(166,124,52,0.30); border-radius: 999px; background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); color: #8A3E0B; font-family: {{labelFont}}; font-weight: 600; font-size: 12.5px; cursor: pointer">{{c.index}}</button>
</sc-if>
<sc-if value="{{isIndex}}" hint-placeholder-val="{{true}}">
<button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid rgba(166,124,52,0.30); border-radius: 999px; background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); color: #8A3E0B; font-family: {{labelFont}}; font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A3E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6M9 13h6M9 17h3"></path></svg>
{{c.register}}
</button>
</sc-if>
</div>

<sc-if value="{{isStep}}" hint-placeholder-val="{{false}}">
<div style="padding: 14px 16px 0">
<div aria-hidden="true" style="display: flex; gap: 4px">
<sc-for list="{{segments}}" as="segment" hint-placeholder-count="5">
<div style="flex: 1; height: 6px; border-radius: 999px; background: {{segment.bg}}"></div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 12px">
<div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 32px; background: radial-gradient(circle, rgba(242,196,107,0.45) 0%, rgba(242,196,107,0) 70%); display: flex; align-items: center; justify-content: center">
<img src="{{stepIcon}}" alt="" style="width: 56px; height: 56px; object-fit: contain">
</div>
<div style="flex: 1; min-width: 0">
<div style="font-family: {{labelFont}}; font-weight: 700; font-size: 11px; letter-spacing: {{track}}; text-transform: uppercase; color: #8A3E0B">{{stepCount}}</div>
<div style="font-family: {{titleFont}}; font-weight: 700; font-size: {{h1Size}}; line-height: 34px">{{stepTitle}}</div>
<div style="font-weight: 500; font-size: 13.5px; line-height: 21px; color: #6E5230">{{stepLede}}</div>
</div>
</div>
</div>
</sc-if>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 22px">

<sc-if value="{{isIndex}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 22px">

<div style="border: 1px solid rgba(166,124,52,0.30); border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); box-shadow: 0 8px 22px rgba(90, 58, 30, 0.18)">
<img src="/mobile/assets/garud-puran/daan.webp" alt="{{c.heroAlt}}" style="display: block; width: 100%; height: 186px; object-fit: cover">
<div style="padding: 16px 18px 18px">
<div style="font-family: {{labelFont}}; font-weight: 700; font-size: 11px; letter-spacing: {{track}}; text-transform: uppercase; color: #8A3E0B">{{c.heroEyebrow}}</div>
<div style="margin-top: 4px; font-family: {{titleFont}}; font-weight: 700; font-size: {{h2Size}}; line-height: 34px">{{c.heroTitle}}</div>
<div style="margin-top: 6px; font-weight: 500; font-size: 14px; line-height: 23px; color: #5A3A1E">{{c.heroLede}}</div>
</div>
<div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: linear-gradient(180deg, #160A03 0%, #2A1508 55%, #5C3214 100%); border-top: 1px solid #A67C34">
<span aria-hidden="true" style="position: absolute; left: 72px; top: 8px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; left: 190px; top: 12px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; left: 286px; top: 6px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: radial-gradient(circle, rgba(242,196,107,0.35) 0%, rgba(242,196,107,0) 70%); display: flex; align-items: center; justify-content: center">
<img src="/mobile/assets/icons/storybook/muhurat.png" alt="" style="width: 46px; height: 46px; object-fit: contain">
</div>
<div style="flex: 1; min-width: 0">
<div style="font-family: {{labelFont}}; font-weight: 700; font-size: 11px; letter-spacing: {{track}}; text-transform: uppercase; color: #F2C46B">{{c.todayEyebrow}}</div>
<div style="font-weight: 600; font-size: 15px; line-height: 24px; color: #FFF4DC">{{today.items}}</div>
</div>
<button type="button" onClick="{{goToday}}" aria-label="{{c.openToday}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid rgba(255,235,200,0.30); background: rgba(255,240,210,0.10); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2C46B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
</div>

<div>
<div style="font-family: {{titleFont}}; font-weight: 700; font-size: {{h3Size}}; line-height: 28px; margin-bottom: 10px">{{c.inGuide}}</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<button type="button" onClick="{{s.go}}" aria-label="{{s.aria}}" style="width: 100%; min-height: 84px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 10px; border: {{s.border}}; border-radius: 20px; background: {{s.bg}}; box-shadow: 0 4px 12px rgba(90, 58, 30, 0.12); text-align: left; cursor: pointer; font-family: inherit; color: inherit">
<div style="position: relative; width: 62px; height: 62px; flex-shrink: 0">
<img src="{{s.icon}}" alt="" style="width: 62px; height: 62px; object-fit: contain">
<div style="position: absolute; left: -4px; top: -4px; min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 6px; border-radius: 12px; background: {{s.badgeBg}}; color: {{s.badgeFg}}; border: 2px solid #FFF8EA; font-family: Inter, sans-serif; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center">{{s.badge}}</div>
</div>
<div style="flex: 1; min-width: 0">
<div style="font-family: {{titleFont}}; font-weight: 700; font-size: {{h3Size}}; line-height: 26px">{{s.title}}</div>
<div style="font-weight: 500; font-size: 13px; line-height: 20px; color: #6E5230">{{s.lede}}</div>
</div>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A3E0B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</sc-for>
</div>
</div>

<div>
<div style="font-family: {{titleFont}}; font-weight: 700; font-size: {{h3Size}}; line-height: 28px; margin-bottom: 10px">{{c.storiesLabel}}</div>
<div style="display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 8px">
<sc-for list="{{kathas}}" as="k" hint-placeholder-count="5">
<button type="button" style="width: 172px; flex-shrink: 0; box-sizing: border-box; border: 1px solid rgba(166,124,52,0.30); border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); padding: 0; text-align: left; cursor: pointer; font-family: inherit; color: inherit; box-shadow: 0 4px 12px rgba(90, 58, 30, 0.14)">
<div style="position: relative; height: 104px; background: linear-gradient(180deg, #160A03 0%, #2A1508 55%, #5C3214 100%); border-bottom: 1px solid #A67C34; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" style="position: absolute; left: 22px; top: 14px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; right: 30px; top: 24px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; left: 40px; bottom: 16px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<div style="width: 92px; height: 92px; border-radius: 46px; background: radial-gradient(circle, rgba(242,196,107,0.42) 0%, rgba(242,196,107,0) 68%); display: flex; align-items: center; justify-content: center">
<img src="{{k.icon}}" alt="" style="width: 68px; height: 68px; object-fit: contain">
</div>
<span style="position: absolute; right: 10px; top: 8px; font-family: Inter, sans-serif; font-weight: 600; font-size: 11px; color: #E9D8B6">{{k.num}}</span>
</div>
<div style="padding: 10px 12px 14px">
<div style="font-family: {{titleFont}}; font-weight: 700; font-size: {{h4Size}}; line-height: 24px">{{k.title}}</div>
<div style="margin-top: 2px; font-weight: 500; font-size: 12.5px; line-height: 19px; color: #6E5230">{{k.lesson}}</div>
</div>
</button>
</sc-for>
</div>
</div>

</div>
</sc-if>

<sc-if value="{{isS1}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="border-radius: 24px; overflow: hidden; border: 1px solid rgba(166,124,52,0.30); box-shadow: 0 8px 22px rgba(90, 58, 30, 0.18)">
<img src="/mobile/assets/explore/daan.jpg" alt="{{c.s1Alt}}" style="display: block; width: 100%; height: 184px; object-fit: cover">
</div>
<div style="border-radius: 22px; padding: 18px; background: linear-gradient(180deg, #FFF5E0 0%, #F5DEAC 100%); border: 1px solid rgba(184, 98, 27, 0.4); box-shadow: 0 4px 12px rgba(90, 58, 30, 0.12)">
<div style="font-family: {{labelFont}}; font-weight: 700; font-size: 11px; letter-spacing: {{track}}; text-transform: uppercase; color: #8A3E0B">{{c.oneLineLabel}}</div>
<div style="margin-top: 6px; font-family: {{titleFont}}; font-weight: 700; font-size: {{h2Size}}; line-height: 33px; color: #1A0E03">{{c.oneLine}}</div>
</div>
<div>
<div style="font-family: {{titleFont}}; font-weight: 700; font-size: {{h3Size}}; line-height: 28px; margin-bottom: 10px">{{c.youKnowLabel}}</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{examples}}" as="e" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid rgba(166,124,52,0.30); border-radius: 18px; background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); box-shadow: 0 3px 10px rgba(90, 58, 30, 0.10)">
<dc-import name="CauseIcon" cause="{{e.icon}}" size="54" hint-size="54px,54px"></dc-import>
<div style="flex: 1; min-width: 0">
<div style="font-weight: 700; font-size: 15.5px; line-height: 24px">{{e.title}}</div>
<div style="font-weight: 500; font-size: 13px; line-height: 20px; color: #6E5230">{{e.why}}</div>
</div>
</div>
</sc-for>
</div>
</div>
<div>
<div style="font-family: {{titleFont}}; font-weight: 700; font-size: {{h3Size}}; line-height: 28px; margin-bottom: 10px">{{c.notMoneyLabel}}</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{notMoney}}" as="m" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 12px; border: 1px solid rgba(166,124,52,0.30); border-radius: 18px; background: linear-gradient(180deg, #FFF8EA 0%, #F5E4BE 100%); text-align: center; box-shadow: 0 3px 10px rgba(90, 58, 30, 0.10)">
<dc-import name="CauseIcon" cause="{{m.icon}}" size="52" hint-size="52px,52px"></dc-import>
<div style="font-weight: 600; font-size: 13px; line-height: 19px">{{m.label}}</div>
</div>
</sc-for>
</div>
</div>
<div style="position: relative; border-radius: 22px; padding: 20px 18px; background: linear-gradient(180deg, #160A03 0%, #2A1508 55%, #5C3214 100%); border: 1px solid #A67C34; text-align: center">
<span aria-hidden="true" style="position: absolute; left: 24px; top: 18px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; right: 30px; top: 30px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; left: 52px; bottom: 40px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; right: 60px; bottom: 22px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<div style="font-family: {{labelFont}}; font-weight: 700; font-size: 11px; letter-spacing: {{track}}; text-transform: uppercase; color: #F2C46B">{{c.vedaLabel}}</div>
<div aria-hidden="true" style="margin: 12px auto 0; width: 120px; height: 1px; background: linear-gradient(90deg, rgba(166,124,52,0) 0%, #A67C34 50%, rgba(166,124,52,0) 100%)"></div>
<div style="margin-top: 12px; font-weight: 600; font-size: 18px; line-height: 33px; color: #F2C46B; white-space: pre-line">मोघमन्नं विन्दते अप्रचेताः
सत्यं ब्रवीमि वध इत्स तस्य ।
नार्यमणं पुष्यति नो सखायं
केवलाघो भवति केवलादी ॥</div>
<div aria-hidden="true" style="margin: 12px auto 0; width: 120px; height: 1px; background: linear-gradient(90deg, rgba(166,124,52,0) 0%, #A67C34 50%, rgba(166,124,52,0) 100%)"></div>
<div style="margin-top: 8px; font-family: Inter, sans-serif; font-weight: 600; font-size: 12px; color: #C2AC88">Ṛgveda 10.117.6</div>
<div style="margin-top: 12px; font-weight: 500; font-size: 14px; line-height: 23px; color: #E9D8B6; text-align: left">{{c.vedaMeaning}}</div>
</div>
</div>
</sc-if>

<sc-if value="{{isS2}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="position: relative; border-radius: 22px; padding: 20px 18px; background: linear-gradient(180deg, #160A03 0%, #2A1508 55%, #5C3214 100%); border: 1px solid #A67C34; text-align: center">
<span aria-hidden="true" style="position: absolute; left: 24px; top: 18px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; right: 34px; top: 26px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>
<span aria-hidden="true" style="position: absolute; left: 60px; bottom: 22px; width: 2px; height: 2px; border-radius: 1px; background: #FFF3D6"></span>

mahatva: L('Navratri’s kanya-pujan teaches it directly — a young girl is honoured as the Devi and given food, cloth and dakshina. The tradition sees a deity in the child, so serving children is respect, not pity. A child left hungry or unschooled carries the lack for a lifetime, not for a day; food, a book or safety given here reaches that far.', 'नवरात्रि की कन्या-पूजन की रीति यही सिखाती है — बालिका को देवी मानकर भोजन, वस्त्र और दक्षिणा देना। परम्परा बच्चे में देवता देखती है, इसलिए बाल-सेवा दया नहीं, आदर है। भूखा या अनपढ़ रह गया बच्चा एक दिन का नहीं, पूरे जीवन का अभाव ढोता है; यहाँ दिया गया अन्न, पुस्तक या सुरक्षा वहीं तक जाती है।'),

cite: '', orgs: ['helpage'] },
{ id: 'vidya', name: L('Education', 'विद्या-दान'), short: L('Education', 'विद्या-दान'), whom: L('learners — books, fees, teaching', 'विद्यार्थी — पुस्तकें, शुल्क, शिक्षण'),
mahatva: L('Both Guru Purnima and Vasant Panchami carry the practice of vidya-daan — a book, a pen, a term’s fees, or one’s own hours of teaching. Knowledge is the one gift that does not diminish in the giving; and it leaves the receiver able to give in turn, which is why tradition places it next after anna-daan.', 'गुरु पूर्णिमा और वसंत पंचमी दोनों पर विद्या-दान की रीति है — पुस्तक, लेखनी, शुल्क या स्वयं पढ़ाने का समय। विद्या वह एक दान है जो देने से घटती नहीं; और यह पात्र को आगे देने योग्य बना देती है, इसलिए परम्परा इसे अन्न-दान के बाद रखती है।'),
cite: L('The daan tradition of Guru Purnima and Vasant Panchami', 'गुरु पूर्णिमा एवं वसंत पंचमी की दान-परम्परा'), orgs: ['rkm', 'cry'] },
{ id: 'arogya', name: L('Health', 'आरोग्य-सेवा'), short: L('Health', 'आरोग्य'), whom: L('the ill — medical care, blood donation, medicine', 'रोगी — चिकित्सा, रक्त-दान, औषधि'),
mahatva: L('Aushadha-daan and abhaya-daan — giving a sick person treatment, and giving them freedom from fear — travel together in the old lists, because illness brings want and fear at once. Blood donation is this in its present form: what is given is not money but something out of one’s own body, which cannot be priced and cannot be postponed.', 'औषध-दान और अभय-दान — रोगी को उपचार देना और भय से मुक्त करना — दान-सूचियों में सदा साथ आते हैं, क्योंकि रोग में अभाव और भय एक साथ आते हैं। रक्त-दान इसी का आज का रूप है: यहाँ दिया गया धन नहीं, शरीर से निकला वह दान है जिसका कोई मूल्य नहीं लगाया जा सकता और जिसे टाला भी नहीं जा सकता।'),
cite: '', orgs: ['eraktkosh', 'simplyblood', 'rkm', 'helpage', 'cry'] },

{ id: 'jeev', name: L('Animals & birds', 'जीव-सेवा'), short: L('Animals', 'जीव-सेवा'), whom: L('animals and birds — shelter, treatment, feed and water', 'पशु-पक्षी — आश्रय, चिकित्सा, दाना-पानी'),

mahatva: L('One limb of giving is desha-kāla — the fit receiver is the one whose need is now. Flood, earthquake or famine puts that “now” in front of you, and then giving does not wait for a festival. What is given here becomes food, shelter and rebuilding directly — and given late, it is wasted.', 'दान का एक अंग देश-काल है — सुपात्र वही है जिसे इसी समय आवश्यकता हो। बाढ़, भूकम्प या अकाल में वह काल सामने आ खड़ा होता है, और तब दान पर्व की प्रतीक्षा नहीं करता। यहाँ दिया गया सीधे अन्न, आश्रय और पुनर्निर्माण बनता है — और लौटने में देर हुई तो व्यर्थ हो जाता है।'),

function getPath(obj,path){return path.split('.').reduce((v,k)=>v==null?undefined:v[k],obj)}
function templateValue(raw,ctx){const m=String(raw).match(/^\s*{{([\s\S]+)}}\s*$/);return m?getPath(ctx,m[1].trim()):String(raw).replace(/{{([\s\S]+?)}}/g,(_,p)=>{const v=getPath(ctx,p.trim());return v==null?'':String(v)})}
function fillText(node,ctx){node.nodeValue=node.nodeValue.replace(/{{([\s\S]+?)}}/g,(_,p)=>{const v=getPath(ctx,p.trim());return v==null?'':String(v)})}
function makeIcon(cause,size){const d=document.createElement('div');d.className='icon-disc';d.style.width=size+'px';d.style.height=size+'px';d.style.borderRadius='50%';d.style.background='radial-gradient(circle at 35% 30%, #FFF5E0 0%, #F8D291 100%)';d.style.border='1.5px solid #A67C34';d.style.boxShadow='0 2px 6px rgba(90,58,30,.18)';d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';d.style.flexShrink='0';const holder=document.createElement('div');holder.innerHTML=ICON_SVG.replaceAll('{{px}}',String(size)).replaceAll('{{icon}}',String(Math.round(size*.64)));const svg=holder.firstElementChild;for(const n of [...svg.querySelectorAll('sc-if')]){const expr=n.getAttribute('value').match(/{{(.*?)}}/)[1];if(!getPath(iconCtx,expr)){n.remove()}else n.replaceWith(...n.childNodes)}d.append(svg);return d}
const iconCtx={isAnna:false,isGau:false,isBal:false,isVriddha:false,isVidya:false,isArogya:false,isVastra:false,isJeev:false,isAapada:false,isSeva:false};
function processNode(node,ctx){if(node.nodeType===3){fillText(node,ctx);return node}if(node.nodeType!==1)return node;
if(node.tagName.toLowerCase()==='sc-if'){const val=templateValue(node.getAttribute('value'),ctx);if(!val)return null;const frag=document.createDocumentFragment();for(const ch of [...node.childNodes]){const out=processNode(ch,ctx);if(out)frag.append(out)}return frag}
if(node.tagName.toLowerCase()==='sc-for'){const list=templateValue(node.getAttribute('list'),ctx)||[];const alias=node.getAttribute('as');const frag=document.createDocumentFragment();for(const item of list){const childCtx={...ctx,[alias]:item};for(const ch of [...node.childNodes]){const copy=ch.cloneNode(true);const out=processNode(copy,childCtx);if(out)frag.append(out)}}return frag}
if(node.tagName.toLowerCase()==='dc-import'){const cause=templateValue(node.getAttribute('cause'),ctx);const size=Number(templateValue(node.getAttribute('size'),ctx)||54);iconCtx.isAnna=cause==='anna';iconCtx.isGau=cause==='gau';iconCtx.isBal=cause==='bal';iconCtx.isVriddha=cause==='vriddha';iconCtx.isVidya=cause==='vidya';iconCtx.isArogya=cause==='arogya';iconCtx.isVastra=cause==='vastra';iconCtx.isJeev=cause==='jeev';iconCtx.isAapada=cause==='aapada';iconCtx.isSeva=cause==='seva';return makeIcon(cause,size)}
for(const attr of [...node.attributes]){if(attr.name.toLowerCase()==='onclick'){const fn=templateValue(attr.value,ctx);node.removeAttribute(attr.name);if(typeof fn==='function')node.addEventListener('click',e=>{if(node.tagName==='A')e.preventDefault();fn()});continue}const replaced=templateValue(attr.value,ctx);node.setAttribute(attr.name,String(replaced??''))}
if(node.tagName==='A'&&/CausePage\.dc\.html/.test(node.getAttribute('href')||'')){node.href='#cause-page';node.addEventListener('click',e=>{e.preventDefault();showCausePage()})}
for(const ch of [...node.childNodes]){const out=processNode(ch,ctx);if(!out)ch.remove();else if(out!==ch)ch.replaceWith(out)}return node}
let showCause=false;const controller=new Component({lang:'hi',startStep:0,frameHeight:1500});controller.paint=()=>renderMain();
function renderMain(){showCause=false;const stage=document.getElementById('stage');stage.innerHTML='';const root=document.getElementById('main-template').content.firstElementChild.cloneNode(true);const vals=controller.renderVals();const result=processNode(root,vals);stage.append(result);document.documentElement.lang='hi'}
function showCausePage(){showCause=true;const stage=document.getElementById('stage');stage.innerHTML='';const root=document.getElementById('cause-page-template').content.firstElementChild.cloneNode(true);stage.append(root);root.querySelector('[data-back]').addEventListener('click',e=>{e.preventDefault();renderMain()});const causes=[['anna','Food & water'],['gau','Gau seva'],['bal','Children'],['vriddha','Elder care'],['vidya','Education'],['arogya','Health'],['vastra','Clothing'],['jeev','Animals & birds'],['aapada','Disaster relief']];const ch=root.querySelector('#cause-chips');for(const [id,name] of causes){const b=document.createElement('button');b.className='chip';b.type='button';b.append(makeIcon(id,34),document.createTextNode(name));ch.append(b)}root.querySelectorAll('[data-cause-icon]').forEach(el=>el.append(makeIcon(el.dataset.causeIcon,Number(el.dataset.size))));const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const annaDays=[true,true,true,false,true,true,true];const area=root.querySelector('#cause-days');days.forEach((d,i)=>{const el=document.createElement('div');el.className='day';el.textContent=d;el.style.background=annaDays[i]?(i===5?'#2A1508':'#F8EFD6'):'#FFF9EE';el.style.color=annaDays[i]?(i===5?'#F2C46B':'#8A3E0B'):'#6E5230';el.style.border=annaDays[i]?'1px solid rgba(184,98,27,.4)':'1px dashed rgba(166,124,52,.35)';area.append(el)});const orgs=[['The Akshaya Patra Foundation','Fresh mid-day meals for government-school children, every school day.','Opens their website ›'],['Annamrita Foundation','Mid-day meals cooked in centralized kitchens and served in schools daily.','Opens their website ›'],['Change With One Foundation','A Delhi community kitchen — hot, unlimited meals served to anyone with dignity.','Opens their donation page ›'],['Sri Venkateswara Annaprasadam Trust (TTD)','Free annaprasadam for pilgrims at Tirumala.','Opens their website ›'],['Ramakrishna Math & Mission, Belur','Food, education, medical care and disaster relief.','Opens their website ›']];const os=root.querySelector('#cause-orgs');for(const [name,about,handoff] of orgs){const card=document.createElement('div');card.className='org';card.innerHTML='<strong></strong><div style="font-size:12.5px;line-height:19px;color:#6E5230"></div><div style="margin-top:4px;font:600 12px Inter,sans-serif;color:#8A3E0B"></div>';card.children[0].textContent=name;card.children[1].textContent=about;card.children[2].textContent=handoff;os.append(card)}}
renderMain();
</script>
