appId: com.prashantsharma.vedansh
---
- stopApp
- launchApp:
    arguments: { RCT_jsLocation: "127.0.0.1:8084" }
- waitForAnimationToEnd: { timeout: 30000 }
- scrollUntilVisible:
    element: { text: "Kundali. New. Tap to open." }
    direction: DOWN
    centerElement: true
- tapOn: "Kundali. New. Tap to open."
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { id: "jyotish-prashna-door" }
    direction: DOWN
    centerElement: true
- tapOn: "Open Prashna"
- extendedWaitUntil: { visible: { id: "purpose-vyapar" }, timeout: 15000 }
- tapOn: { id: "purpose-vyapar" }
- tapOn: { id: "question-business-partner" }
- scrollUntilVisible:
    element: { id: "prashna-phase" }
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- swipe: { start: "50%, 30%", end: "50%, 40%", duration: 500 }
- takeScreenshot: 01-current-phase
- scrollUntilVisible:
    element: { id: "phase-direction" }
    direction: DOWN
    centerElement: true
- takeScreenshot: 02-business-direction
- scrollUntilVisible:
    element: { text: "Open full Kundali reading" }
    direction: DOWN
    centerElement: true
- tapOn: "Open full Kundali reading"
- extendedWaitUntil: { visible: "Full Kundali reading", timeout: 15000 }
- takeScreenshot: 03-report-context
- tapOn: "Share chart summary"
- waitForAnimationToEnd
- takeScreenshot: 04-warned-share
