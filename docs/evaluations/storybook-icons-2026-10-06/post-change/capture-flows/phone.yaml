appId: com.prashantsharma.vedansh
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- tapOn: { text: "Skip tour", optional: true }
- tapOn: { text: "Begin", optional: true }
- tapOn: { text: "Skip tour|Skip|SKIP", optional: true }
- tapOn: { text: "Close", optional: true }
- tapOn: { text: "Got it", optional: true }
- tapOn: { text: "Not now|अभी नहीं", optional: true }
- tapOn: { text: "Allow|Don.t Allow", optional: true }
- tapOn: { id: "tab-home" }
- tapOn: { text: "Back", optional: true }
- scrollUntilVisible:
    element: { text: "Search verses, sections, and mantras" }
    direction: UP
    timeout: 20000
- swipe: { direction: DOWN }
- assertVisible: "Search verses, sections, and mantras"
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/01-phone-home
- swipe:
    start: "50%,80%"
    end: "50%,26%"
    duration: 2000
- assertVisible: "Chalisa\\..*Tap to open\\."
- assertVisible: "Kundali\\..*Tap to open\\."
- assertVisible: "Muhurat\\..*Tap to open\\."
- assertVisible: "Daan Punya\\..*Tap to open\\."
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/02-phone-grid
- tapOn: "Chalisa\\..*Tap to open\\."
- extendedWaitUntil:
    visible: "Hanuman Chalisa\\..*Tap to open\\."
    timeout: 15000
- tapOn: "Hanuman Chalisa\\..*Tap to open\\."
- tapOn: { text: "Start over", optional: true }
- assertVisible: "Share verse"
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/03-reader
- tapOn: { id: "tab-more" }
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/04-more
