appId: com.prashantsharma.vedansh
---
- launchApp:
    stopApp: true
- tapOn: { id: "tab-more" }
- scrollUntilVisible:
    element: { text: "Language,.*" }
    direction: DOWN
    timeout: 20000
- tapOn: "Language,.*"
- tapOn: "Hindi"
- tapOn: { id: "tab-home" }
- scrollUntilVisible:
    element: { text: "Search verses, sections, and mantras" }
    direction: UP
    timeout: 20000
- swipe: { direction: DOWN }
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/compact-home
- scrollUntilVisible:
    element: { text: "Kundali\\..*Tap to open\\." }
    direction: DOWN
    timeout: 20000
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/compact-new
