appId: com.prashantsharma.vedansh
---
- setOrientation: PORTRAIT
- launchApp:
    stopApp: true
- tapOn: { text: "Skip tour", optional: true }
- tapOn: { text: "Begin", optional: true }
- tapOn: { text: "Skip tour|Skip|SKIP", optional: true }
- tapOn: { text: "Close", optional: true }
- tapOn: { text: "Got it", optional: true }
- tapOn: { text: "Not now|अभी नहीं", optional: true }
- tapOn: { text: "Allow|Don.t Allow", optional: true }
- tapOn: { id: "tab-home" }
- tapOn: { text: "Back", optional: true }
- extendedWaitUntil:
    visible: ".*Today.s Panchang.*"
    timeout: 30000
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/tablet-portrait-home
- scrollUntilVisible:
    element: { text: "Chalisa\\..*Tap to open\\." }
    direction: DOWN
    timeout: 20000
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/tablet-portrait-grid
- scrollUntilVisible:
    element: { text: "Daan Punya\\..*Tap to open\\." }
    direction: DOWN
    timeout: 20000
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/tablet-portrait-lower
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Chalisa\\..*Tap to open\\." }
    direction: UP
    timeout: 20000
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/tablet-landscape-grid
- scrollUntilVisible:
    element: { text: "Daan Punya\\..*Tap to open\\." }
    direction: DOWN
    timeout: 20000
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/tablet-landscape-lower
- setOrientation: PORTRAIT
- waitForAnimationToEnd
- scrollUntilVisible:
    element: { text: "Daan Punya\\..*Tap to open\\." }
    direction: DOWN
    timeout: 20000
- takeScreenshot: docs/evaluations/storybook-icons-2026-10-06/post-change/tablet-portrait-return
