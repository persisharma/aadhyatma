appId: com.prashantsharma.vedansh
---
- launchApp:
    stopApp: true
- tapOn: { id: "tab-more" }
- scrollUntilVisible:
    element: { text: "Open Sadhak profile" }
    direction: UP
    timeout: 20000
- swipe: { direction: DOWN }
- assertVisible: "Open Sadhak profile"
- assertVisible: "Reminders,.*"
- assertVisible: "Wishlist,.*"
- takeScreenshot: more-after-top
- swipe:
    start: "50%,80%"
    end: "50%,24%"
    duration: 1500
- assertVisible: "Vastu Disha, new"
- assertVisible: "Daan Punya, new"
- assertVisible: "Language,.*"
- takeScreenshot: more-after-middle
- swipe:
    start: "50%,80%"
    end: "50%,24%"
    duration: 1500
- takeScreenshot: more-after-bottom
- scrollUntilVisible:
    element: { text: "Show App Tour" }
    direction: DOWN
    timeout: 20000
- assertVisible: "About and disclaimer"
- assertVisible: "Report an error"
- takeScreenshot: more-after-info
- scrollUntilVisible:
    element: { text: "About and disclaimer" }
    direction: UP
    centerElement: true
- tapOn: "About and disclaimer"
- assertVisible: "Close"
- tapOn: "Close"
- scrollUntilVisible:
    element: { text: "Language,.*" }
    direction: UP
    centerElement: true
- tapOn: "Language,.*"
- assertVisible: "English"
- tapOn: "English"
- scrollUntilVisible:
    element: { text: "Open Sadhak profile" }
    direction: UP
    timeout: 20000
- swipe: { direction: DOWN }
- takeScreenshot: more-after-english-top
- tapOn: "Open Sadhak profile"
- assertVisible: "Sadhak"
- tapOn: "‹"
- assertVisible: "Open Sadhak profile"
- scrollUntilVisible:
    element: { text: "Language,.*" }
    direction: DOWN
    centerElement: true
- tapOn: "Language,.*"
- tapOn: "Hindi"
- scrollUntilVisible:
    element: { text: "Open Sadhak profile" }
    direction: UP
    timeout: 20000
- swipe: { direction: DOWN }
