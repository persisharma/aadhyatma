<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>कारागार की वह रात</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Serif+Devanagari:wght@400;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  :root {
    --parchment: #F3E7C9;
    --parchment-soft: #F8EFD6;
    --parchment-deep: #E9D9B1;
    --ink: #1A0E03;
    --ink-soft: #5A3A1E;
    --ink-muted: #6E5230;
    --saffron: #B8621B;
    --saffron-deep: #8A3E0B;
    --gold: #A67C34;
    --bubble: #FFF8E6;
    --hi: "Noto Serif Devanagari", "Kohinoor Devanagari", "Mangal", serif;
    --en: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --display: "Yatra One", "Noto Serif Devanagari", serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--parchment-deep);
    background-image: radial-gradient(ellipse at 50% 0%, var(--parchment-soft) 0%, var(--parchment) 45%, var(--parchment-deep) 100%);
    color: var(--ink);
    font-family: var(--hi);
    padding-inline: 16px;
    padding-block: 12px 24px;
  }
  body.en { font-family: var(--en); }
  .book { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .crest { display: flex; align-items: center; gap: 8px; color: var(--saffron-deep); font-size: 14px; font-weight: 600; }
  .crest .om { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--saffron); display: grid; place-items: center; font-family: var(--hi); font-size: 15px; line-height: 1; }
  body.en .crest { font-family: var(--en); font-size: 16px; letter-spacing: .02em; }
  .lang { display: flex; border: 1.5px solid var(--gold); border-radius: 999px; overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--ink-muted); padding: 5px 12px; cursor: pointer; font-size: 14px; }
  .lang button:first-child { font-family: var(--hi); }
  .lang button:last-child { font-family: var(--en); font-style: italic; font-size: 15px; }
  .lang button[aria-pressed="true"] { background: var(--saffron-deep); color: var(--parchment-soft); }
  button:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

  .page { display: flex; flex-direction: column; gap: 12px; }
  .panel {
    position: relative; margin: 0; border-radius: 3px; overflow: hidden; background: #A42C1C;
    aspect-ratio: 4 / 5; max-width: 100%;
    box-shadow: 0 1px 0 rgba(26,14,3,.4), 0 8px 22px rgba(58, 30, 8, .28);
  }
  .panel svg.art, .panel img.art { display: block; width: 100%; height: 100%; }
  .panel img.art { object-fit: contain; background: var(--parchment-soft); }

  .bubble {
    position: absolute; background: var(--bubble); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px 9px;
    font-size: 15px; line-height: 1.5; box-shadow: 2px 3px 0 rgba(26,14,3,.55);
  }
  body.en .bubble { font-size: 16.5px; line-height: 1.3; }
  .bubble .who { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--saffron-deep); margin-bottom: 2px; }
  body.en .bubble .who { font-family: var(--en); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; }
  .bubble::after, .bubble::before { content: ""; position: absolute; width: 0; height: 0; border: solid transparent; }
  .bubble.t-bl::before { left: 22px; bottom: -16px; border-width: 16px 14px 0 0; border-top-color: var(--ink); }
  .bubble.t-bl::after { left: 24.5px; bottom: -11px; border-width: 11px 9px 0 0; border-top-color: var(--bubble); }
  .bubble.t-tr::before { right: 26px; top: -16px; border-width: 0 0 16px 14px; border-bottom-color: var(--ink); }
  .bubble.t-tr::after { right: 28.5px; top: -11px; border-width: 0 0 11px 9px; border-bottom-color: var(--bubble); }
  .bubble.voice { background: rgba(255, 244, 214, .95); border: 1.5px solid var(--gold); border-radius: 50% / 40%; text-align: center; padding: 12px 22px; box-shadow: 0 0 22px rgba(255, 220, 150, .85); }
  body.en .bubble.voice { font-style: italic; }

  .caption {
    background: var(--parchment-soft); border: 1px solid var(--gold); border-radius: 4px;
    padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 2px 6px rgba(58,30,8,.08);
  }
  .caption p { margin: 0; font-size: 17px; line-height: 1.75; color: var(--ink); text-wrap: pretty; }
  body.en .caption p { font-size: 19px; line-height: 1.45; }
  .src { align-self: flex-start; font-size: 11.5px; font-weight: 600; color: var(--saffron-deep); background: rgba(184, 98, 27, .12); border-radius: 999px; padding: 3px 10px; }
  body.en .src { font-family: var(--en); font-size: 13px; letter-spacing: .04em; }

  .cover-title { font-family: var(--display); font-size: 34px; line-height: 1.25; color: var(--saffron-deep); margin: 0; text-wrap: balance; }
  body.en .cover-title { font-family: var(--en); font-weight: 600; font-size: 36px; line-height: 1.1; }
  .cover-sub { font-size: 14px; color: var(--ink-soft); margin: 0; }
  body.en .cover-sub { font-size: 17px; font-style: italic; }

  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .nav button.step {
    border: 1.5px solid var(--saffron-deep); background: var(--parchment-soft); color: var(--saffron-deep);
    border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; min-width: 96px;
  }
  .nav button.step.primary { background: var(--saffron-deep); color: var(--parchment-soft); }
  .nav button.step:disabled { opacity: .35; cursor: default; }
  .count { font-size: 14px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .dots { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; }
  .dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: rgba(138, 62, 11, .25); cursor: pointer; }
  .dots button[aria-current="true"] { background: var(--saffron-deep); transform: scale(1.25); }

  .lessons { display: flex; flex-direction: column; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .lessons li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
  .lessons .n { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--saffron); color: var(--saffron-deep); display: grid; place-items: center; font-size: 14px; font-weight: 600; }
  .lessons strong { display: block; font-size: 17px; line-height: 1.5; }
  body.en .lessons strong { font-size: 19.5px; line-height: 1.25; }
  .lessons span.d { display: block; font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin-top: 2px; }
  body.en .lessons span.d { font-size: 16.5px; line-height: 1.35; }
  .h { font-family: var(--display); font-size: 24px; color: var(--saffron-deep); margin: 0; }
  body.en .h { font-family: var(--en); font-weight: 600; font-size: 27px; }
  .note { border-top: 1px dashed var(--gold); padding-top: 10px; font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
  body.en .note { font-size: 16px; line-height: 1.35; }
  .note b { color: var(--saffron-deep); }
  details { font-size: 13px; color: var(--ink-soft); }
  details summary { cursor: pointer; color: var(--saffron-deep); font-weight: 600; font-size: 14px; }
  details ol { padding-left: 20px; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; font-family: var(--en); font-size: 15px; line-height: 1.3; }
  .emblem { display: flex; justify-content: center; }

  .page.enter { animation: turn .38s ease-out; }
  @keyframes turn { from { opacity: .35; transform: translateX(var(--dir, 18px)); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .page.enter { animation: none; } }
  svg.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
</style>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#FFF0B8" stop-opacity="1"/><stop offset=".35" stop-color="#F6C552" stop-opacity=".6"/><stop offset="1" stop-color="#F6C552" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGlowRose"><stop offset="0" stop-color="#FFE0BC" stop-opacity="1"/><stop offset=".4" stop-color="#EC8A48" stop-opacity=".55"/><stop offset="1" stop-color="#EC8A48" stop-opacity="0"/></radialGradient>
    <radialGradient id="gMoon"><stop offset="0" stop-color="#FBF3DF" stop-opacity=".6"/><stop offset="1" stop-color="#FBF3DF" stop-opacity="0"/></radialGradient>
    <linearGradient id="gShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1024" stop-opacity="0"/><stop offset="1" stop-color="#0A1024" stop-opacity=".55"/></linearGradient>
    <pattern id="pFlor" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="#F6D478" opacity=".5">
        <g transform="translate(14 14)"><circle r="2"/><ellipse cy="-5" rx="1.8" ry="3.4"/><ellipse cy="5" rx="1.8" ry="3.4"/><ellipse cx="-5" rx="3.4" ry="1.8"/><ellipse cx="5" rx="3.4" ry="1.8"/></g>
        <g transform="translate(42 42)"><circle r="2"/><ellipse cy="-5" rx="1.8" ry="3.4"/><ellipse cy="5" rx="1.8" ry="3.4"/><ellipse cx="-5" rx="3.4" ry="1.8"/><ellipse cx="5" rx="3.4" ry="1.8"/></g>
        <circle cx="42" cy="14" r="1.2"/><circle cx="14" cy="42" r="1.2"/>
      </g>
    </pattern>
    <pattern id="pStars" width="90" height="90" patternUnits="userSpaceOnUse">
      <g fill="#FBF3DF" opacity=".75">
        <g transform="translate(18 22)"><ellipse cy="-4" rx="1.2" ry="2.8"/><ellipse cy="4" rx="1.2" ry="2.8"/><ellipse cx="-4" rx="2.8" ry="1.2"/><ellipse cx="4" rx="2.8" ry="1.2"/></g>
        <g transform="translate(64 66)"><ellipse cy="-3" rx="1" ry="2.2"/><ellipse cy="3" rx="1" ry="2.2"/><ellipse cx="-3" rx="2.2" ry="1"/><ellipse cx="3" rx="2.2" ry="1"/></g>
        <circle cx="70" cy="18" r="1.1"/><circle cx="30" cy="70" r="1"/><circle cx="48" cy="44" r=".8"/>
      </g>
    </pattern>
    <pattern id="pBrick" width="48" height="24" patternUnits="userSpaceOnUse"><path d="M0 .75H48M0 12.75H48M.75 0V12M24.75 12V24" stroke="rgba(0,0,0,.3)" stroke-width="1.5" fill="none"/><path d="M3 3H20M28 15H44" stroke="rgba(255,230,190,.07)" stroke-width="2" fill="none"/></pattern>
    <pattern id="pWave" width="28" height="14" patternUnits="userSpaceOnUse"><path d="M0,14 Q7,2 14,14 Q21,2 28,14" stroke="#A8DADB" stroke-width="1.6" fill="none" opacity=".75"/></pattern>
    <pattern id="pRain" width="24" height="40" patternUnits="userSpaceOnUse"><path d="M20 0 L12 16 M8 22 L0 38" stroke="rgba(210,228,255,.4)" stroke-width="1.5" fill="none"/></pattern>
    <pattern id="pDotW" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r=".95" fill="rgba(255,244,214,.6)"/></pattern>
    <pattern id="pDotR" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1" fill="rgba(170,34,24,.6)"/></pattern>
    <g id="chain" fill="none" stroke="#1A0E03" stroke-width="4.2"><ellipse cx="0" cy="0" rx="5" ry="8"/><ellipse cx="0" cy="14" rx="3" ry="8"/><ellipse cx="0" cy="28" rx="5" ry="8"/><ellipse cx="0" cy="42" rx="3" ry="8"/><ellipse cx="0" cy="56" rx="5" ry="8"/><ellipse cx="0" cy="70" rx="3" ry="8"/><ellipse cx="0" cy="84" rx="5" ry="8"/></g>
    <g id="chainIn" fill="none" stroke="#8A8378" stroke-width="2"><ellipse cx="0" cy="0" rx="5" ry="8"/><ellipse cx="0" cy="14" rx="3" ry="8"/><ellipse cx="0" cy="28" rx="5" ry="8"/><ellipse cx="0" cy="42" rx="3" ry="8"/><ellipse cx="0" cy="56" rx="5" ry="8"/><ellipse cx="0" cy="70" rx="3" ry="8"/><ellipse cx="0" cy="84" rx="5" ry="8"/></g>
    <g id="rays" fill="#FFE7A6" opacity=".2">
      <path d="M0,0 L-26,-280 L26,-280 Z"/><path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(30)"/><path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(-30)"/>
      <path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(60)"/><path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(-60)"/><path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(90)"/>
      <path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(-90)"/><path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(135)"/><path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(-135)"/><path d="M0,0 L-26,-280 L26,-280 Z" transform="rotate(180)"/>
    </g>
  </defs>
</svg>

<main class="book">
  <header class="topbar">
    <div class="crest"><span class="om" aria-hidden="true">ॐ</span><span id="crestText">श्रीकृष्ण जन्म</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langHi" aria-pressed="true">हिं</button>
      <button type="button" id="langEn" aria-pressed="false">EN</button>
    </div>
  </header>

  <article class="page" id="page" aria-live="polite"></article>

  <nav class="nav" aria-label="Pages">
    <button type="button" class="step" id="prev">‹</button>
    <span class="count" id="count"></span>
    <button type="button" class="step primary" id="next">›</button>
  </nav>
  <div class="dots" id="dots"></div>
</main>

<script>
(function () {
  /* ---------- Pattachitra drawing kit ---------- */
  const OL = '#1A0E03', GOLD = '#E2A93B', GOLD2 = '#F6D478', RED = '#B8261B', CREAM = '#FBF3DF', WOOD = '#8B5A2B';
  const SK = { fair: '#F3C49A', wheat: '#DDA271', kansa: '#CF8F66', blue: '#2F6DB5', devi: '#F2B05A' };

  const sh = (d, fill, w) => `<path d="${d}" fill="${fill}" stroke="${OL}" stroke-width="${w || 2}" stroke-linejoin="round"/>`;
  const limb = (d, c, w) => `<path d="${d}" fill="none" stroke="${OL}" stroke-width="${w + 3.5}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const hand = (x, y, c, r) => `<circle cx="${x}" cy="${y}" r="${r || 4.6}" fill="${c}" stroke="${OL}" stroke-width="1.8"/>`;
  const fig = (x, y, s, body, flip) => `<g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})">${body}</g>`;
  const glow = (x, y, r, id) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id || 'gGlow'})"/>`;
  const dotted = (d, c, gap) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="3.2" stroke-dasharray="0.1 ${gap || 8}" stroke-linecap="round"/>`;

  const FACE_M = 'M-12,-188 Q0,-196 9,-189 Q14,-184 14,-176 L21,-167 L15,-165 L16,-161 L13.5,-159.5 L15,-156 Q11,-150 4,-150 Q-6,-150 -10,-157 Q-17,-170 -12,-188 Z';
  const HAIR_M = 'M-13,-186 Q-1,-199 11,-190 Q3,-190 -3,-185 Q-9,-177 -8,-163 Q-12,-158 -15,-166 Q-18,-177 -13,-186 Z';
  const FACE_F = 'M-12,-186 Q0,-195 9,-188 Q13,-183 13,-176 L19,-168 L14,-166 L15,-162 L13,-160.5 L14,-157.5 Q10,-151 4,-151 Q-6,-151 -10,-158 Q-16,-170 -12,-186 Z';

  function headM(h) {
    const sk = h.skin, hair = '#140B04';
    let s = '';
    if (h.gear === 'bun') s += `<circle cx="-9" cy="-192" r="8.5" fill="${hair}" stroke="${OL}" stroke-width="2"/>`;
    s += sh(FACE_M, sk) + sh(HAIR_M, hair);
    s += `<ellipse cx="-3" cy="-168" rx="3.2" ry="4.6" fill="${sk}" stroke="${OL}" stroke-width="1.4"/><circle cx="-3" cy="-161" r="2.6" fill="${GOLD}" stroke="${OL}" stroke-width="1"/>`;
    s += h.eyeClosed
      ? `<path d="M3.5,-174.5 Q8.5,-171.5 13.5,-175" fill="none" stroke="${OL}" stroke-width="1.6"/>`
      : `<path d="M3,-175 Q8,-179.5 13.5,-175.5 Q8,-171.8 3,-175 Z" fill="${CREAM}" stroke="${OL}" stroke-width="1.4"/><circle cx="9.2" cy="-175.6" r="1.9" fill="${OL}"/>`;
    s += h.fierce
      ? `<path d="M2,-178 L14.5,-183.5" stroke="${OL}" stroke-width="2.4" stroke-linecap="round"/>`
      : `<path d="M2,-180 Q8,-184 14,-180.5" fill="none" stroke="${OL}" stroke-width="1.6"/>`;
    s += `<path d="M14.6,-160.6 L17.2,-160.2" stroke="#9E2A1C" stroke-width="1.8" stroke-linecap="round"/>`;
    if (h.tilak !== false) s += `<path d="M15.6,-187 L14.8,-181.5" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>`;
    if (h.beard) s += sh('M15,-157 Q13,-144 2,-142 Q-8,-145 -10,-157 Q-2,-151 6,-151 Q11,-152 15,-157 Z', hair);
    if (h.mst === 'curl') s += sh('M15.5,-163 Q7,-158.5 0,-165 Q-3,-169 0,-171 Q1,-164 15,-160.5 Z', hair);
    else if (h.mst) s += sh('M15.5,-163 Q9,-159.5 3,-164 Q8,-158 15,-160.5 Z', hair);
    if (h.gear === 'crown') s += sh('M-14,-186 L-13,-205 L-7,-198 L-1,-215 L5,-198 L11,-206 L13,-186 Z', GOLD) + sh('M-15,-189 L14,-189 L14,-184 L-15,-184 Z', GOLD2) + `<circle cx="-1" cy="-202" r="2.6" fill="${RED}"/><circle cx="-8" cy="-193" r="1.7" fill="${RED}"/><circle cx="7" cy="-193" r="1.7" fill="${RED}"/>`;
    if (h.gear === 'helmet') s += sh('M-15,-183 Q-2,-207 15,-183 Q0,-188 -15,-183 Z', '#9A9A92') + sh('M-2,-199 L0,-212 L2.5,-199 Z', '#9A9A92') + `<path d="M-15,-184 Q0,-189 15,-184" stroke="${GOLD}" stroke-width="2.2" fill="none"/>`;
    if (h.gear === 'bun') s += `<path d="M-16,-190 Q-9,-185 -2,-190" fill="none" stroke="${GOLD}" stroke-width="2.2"/>`;
    return s;
  }

  const D_STAND = 'M-21,-100 L21,-100 L25,-40 L21,-4 L6,-4 L2,-46 L-2,-46 L-6,-4 L-21,-4 L-25,-40 Z';
  const D_WALK = 'M-21,-100 L21,-100 L29,-44 L33,-5 L18,-5 L10,-44 L0,-60 L-10,-44 L-18,-5 L-33,-5 L-29,-44 Z';

  function man(o) {
    const sk = o.skin, A = o.arms;
    let s = limb(A.back.d, sk, 8) + hand(A.back.h[0], A.back.h[1], sk);
    const fx = o.walk ? [-26, 27] : [-13, 14];
    s += fx.map(x => `<ellipse cx="${x}" cy="-3" rx="8" ry="3.5" fill="${sk}" stroke="${OL}" stroke-width="1.6"/>`).join('');
    const dd = o.walk ? D_WALK : D_STAND;
    s += sh(dd, o.dhoti) + `<path d="${dd}" fill="url(#pDotR)"/>`;
    s += `<path d="M0,-100 L0,-62" stroke="${OL}" stroke-width="1.3"/>` + `<path d="${o.walk ? 'M-31,-26 L-18,-26 M18,-26 L31,-26' : 'M-24,-26 L-4,-26 M4,-26 L23,-26'}" stroke="${o.border}" stroke-width="3.4"/>`;
    s += sh('M-21,-106 L21,-106 L21,-98 L-21,-98 Z', o.border);
    s += sh('M-5,-154 L5,-154 L5,-146 L-5,-146 Z', sk);
    s += sh('M-16,-150 Q0,-155 16,-150 L20,-104 L-20,-104 Z', sk);
    if (o.sash) s += sh('M-15,-149 L-6,-152 L20,-106 L11,-102 Z', o.sash);
    s += `<path d="M-9,-150 Q0,-137 9,-150" fill="none" stroke="${GOLD}" stroke-width="2.6"/>`;
    if (o.pre) s += o.pre;
    s += limb(A.front.d, sk, 8) + hand(A.front.h[0], A.front.h[1], sk);
    s += headM(o.head);
    if (o.post) s += o.post;
    return s;
  }

  function woman(o) {
    const sk = o.skin, A = o.arms, hair = '#140B04';
    let s = limb(A.back.d, sk, 6.5) + hand(A.back.h[0], A.back.h[1], sk, 4);
    s += [-13, 13].map(x => `<ellipse cx="${x}" cy="-3" rx="7" ry="3.2" fill="${sk}" stroke="${OL}" stroke-width="1.5"/>`).join('');
    const SKD = 'M-20,-112 L20,-112 L34,-5 L-34,-5 Z';
    s += sh(SKD, o.sari) + `<path d="${SKD}" fill="url(#pDotW)"/>`;
    s += sh('M-34,-5 L34,-5 L32.4,-17 L-32.4,-17 Z', o.border) + dotted('M-31,-11 L31,-11', RED, 6);
    s += `<path d="M4,-112 L10,-17 M10,-112 L19,-17" stroke="${OL}" stroke-width="1.2" fill="none"/>`;
    s += sh('M-4.5,-153 L4.5,-153 L4.5,-146 L-4.5,-146 Z', sk);
    s += sh('M-14,-150 Q0,-154 14,-150 L16,-110 L-16,-110 Z', o.blouse);
    s += `<path d="M-8,-150 Q0,-139 8,-150" fill="none" stroke="${GOLD}" stroke-width="2.4"/>`;

            note1: '<b>भागवत में है:</b> आकाशवाणी, वसुदेव का वचन, बलराम का गर्भ-स्थानांतरण, चतुर्भुज दर्शन, शेषनाग की छाया, यमुना का मार्ग देना, योगमाया।',
            note2: '<b>लोक-परंपरा है:</b> यमुना का शिशु के चरण छूने के लिए ऊपर उठना, और शिशु को टोकरी में ले जाना।',
            srcLine: 'स्रोत: श्रीमद्भागवत महापुराण, दशम स्कन्ध, अध्याय 1–4',
            art: 'चित्र-निर्देश (चित्रकार या इमेज-मॉडल के लिए)' },
      en: { h: 'What this story teaches', items: [
              ['Dharma appears when the dark is deepest.', 'Yada yada hi dharmasya glanir bhavati Bharata… (Gita 4.7). The Lord was born at midnight in a prison, not in the light of a palace.'],
              ['A promise holds, even to an enemy.', 'Vasudeva handed over his firstborn himself, and after Gokul he put the fetters back on his own feet.'],
              ['Fear makes you blind.', 'Kansa killed six innocents to escape what he feared, and it came anyway.']],
            noteTitle: 'Scripture and folk tradition',
            note1: '<b>In the Bhagavata:</b> the voice from the sky, Vasudeva’s promise, Balarama’s transfer to Rohini, the four-armed vision, Shesha’s shelter, the Yamuna making way, Yogamaya.',
            note2: '<b>Folk tradition:</b> the Yamuna rising to touch the baby’s feet, and carrying him in a basket.',
            srcLine: 'Source: Shrimad Bhagavata Purana, Book 10, chapters 1–4',
            art: 'Art brief (for a painter or an image model)' } }
  ];

  const artBrief = [
    'Cover: barred prison window with a half moon (Krishna Ashtami); Devaki and Vasudeva in prayer; newborn Krishna glowing on a red cloth.',
    'Wedding chariot in Mathura; Kansa driving, Devaki and Vasudeva behind; golden light and a voice breaking through the sky.',
    'Kansa gripping Devaki’s hair with a raised sword; Vasudeva calm, pleading, stepping forward.',
    'Stone cell with chains; six extinguished clay lamps; one soft light rising away (Balarama to Rohini).',
    'Midnight in the cell; half moon through bars; a sentry awake; the couple barely visible.',
    'Four-armed Vishnu in yellow silk with conch, discus, mace, lotus, Kaustubha gem; cell flooded with light; parents in awe.',
    'Guards asleep, great door swung open onto a rainstorm; Vasudeva walking out with the glowing baby.',
    'Powerful flooded Yamuna with curling waves, sweeping currents and ivory foam in muted slate blue-grey and sage; Vasudeva mid-river; five-hooded Shesha sheltering the baby from rain.',
    'Gokul hut at night; Yashoda asleep with baby Krishna; Vasudeva leaving with the baby girl.',
    'Eight-armed Devi rising above the cell with weapons; Kansa below, sword raised.'
  ];
  const STYLE = "Style for every page: Soft Indian devotional storybook illustration with thin warm-grey and brown outlines, graceful expressive almond-shaped eyes, smooth broad pastel fills and minimal gentle cel shading. Muted low-saturation palette: warm ivory parchment, powder-blue divine skin, dusty saffron and terracotta, sage and slate blue-grey water, restrained matte gold. Subtle paper texture, faint washed-out architecture, clear characters and simplified background detail. Devotional, dignified and suitable for children. Convey action through poses and shapes rather than loud colour or theatrical lighting. No heavy black comic outlines, saturated cobalt, vivid orange, photorealism, 3D, ornate borders or dense ornamentation. No text, no letters, no watermark. 4:5 portrait.";

  /* ---------- Reader ---------- */
  const DEVA = '०१२३४५६७८९';
  let lang = 'hi';
  try { const s = localStorage.getItem('kj-lang'); if (s === 'en' || s === 'hi') lang = s; } catch (e) {}
  let idx = 0;
  const m = /^#p(\d+)$/.exec(location.hash || '');
  if (m) idx = Math.min(pages.length - 1, Math.max(0, parseInt(m[1], 10) - 1));

  const num = (n) => lang === 'hi' ? String(n).replace(/\d/g, d => DEVA[d]) : String(n);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const artCache = {};
  // Approved generated artwork; other scenes retain SVG placeholders until their assets are ready.
  const artAssets = { yamuna: 'assets/krishna-janma/kj-08.webp' };
  const art = (key, label) => artAssets[key]
    ? `<img class="art" src="${artAssets[key]}" alt="${label}" width="1122" height="1402" decoding="async">`
    : (artCache[key] || (artCache[key] = scenes[key]())) && svg(artCache[key], label);

  function render(dir) {
    const p = pages[idx];
    const t = p[lang];
    const el = $('page');
    let html = '';
    if (p.kind === 'seekh') {
      html = `<div class="caption">
        <div class="emblem">${emblem}</div>
        <h2 class="h">${t.h}</h2>
        <ol class="lessons">${t.items.map((it, i) => `<li><span class="n">${num(i + 1)}</span><div><strong>${esc(it[0])}</strong><span class="d">${esc(it[1])}</span></div></li>`).join('')}</ol>
        <div class="note"><div><b>${t.noteTitle}</b></div><div>${t.note1}</div><div>${t.note2}</div><div style="margin-top:6px">${t.srcLine}</div></div>
        <details><summary>${t.art}</summary><ol>${artBrief.map(a => `<li>${esc(a)}</li>`).join('')}</ol><p style="font-family:var(--en);font-size:15px;margin:8px 0 0">${STYLE}</p></details>
      </div>`;
    } else {
      const b = p.bubble && t.say ? `<div class="bubble ${p.bubble.cls}" style="${p.bubble.pos}"><span class="who">${esc(t.who)}</span>${esc(t.say)}</div>` : '';
      const panel = `<figure class="panel">${art(p.scene, esc(t.alt))}${b}</figure>`;
      if (p.kind === 'cover') {
        html = panel + `<div class="caption"><h1 class="cover-title">${t.title}</h1><p class="cover-sub">${t.sub}</p></div>`;
      } else {
        const srcLabel = (lang === 'hi' ? 'भागवत ' : 'Bhagavata ') + num(p.src);
        html = panel + `<div class="caption"><p>${esc(t.cap)}</p><span class="src">${srcLabel}</span></div>`;
      }
    }
    el.innerHTML = html;
    el.classList.remove('enter'); void el.offsetWidth;
    if (dir) { el.style.setProperty('--dir', dir > 0 ? '18px' : '-18px'); el.classList.add('enter'); }

    $('count').textContent = `${num(idx + 1)} / ${num(pages.length)}`;
    $('prev').disabled = idx === 0;
    $('next').disabled = idx === pages.length - 1;
    const hi = lang === 'hi';
    $('prev').textContent = hi ? '‹ पिछला' : '‹ Back';
    $('next').textContent = hi ? 'आगे ›' : 'Next ›';
    $('crestText').textContent = hi ? 'श्रीकृष्ण जन्म' : 'Krishna Janma';
    document.body.classList.toggle('en', !hi);
    document.documentElement.lang = hi ? 'hi' : 'en';
    $('langHi').setAttribute('aria-pressed', String(hi));
    $('langEn').setAttribute('aria-pressed', String(!hi));
    [...$('dots').children].forEach((d, i) => d.setAttribute('aria-current', String(i === idx)));
  }

  function go(n) {
    if (n < 0 || n >= pages.length || n === idx) return;
    const dir = n > idx ? 1 : -1;
    idx = n;
    try { history.replaceState(null, '', '#p' + (idx + 1)); } catch (e) {}
    render(dir);
  }

  pages.forEach((_, i) => {
    const d = document.createElement('button');
    d.type = 'button';
    d.setAttribute('aria-label', 'Page ' + (i + 1));
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });
  $('prev').addEventListener('click', () => go(idx - 1));
  $('next').addEventListener('click', () => go(idx + 1));
  const setLang = (l) => { lang = l; try { localStorage.setItem('kj-lang', l); } catch (e) {} render(0); };
  $('langHi').addEventListener('click', () => setLang('hi'));
  $('langEn').addEventListener('click', () => setLang('en'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') go(idx + 1);
    if (e.key === 'ArrowLeft') go(idx - 1);
  });
  let sx = null, sy = null;
  $('page').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('page').addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(idx + (dx < 0 ? 1 : -1));
    sx = null;
  }, { passive: true });

  render(0);
})();
</script>
</body></html>
