<!doctype html><meta charset="utf-8"><title>Bālakāṇḍa space audit</title><style>
@font-face{font-family:hi;src:url(../balakanda-bilingual-v2/fonts/NotoSerifDevanagari_500Medium.ttf)}
@font-face{font-family:en;src:url(../balakanda-bilingual-v2/fonts/CormorantGaramond_500Medium.ttf)}
*{box-sizing:border-box}body{margin:12px;background:#eee;color:#302318;font-family:system-ui}h1{font-size:18px;margin:4px}nav{font-size:12px;margin:10px}a{margin-right:12px}#grid{display:grid;grid-template-columns:repeat(4,240px);gap:8px}.cell{height:450px;background:white;overflow:hidden}.label{height:24px;font:10px system-ui;padding:3px}.viewport{width:390px;height:auto;min-height:604px;background:#f4e8cb;padding:0 8px 8px;transform:scale(.6);transform-origin:top left;overflow:hidden}.panel{border:2px solid #302318}.narration,.framing{font:20px/34px hi;padding:10px 12px;margin:0}.narration{border-bottom:1.5px solid #302318}.framing{padding:0 8px;margin-bottom:6px}.scene{position:relative}.crop{position:relative;overflow:hidden}.crop img{position:absolute;max-width:none}.speech{position:absolute;padding:8px 12px;font:20px/34px hi;text-align:center}.speech svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.speech span{position:relative}.en .narration,.en .framing,.en .speech{font-family:en;line-height:33px}.large .narration,.large .framing,.large .speech{font-size:23px;line-height:39px}.large.en .narration,.large.en .framing,.large.en .speech{line-height:38px}
</style><h1>Full-book space audit — browser model of native panel geometry · complete art shown</h1><p style="font-size:11px;margin:4px">390px page · 604px reading area · source art / full reviewed frames · separate from native device evidence</p><nav id="nav"></nav><div id="grid"></div><script src="../balakanda-bilingual-v2/speech-layouts.js"></script><script>
const q=new URLSearchParams(location.search),sheet=+(q.get('sheet')||1),lang=q.get('lang')||'hi',large=q.get('large')==='1';document.body.classList.toggle('en',lang==='en');document.body.classList.toggle('large',large);
for(let i=1;i<=7;i++){const a=document.createElement('a');a.href='?sheet='+i+'&lang='+lang+'&large='+(large?1:0);a.textContent='Pages '+((i-1)*20+1)+'–'+(i*20);document.querySelector('nav').append(a)}
fetch('evidence/current-browser-panels.json').then(r=>r.json()).then(async rows=>{
 for(const p of rows){const cell=document.createElement('section');cell.className='cell';cell.dataset.number=p.number;cell.dataset.id=p.id;const label=document.createElement('div');label.className='label';label.textContent=p.number+' · '+p.id;cell.append(label);const viewport=document.createElement('div');viewport.className='viewport';if(p.framing){const f=document.createElement('p');f.className='framing';f.textContent=lang==='hi'?p.framing:p.framingEn;viewport.append(f)}const panel=document.createElement('article');panel.className='panel';const n=document.createElement('p');n.className='narration';n.textContent=p[lang].narration;panel.append(n);const scene=document.createElement('div');scene.className='scene';const crop=document.createElement('div');crop.className='crop';const w=370,h=w*p.dimensions.height*p.frame.height/(p.dimensions.width*p.frame.width);crop.style.height=h+'px';const img=document.createElement('img');img.src='../balakanda-bilingual-v2/'+p.asset;img.style.width=(w/p.frame.width)+'px';img.style.height=(w/p.frame.width*p.dimensions.height/p.dimensions.width)+'px';img.style.left=(-w/p.frame.width*p.frame.x)+'px';img.style.top=(-w/p.frame.width*p.dimensions.height/p.dimensions.width*p.frame.y)+'px';crop.append(img);scene.append(crop);if(p[lang].dialogue){const s=document.createElement('div');s.className='speech';const lay=window.comicSpeechLayouts[p.id];s.style.width=(w*lay.width)+'px';s.style.left=(w*lay.x)+'px';s.innerHTML='<svg><path fill="#fffdf5" stroke="#302318" stroke-width="1.5"/></svg><span></span>';s.querySelector('span').textContent=p[lang].dialogue;scene.append(s)}panel.append(scene);viewport.append(panel);cell.append(viewport);document.querySelector('#grid').append(cell);}
 await document.fonts.ready;
 for(const cell of document.querySelectorAll('.cell')){const p=rows[+cell.dataset.number-1],s=cell.querySelector('.speech');if(s){const a=cell.querySelector('.crop').offsetHeight,l=window.comicSpeechLayouts[p.id],height=s.offsetHeight,g=window.comicSpeechGeometry(l,370,a,height),fit=window.comicSpeechFits(l,a,height);s.style.top=fit?g.y+'px':'0';if(!fit){s.style.position='relative';s.querySelector('svg').style.display='none'}else{s.querySelector('svg').setAttribute('viewBox',`0 0 ${g.width} ${height}`);s.querySelector('path').setAttribute('d',window.comicBalloonPath(0,0,g.width,height,370*l.tipX-g.x,a*l.tipY-g.y,l.tail))}}const v=cell.querySelector('.viewport'),ph=cell.querySelector('.panel').offsetHeight+(cell.querySelector('.framing')?.offsetHeight||0)+(p.framing?6:0);cell.dataset.height=ph;cell.style.height=(Math.max(604,ph+8)*.6+28)+'px';cell.dataset.blank=Math.max(0,(604-ph-8)/604*100).toFixed(1);cell.querySelector('.label').textContent+=' · '+cell.dataset.blank+'% empty';if(+cell.dataset.number<=(sheet-1)*20||+cell.dataset.number>sheet*20)cell.style.display='none';}
 document.body.dataset.ready='true';
});</script>
