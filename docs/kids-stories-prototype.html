    #vedansh-kids-preview { padding: 16px; }
    #vedansh-kids-preview .story-app { max-width: 420px; margin: auto; background: #f3e7c9; color: #1a0e03; border-radius: 24px; overflow: hidden; font-family: Georgia, 'Noto Serif Devanagari', 'Noto Serif Gujarati', 'Noto Serif Kannada', serif; }
    #vedansh-kids-preview header { display: flex; gap: 12px; padding: 18px; align-items: center; }
    #vedansh-kids-preview header strong { flex: 1; font-size: 17px; font-weight: 500; }
    #vedansh-kids-preview button { border: 1px solid #d5c09c; border-radius: 22px; background: #f8efd6; color: #8a3e0b; font: inherit; padding: 10px 14px; min-height: 44px; }
    #vedansh-kids-preview select { background: #f8efd6; color: #5a3a1e; border: 1px solid #d5c09c; border-radius: 12px; padding: 8px; min-height: 44px; font: inherit; max-width: 108px; }
    #vedansh-kids-preview .story-content { padding: 0 18px 18px; }
    #vedansh-kids-preview .art { width: 100%; aspect-ratio: 4 / 5; background: #f8efd6; border-radius: 12px; overflow: hidden; }
    #vedansh-kids-preview .art img, #vedansh-kids-preview .art svg { display: block; width: 100%; height: 100%; object-fit: contain; }
    #vedansh-kids-preview .caption { background: #f8efd6; padding: 18px; border-radius: 12px; margin-top: 12px; }
    #vedansh-kids-preview h2 { color: #8a3e0b; margin: 0 0 10px; font-size: 23px; font-weight: 500; line-height: 1.5; }
    #vedansh-kids-preview p { font-size: 19px; line-height: 1.75; margin: 0; }
    #vedansh-kids-preview .source { margin-top: 12px; color: #6e5230; font-size: 13px; }

  <script>
    (() => {
      const root = document.getElementById('vedansh-kids-preview');
      const story = {"id":"krishna-janma","deityId":"krishna","coverArt":"cover","ageMin":6,"title":{"hi":"कृष्ण की जन्म-कथा","en":"The Birth of Krishna","gu":"કૃષ્ણની જન્મકથા","kn":"ಕೃಷ್ಣನ ಜನ್ಮಕಥೆ"},"description":{"hi":"एक कठिन रात में साहस, प्रेम और आशा की कहानी।","en":"A story of courage, love and hope on a difficult night.","gu":"એક મુશ્કેલ રાતમાં સાહસ, પ્રેમ અને આશાની વાર્તા.","kn":"ಕಷ್ಟದ ರಾತ್ರಿಯಲ್ಲಿ ಧೈರ್ಯ, ಪ್ರೀತಿ ಮತ್ತು ಭರವಸೆಯ ಕಥೆ."},"sourceNote":{"hi":"श्रीमद्भागवत, दशम स्कन्ध, अध्याय 1–4 से सरल रूपांतरण। टोकरी का चित्रण लोक-परंपरा से है।","en":"A simple retelling of Bhagavata Purana, Book 10, chapters 1–4. The basket illustration follows folk tradition.","gu":"શ્રીમદ્ ભાગવત, દશમ સ્કંધ, અધ્યાય 1–4નું સરળ રૂપાંતર. ટોપલીનું ચિત્રણ લોકપરંપરા મુજબ છે.","kn":"ಶ್ರೀಮದ್ಭಾಗವತದ ಹತ್ತನೇ ಸ್ಕಂಧದ 1–4 ಅಧ್ಯಾಯಗಳ ಸರಳ ರೂಪಾಂತರ. ಬುಟ್ಟಿಯ ಚಿತ್ರಣ ಜನಪದ ಪರಂಪರೆಯನ್ನು ಅನುಸರಿಸುತ್ತದೆ."},"takeaway":{"hi":"कठिन समय में भी प्रेम, साहस और आशा हमारा साथ दे सकते हैं।","en":"Even in difficult times, love, courage and hope can guide us.","gu":"મુશ્કેલ સમયમાં પણ પ્રેમ, સાહસ અને આશા આપણને માર્ગ બતાવી શકે છે.","kn":"ಕಷ್ಟದ ಸಮಯದಲ್ಲಿಯೂ ಪ್ರೀತಿ, ಧೈರ್ಯ ಮತ್ತು ಭರವಸೆ ನಮಗೆ ದಾರಿ ತೋರಿಸಬಹುದು."},"pages":[{"id":"wedding","art":"wedding","source":"10.1.24–28","title":{"hi":"विवाह का उत्सव","en":"A Joyful Wedding","gu":"લગ્નનો ઉત્સવ","kn":"ಮದುವೆಯ ಸಂಭ್ರಮ"},"text":{"hi":"देवकी और वसुदेव का विवाह बड़े आनंद से हुआ। देवकी के भाई कंस ने स्नेह से स्वयं उनका रथ हाँका। सारा मथुरा नगर खुशियों से भर उठा।","en":"Devaki and Vasudeva were married with great joy. Her brother Kansa lovingly drove their chariot himself. All of Mathura brimmed with happiness.","gu":"દેવકી અને વસુદેવનાં લગ્ન ખૂબ આનંદથી થયાં. દેવકીના ભાઈ કંસે પ્રેમથી જાતે તેમનો રથ હાંક્યો. આખું મથુરા નગર ખુશીથી ભરાઈ ગયું.","kn":"ದೇವಕಿ ಮತ್ತು ವಸುದೇವರ ಮದುವೆ ಬಹಳ ಸಂತೋಷದಿಂದ ನಡೆಯಿತು. ದೇವಕಿಯ ಸಹೋದರ ಕಂಸ ಪ್ರೀತಿಯಿಂದ ತಾನೇ ಅವರ ರಥವನ್ನು ಓಡಿಸಿದ. ಇಡೀ ಮಥುರಾ ನಗರ ಸಂತೋಷದಿಂದ ತುಂಬಿತು."}},{"id":"prophecy","art":"chariot","source":"10.1.29–34","title":{"hi":"आकाश से आई चेतावनी","en":"A Warning from the Sky","gu":"આકાશમાંથી આવેલી ચેતવણી","kn":"ಆಕಾಶದಿಂದ ಬಂದ ಎಚ್ಚರಿಕೆ"},"text":{"hi":"उत्सव के बीच अचानक आकाशवाणी गूँजी — \"हे कंस! देवकी की आठवीं संतान ही तेरा अंत करेगी।\" यह सुनते ही कंस का मन भय से काँप उठा।","en":"In the midst of the joy, a voice thundered from the sky — \"Kansa! Devaki's eighth child will be your end.\" Hearing it, Kansa's heart shook with fear.","gu":"ઉત્સવની વચ્ચે અચાનક આકાશવાણી ગૂંજી — \"હે કંસ! દેવકીનું આઠમું સંતાન જ તારો અંત લાવશે.\" આ સાંભળતાં જ કંસનું મન ભયથી કાંપી ઊઠ્યું.","kn":"ಸಂಭ್ರಮದ ನಡುವೆ ಆಕಾಶವಾಣಿ ಮೊಳಗಿತು — \"ಕಂಸ! ದೇವಕಿಯ ಎಂಟನೇ ಮಗುವೇ ನಿನ್ನ ಅಂತ್ಯ ತರುವುದು.\" ಇದನ್ನು ಕೇಳಿ ಕಂಸನ ಮನಸ್ಸು ಭಯದಿಂದ ನಡುಗಿತು."}},{"id":"threat","art":"threat","source":"10.1.35–44","title":{"hi":"कंस का क्रोध","en":"Kansa's Rage","gu":"કંસનો ક્રોધ","kn":"ಕಂಸನ ಕೋಪ"},"text":{"hi":"भय से कंस क्रोधित हो उठा। उसने देवकी के केश पकड़ लिए और उन्हें मारने के लिए तलवार उठा ली। सब स्तब्ध रह गए।","en":"Fear turned Kansa to rage. He seized Devaki by the hair and raised his sword to harm her. Everyone froze in shock.","gu":"ભયથી કંસ ક્રોધે ભરાયો. તેણે દેવકીના વાળ પકડી લીધા અને તેમને મારવા તલવાર ઉગામી. બધા સ્તબ્ધ થઈ ગયા.","kn":"ಭಯದಿಂದ ಕಂಸ ಕೋಪಗೊಂಡ. ದೇವಕಿಯ ಕೂದಲು ಹಿಡಿದು ಅವಳಿಗೆ ಹಾನಿ ಮಾಡಲು ಕತ್ತಿ ಎತ್ತಿದ. ಎಲ್ಲರೂ ಗಾಬರಿಯಿಂದ ಸ್ತಬ್ಧರಾದರು."}},{"id":"promise","art":"sword","source":"10.1.45–55","title":{"hi":"वसुदेव का वचन","en":"Vasudeva's Promise","gu":"વસુદેવનું વચન","kn":"ವಸುದೇವನ ವಚನ"},"text":{"hi":"वसुदेव घबराए नहीं। शांत मन से उन्होंने कंस को समझाया — \"तुम्हें केवल आठवीं संतान से भय है। मैं वचन देता हूँ, देवकी का हर शिशु तुम्हें सौंप दूँगा।\" इस कठिन पर साहसी वचन से कंस शांत हुआ और उस रात देवकी के प्राण बच गए।","en":"Vasudeva did not panic. Calmly he reasoned with Kansa — \"You fear only the eighth child. I give you my word: I will bring you every baby Devaki bears.\" This hard but brave promise calmed Kansa, and that night Devaki's life was spared.","gu":"વસુદેવ ગભરાયા નહીં. શાંત મને તેમણે કંસને સમજાવ્યું — \"તને ફક્ત આઠમા સંતાનનો ભય છે. હું વચન આપું છું, દેવકીનું દરેક શિશુ તને સોંપી દઈશ.\" આ કઠિન પણ સાહસી વચનથી કંસ શાંત થયો અને તે રાતે દેવકીના પ્રાણ બચી ગયા.","kn":"ವಸುದೇವ ಗಾಬರಿಯಾಗಲಿಲ್ಲ. ಶಾಂತ ಮನಸ್ಸಿನಿಂದ ಕಂಸನಿಗೆ ತಿಳಿಹೇಳಿದ — \"ನಿನಗೆ ಎಂಟನೇ ಮಗುವಿನ ಭಯ ಮಾತ್ರ. ನಾನು ವಚನ ಕೊಡುತ್ತೇನೆ, ದೇವಕಿಯ ಪ್ರತಿ ಮಗುವನ್ನೂ ನಿನಗೆ ಒಪ್ಪಿಸುತ್ತೇನೆ.\" ಈ ಕಠಿಣ ಆದರೆ ಧೈರ್ಯದ ವಚನದಿಂದ ಕಂಸ ಶಾಂತನಾದ, ಆ ರಾತ್ರಿ ದೇವಕಿಯ ಪ್ರಾಣ ಉಳಿಯಿತು."}},{"id":"imprisoned","art":"imprisoned","source":"10.1.65–69","title":{"hi":"कारागार में बंदी","en":"Locked in Prison","gu":"કારાગારમાં કેદ","kn":"ಕಾರಾಗಾರದಲ್ಲಿ ಬಂಧನ"},"text":{"hi":"कुछ समय बाद दुष्ट सलाहकारों ने कंस का भय फिर भड़का दिया। उसने देवकी और वसुदेव को कारागार में डाल दिया और भारी बेड़ियों से जकड़ दिया।","en":"Some time later, wicked advisers stirred up Kansa's fear again. He threw Devaki and Vasudeva into prison and bound them in heavy chains.","gu":"થોડા સમય પછી દુષ્ટ સલાહકારોએ કંસનો ભય ફરી ભડકાવ્યો. તેણે દેવકી અને વસુદેવને કારાગારમાં નાખ્યાં અને ભારે સાંકળોથી જકડી દીધાં.","kn":"ಸ್ವಲ್ಪ ಸಮಯದ ನಂತರ ದುಷ್ಟ ಸಲಹೆಗಾರರು ಕಂಸನ ಭಯವನ್ನು ಮತ್ತೆ ಕೆರಳಿಸಿದರು. ಅವನು ದೇವಕಿ ಮತ್ತು ವಸುದೇವರನ್ನು ಕಾರಾಗಾರದಲ್ಲಿ ಹಾಕಿ ಭಾರವಾದ ಸಂಕೋಲೆಗಳಿಂದ ಬಂಧಿಸಿದ."}},{"id":"six-children","art":"prison","source":"10.1.56–64","title":{"hi":"छह शिशुओं का वियोग","en":"Six Babies Lost","gu":"છ શિશુઓનો વિયોગ","kn":"ಆರು ಶಿಶುಗಳ ಅಗಲಿಕೆ"},"text":{"hi":"वचन के अनुसार एक-एक कर छह शिशु कंस ले गया। देवकी और वसुदेव का हृदय टूट गया, फिर भी उन्होंने प्रभु पर विश्वास नहीं छोड़ा।","en":"True to the promise, one by one Kansa took away six babies. Devaki and Vasudeva's hearts broke, yet they never let go of their faith in the Lord.","gu":"વચન પ્રમાણે એક-એક કરીને છ શિશુ કંસ લઈ ગયો. દેવકી અને વસુદેવનું હૃદય તૂટી ગયું, છતાં તેમણે પ્રભુ પરનો વિશ્વાસ છોડ્યો નહીં.","kn":"ವಚನದಂತೆ ಒಂದೊಂದಾಗಿ ಆರು ಶಿಶುಗಳನ್ನು ಕಂಸ ಕೊಂಡೊಯ್ದ. ದೇವಕಿ ಮತ್ತು ವಸುದೇವರ ಹೃದಯ ಒಡೆಯಿತು, ಆದರೂ ಅವರು ಭಗವಂತನ ಮೇಲಿನ ನಂಬಿಕೆಯನ್ನು ಬಿಡಲಿಲ್ಲ."}},{"id":"balarama","art":"balarama","source":"10.2.6–13","title":{"hi":"सातवाँ शिशु — बलराम","en":"The Seventh Child — Balarama","gu":"સાતમું શિશુ — બલરામ","kn":"ಏಳನೇ ಶಿಶು — ಬಲರಾಮ"},"text":{"hi":"सातवें शिशु को योगमाया ने गोकुल में रोहिणी के गर्भ में पहुँचा दिया। वही आगे चलकर बलराम कहलाए। कंस को लगा कि संतान खो गई।","en":"The seventh child was carried by Yogamaya to Rohini's womb in Gokul. He later became known as Balarama. Kansa believed the child had been lost.","gu":"સાતમા શિશુને યોગમાયાએ ગોકુળમાં રોહિણીના ગર્ભમાં પહોંચાડ્યું. તે આગળ જતાં બલરામ કહેવાયા. કંસને લાગ્યું કે સંતાન ખોવાઈ ગયું.","kn":"ಏಳನೇ ಶಿಶುವನ್ನು ಯೋಗಮಾಯೆ ಗೋಕುಲದ ರೋಹಿಣಿಯ ಗರ್ಭಕ್ಕೆ ಸೇರಿಸಿದಳು. ಮುಂದೆ ಅವನೇ ಬಲರಾಮ ಎನಿಸಿಕೊಂಡ. ಮಗು ಕಳೆದುಹೋಯಿತೆಂದು ಕಂಸ ಭಾವಿಸಿದ."}},{"id":"midnight","art":"midnight","source":"10.3.1–8","title":{"hi":"पावन आधी रात","en":"The Sacred Midnight","gu":"પાવન મધરાત","kn":"ಪವಿತ್ರ ಮಧ್ಯರಾತ್ರಿ"},"text":{"hi":"फिर आई कृष्ण अष्टमी की आधी रात। हवा मंद थी, नदियाँ निर्मल और तारे चमक रहे थे। सारा संसार मानो शांत होकर प्रतीक्षा कर रहा था।","en":"Then came the midnight of Krishna Ashtami. The breeze was gentle, the rivers clear, the stars aglow. The whole world seemed to grow still, waiting.","gu":"પછી કૃષ્ણ અષ્ટમીની મધરાત આવી. પવન મંદ હતો, નદીઓ નિર્મળ અને તારા ચમકતા હતા. આખું જગત જાણે શાંત થઈને રાહ જોતું હતું.","kn":"ನಂತರ ಕೃಷ್ಣ ಅಷ್ಟಮಿಯ ಮಧ್ಯರಾತ್ರಿ ಬಂದಿತು. ಗಾಳಿ ಮೆಲ್ಲಗಿತ್ತು, ನದಿಗಳು ನಿರ್ಮಲವಾಗಿದ್ದವು, ನಕ್ಷತ್ರಗಳು ಹೊಳೆಯುತ್ತಿದ್ದವು. ಇಡೀ ಜಗತ್ತು ಶಾಂತವಾಗಿ ಕಾಯುತ್ತಿತ್ತು."}},{"id":"darshan","art":"vishnu","source":"10.3.9–13","title":{"hi":"प्रभु का दिव्य दर्शन","en":"The Lord's Divine Form","gu":"પ્રભુનાં દિવ્ય દર્શન","kn":"ಭಗವಂತನ ದಿವ್ಯ ದರ್ಶನ"},"text":{"hi":"उसी क्षण कारागार दिव्य प्रकाश से भर गया। भगवान विष्णु चार भुजाओं में शंख, चक्र, गदा और पद्म लिए प्रकट हुए। देवकी और वसुदेव विस्मय से देखते रह गए।","en":"In that moment the prison filled with divine light. Lord Vishnu appeared with four arms, holding conch, discus, mace and lotus. Devaki and Vasudeva gazed in wonder.","gu":"એ જ ક્ષણે કારાગાર દિવ્ય પ્રકાશથી ભરાઈ ગયું. ભગવાન વિષ્ણુ ચાર ભુજાઓમાં શંખ, ચક્ર, ગદા અને કમળ ધારણ કરી પ્રગટ થયા. દેવકી અને વસુદેવ વિસ્મયથી જોઈ રહ્યાં.","kn":"ಆ ಕ್ಷಣದಲ್ಲಿ ಕಾರಾಗಾರ ದಿವ್ಯ ಬೆಳಕಿನಿಂದ ತುಂಬಿತು. ಭಗವಾನ್ ವಿಷ್ಣು ನಾಲ್ಕು ಕೈಗಳಲ್ಲಿ ಶಂಖ, ಚಕ್ರ, ಗದೆ ಮತ್ತು ಕಮಲವನ್ನು ಹಿಡಿದು ಕಾಣಿಸಿಕೊಂಡ. ದೇವಕಿ ಮತ್ತು ವಸುದೇವ ವಿಸ್ಮಯದಿಂದ ನೋಡುತ್ತಿದ್ದರು."}},{"id":"prayer","art":"prayer","source":"10.3.14–46","title":{"hi":"प्रार्थना और आदेश","en":"A Prayer and a Guidance","gu":"પ્રાર્થના અને આદેશ","kn":"ಪ್ರಾರ್ಥನೆ ಮತ್ತು ಆದೇಶ"},"text":{"hi":"दोनों ने हाथ जोड़कर प्रभु को प्रणाम किया। प्रभु ने कोमल वाणी में कहा — \"मुझे गोकुल में नन्द-यशोदा के पास पहुँचा दो।\" फिर वे एक नन्हे शिशु बन गए।","en":"They folded their hands and bowed to the Lord. In a gentle voice he said — \"Carry me to Nanda and Yashoda in Gokul.\" Then he became a tiny baby.","gu":"બંનેએ હાથ જોડીને પ્રભુને પ્રણામ કર્યા. પ્રભુએ કોમળ વાણીમાં કહ્યું — \"મને ગોકુળમાં નંદ-યશોદા પાસે પહોંચાડો.\" પછી તેઓ નાનકડું શિશુ બની ગયા.","kn":"ಇಬ್ಬರೂ ಕೈಜೋಡಿಸಿ ಭಗವಂತನಿಗೆ ನಮಸ್ಕರಿಸಿದರು. ಭಗವಂತ ಮೃದು ಧ್ವನಿಯಲ್ಲಿ ಹೇಳಿದ — \"ನನ್ನನ್ನು ಗೋಕುಲದ ನಂದ-ಯಶೋದೆಯ ಬಳಿ ಸೇರಿಸಿ.\" ನಂತರ ಅವನು ಪುಟ್ಟ ಮಗುವಾದ."}},{"id":"escape","art":"escape","source":"10.3.47–48","title":{"hi":"द्वार खुल गए","en":"The Doors Open","gu":"દરવાજા ખૂલી ગયા","kn":"ಬಾಗಿಲುಗಳು ತೆರೆದವು"},"text":{"hi":"योगमाया के प्रभाव से बेड़ियाँ खुल गईं, पहरेदार गहरी नींद में सो गए और कारागार के द्वार अपने आप खुल गए। वसुदेव कृष्ण को गोद में लेकर बाहर निकले।","en":"By Yogamaya's power the chains fell away, the guards sank into deep sleep, and the prison doors opened on their own. Vasudeva lifted baby Krishna and stepped outside.","gu":"યોગમાયાના પ્રભાવથી સાંકળો ખૂલી ગઈ, પહેરેદારો ગાઢ નિદ્રામાં સૂઈ ગયા અને કારાગારના દરવાજા આપમેળે ખૂલી ગયા. વસુદેવ કૃષ્ણને ખોળામાં લઈને બહાર નીકળ્યા.","kn":"ಯೋಗಮಾಯೆಯ ಶಕ್ತಿಯಿಂದ ಸಂಕೋಲೆಗಳು ಕಳಚಿದವು, ಕಾವಲುಗಾರರು ಗಾಢ ನಿದ್ರೆಗೆ ಜಾರಿದರು, ಕಾರಾಗಾರದ ಬಾಗಿಲುಗಳು ತಾನಾಗಿ ತೆರೆದವು. ವಸುದೇವ ಕೃಷ್ಣನನ್ನು ಎತ್ತಿಕೊಂಡು ಹೊರಬಂದ."}},{"id":"yamuna-crossing","art":"yamuna","source":"10.3.49–50","title":{"hi":"यमुना के पार","en":"Across the Yamuna","gu":"યમુનાને પાર","kn":"ಯಮುನೆಯ ದಾಟುವಿಕೆ"},"text":{"hi":"बाहर मूसलाधार वर्षा हो रही थी। वसुदेव नन्हे कृष्ण को लेकर उफनती यमुना में उतरे। शेषनाग ने अपने फनों का छत्र तान दिया और यमुना ने मार्ग दे दिया।","en":"Outside, rain poured in torrents. Vasudeva waded into the surging Yamuna with baby Krishna. Shesha spread his hoods like an umbrella, and the river made a path.","gu":"બહાર મુશળધાર વરસાદ વરસતો હતો. વસુદેવ નાનકડા કૃષ્ણને લઈને ઊફણતી યમુનામાં ઊતર્યા. શેષનાગે પોતાની ફણાઓનું છત્ર ધર્યું અને યમુનાએ માર્ગ આપ્યો.","kn":"ಹೊರಗೆ ಧಾರಾಕಾರ ಮಳೆ ಸುರಿಯುತ್ತಿತ್ತು. ವಸುದೇವ ಪುಟ್ಟ ಕೃಷ್ಣನನ್ನು ಹೊತ್ತು ಉಕ್ಕುತ್ತಿದ್ದ ಯಮುನೆಗೆ ಇಳಿದ. ಶೇಷನಾಗ ತನ್ನ ಹೆಡೆಗಳ ಛತ್ರಿ ಹಿಡಿದ, ಯಮುನೆ ದಾರಿ ಮಾಡಿಕೊಟ್ಟಳು."}},{"id":"gokul","art":"gokul","source":"10.3.51","title":{"hi":"गोकुल पहुँचे","en":"Reaching Gokul","gu":"ગોકુળ પહોંચ્યા","kn":"ಗೋಕುಲ ತಲುಪಿದರು"},"text":{"hi":"गोकुल में नन्द के घर यशोदा गहरी नींद में थीं। उनके पास अभी-अभी एक नन्ही कन्या जन्मी थी। वसुदेव ने प्रेम से कृष्ण को यशोदा के पास सुला दिया।","en":"In Gokul, at Nanda's home, Yashoda lay in deep sleep. A baby girl had just been born to her. Lovingly, Vasudeva laid Krishna beside Yashoda.","gu":"ગોકુળમાં નંદના ઘરે યશોદા ગાઢ નિદ્રામાં હતાં. તેમની પાસે હમણાં જ એક નાનકડી દીકરી જન્મી હતી. વસુદેવે પ્રેમથી કૃષ્ણને યશોદા પાસે સુવડાવ્યા.","kn":"ಗೋಕುಲದಲ್ಲಿ ನಂದನ ಮನೆಯಲ್ಲಿ ಯಶೋದೆ ಗಾಢ ನಿದ್ರೆಯಲ್ಲಿದ್ದಳು. ಅವಳಿಗೆ ಆಗಷ್ಟೇ ಒಂದು ಹೆಣ್ಣುಮಗು ಹುಟ್ಟಿತ್ತು. ವಸುದೇವ ಪ್ರೀತಿಯಿಂದ ಕೃಷ್ಣನನ್ನು ಯಶೋದೆಯ ಬಳಿ ಮಲಗಿಸಿದ."}},{"id":"return","art":"return","source":"10.3.52–53","title":{"hi":"वापस कारागार","en":"Back to the Prison","gu":"કારાગારમાં પાછા","kn":"ಕಾರಾಗಾರಕ್ಕೆ ಮರಳಿ"},"text":{"hi":"वसुदेव यशोदा की नन्ही कन्या को गोद में लेकर लौट पड़े। फिर से यमुना पार कर वे कारागार पहुँचे। बेड़ियाँ और द्वार पहले जैसे बंद हो गए।","en":"Vasudeva took Yashoda's baby girl in his arms and turned back. Crossing the Yamuna once more, he reached the prison. The chains and doors closed again as before.","gu":"વસુદેવ યશોદાની નાનકડી દીકરીને ખોળામાં લઈને પાછા ફર્યા. ફરી યમુના પાર કરીને તેઓ કારાગાર પહોંચ્યા. સાંકળો અને દરવાજા પહેલાંની જેમ બંધ થઈ ગયાં.","kn":"ವಸುದೇವ ಯಶೋದೆಯ ಹೆಣ್ಣುಮಗುವನ್ನು ಎತ್ತಿಕೊಂಡು ಹಿಂತಿರುಗಿದ. ಮತ್ತೆ ಯಮುನೆ ದಾಟಿ ಕಾರಾಗಾರ ತಲುಪಿದ. ಸಂಕೋಲೆಗಳು ಮತ್ತು ಬಾಗಿಲುಗಳು ಮೊದಲಿನಂತೆ ಮುಚ್ಚಿಕೊಂಡವು."}},{"id":"devi","art":"devi","source":"10.4.5–13","title":{"hi":"देवी का संदेश","en":"The Devi's Message","gu":"દેવીનો સંદેશ","kn":"ದೇವಿಯ ಸಂದೇಶ"},"text":{"hi":"शिशु के रोने से कंस जाग गया और कन्या को पकड़ लिया। तभी वह उसके हाथों से छूटकर देवी के रूप में प्रकट हुईं और बोलीं — \"तुझे मिटाने वाला तो जन्म ले चुका है!\" इतना कहकर वे अदृश्य हो गईं।","en":"The baby's cry woke Kansa, and he grabbed the little girl. At once she slipped from his hands and rose as the Devi, declaring — \"The one who will end you is already born!\" Saying this, she vanished.","gu":"શિશુના રડવાથી કંસ જાગી ગયો અને દીકરીને પકડી લીધી. ત્યાં જ તે તેના હાથમાંથી છટકીને દેવીના રૂપમાં પ્રગટ થઈ અને બોલી — \"તને મિટાવનાર તો જન્મ લઈ ચૂક્યો છે!\" આટલું કહીને તે અદૃશ્ય થઈ ગઈ.","kn":"ಶಿಶುವಿನ ಅಳುವಿನಿಂದ ಕಂಸ ಎಚ್ಚರಗೊಂಡು ಹೆಣ್ಣುಮಗುವನ್ನು ಹಿಡಿದ. ಆ ಕ್ಷಣವೇ ಅವಳು ಅವನ ಕೈಗಳಿಂದ ತಪ್ಪಿಸಿಕೊಂಡು ದೇವಿಯ ರೂಪದಲ್ಲಿ ಕಾಣಿಸಿಕೊಂಡಳು — \"ನಿನ್ನನ್ನು ಕೊನೆಗಾಣಿಸುವವನು ಆಗಲೇ ಹುಟ್ಟಿದ್ದಾನೆ!\" ಎಂದು ಹೇಳಿ ಮಾಯವಾದಳು."}},{"id":"safe","art":"safe","source":"10.4.14","title":{"hi":"गोकुल में सुरक्षित","en":"Safe in Gokul","gu":"ગોકુળમાં સુરક્ષિત","kn":"ಗೋಕುಲದಲ್ಲಿ ಸುರಕ್ಷಿತ"},"text":{"hi":"दूर गोकुल में नन्हे कृष्ण माँ यशोदा की गोद में सुख से सो रहे थे। प्रेम और साहस ने उस कठिन रात को आशा में बदल दिया। जय श्रीकृष्ण!","en":"Far away in Gokul, baby Krishna slept happily in mother Yashoda's lap. Love and courage had turned that hard night into hope. Jai Shri Krishna!","gu":"દૂર ગોકુળમાં નાનકડા કૃષ્ણ મા યશોદાના ખોળામાં સુખેથી સૂઈ રહ્યા હતા. પ્રેમ અને સાહસે એ કઠિન રાતને આશામાં ફેરવી દીધી. જય શ્રીકૃષ્ણ!","kn":"ದೂರದ ಗೋಕುಲದಲ್ಲಿ ಪುಟ್ಟ ಕೃಷ್ಣ ತಾಯಿ ಯಶೋದೆಯ ಮಡಿಲಲ್ಲಿ ಸುಖವಾಗಿ ನಿದ್ರಿಸುತ್ತಿದ್ದ. ಪ್ರೀತಿ ಮತ್ತು ಧೈರ್ಯ ಆ ಕಠಿಣ ರಾತ್ರಿಯನ್ನು ಭರವಸೆಯಾಗಿ ಮಾರ್ಪಡಿಸಿದವು. ಜಯ ಶ್ರೀಕೃಷ್ಣ!"}}]};
      const artwork = {"cover":"assets/krishna-janma/kj-01.webp","chariot":"assets/krishna-janma/kj-02.webp","sword":"assets/krishna-janma/kj-03.webp","prison":"assets/krishna-janma/kj-04.webp","midnight":"assets/krishna-janma/kj-05.webp","vishnu":"assets/krishna-janma/kj-06.webp","escape":"assets/krishna-janma/kj-07.webp","yamuna":"assets/krishna-janma/kj-08.webp","gokul":"assets/krishna-janma/kj-09.webp","devi":"assets/krishna-janma/kj-10.webp","safe":"assets/krishna-janma/kj-11.webp","wedding":"assets/krishna-janma/kj-12.webp","threat":"assets/krishna-janma/kj-13.webp","imprisoned":"assets/krishna-janma/kj-14.webp","balarama":"assets/krishna-janma/kj-15.webp","prayer":"assets/krishna-janma/kj-16.webp","return":"assets/krishna-janma/kj-17.webp"};

        en: {library:'Stories for Kids',prev:'Back',next:'Next',done:'Story library',source:'Bhagavata',lesson:'What we learn',pages:'pages'},
        gu: {library:'બાળકોની ચિત્રવાર્તાઓ',prev:'પાછળ',next:'આગળ',done:'વાર્તા સંગ્રહ',source:'ભાગવત',lesson:'વાર્તાની શીખ',pages:'પાનાં'},
        kn: {library:'ಮಕ್ಕಳ ಚಿತ್ರಕಥೆಗಳು',prev:'ಹಿಂದೆ',next:'ಮುಂದೆ',done:'ಕಥಾ ಸಂಗ್ರಹ',source:'ಭಾಗವತ',lesson:'ಕಥೆಯ ಪಾಠ',pages:'ಪುಟಗಳು'}
      };
      let lang = 'hi', index = 0, view = 'reader';
      const query = selector => root.querySelector(selector);
      const text = value => value[lang] || value.en;
      const esc = value => value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
      const art = page => `<img src="${artwork[page.art]}" alt="${esc(text(page.title))}">`;
      function render() {
        const t = copy[lang];
        query('.story-app').lang = lang;
        query('[data-field="story-title"]').textContent = view === 'library' ? t.library : text(story.title);
        query('footer').hidden = view === 'library';
        query('[data-action="library"]').hidden = view === 'library';
        if(view === 'library') {
          query('[data-field="content"]').innerHTML = `<button type="button" class="library-card cursor-interaction" data-action="open"><img src="${artwork[story.coverArt]}" alt=""><h2>${esc(text(story.title))}</h2><p>${esc(text(story.description))}</p><div class="meta">${story.ageMin}+ · ${story.pages.length} ${t.pages}</div></button>`;
          query('[data-action="open"]').addEventListener('click',()=>{view='reader';index=0;render()});
          return;
        }
        const page = story.pages[index];
        query('[data-field="content"]').innerHTML = `<div class="art">${art(page)}</div><div class="caption"><h2>${esc(text(page.title))}</h2><p>${esc(text(page.text))}</p><div class="source">${t.source} · ${page.source}</div></div>` + (index===story.pages.length-1 ? `<div class="caption lesson"><h2>${t.lesson}</h2><p>${esc(text(story.takeaway))}</p><div class="source">${esc(text(story.sourceNote))}</div></div>`:'');
        query('[data-field="progress"]').textContent = `${index+1} / ${story.pages.length}`;
        query('[data-action="prev"]').textContent = t.prev;
        query('[data-action="prev"]').disabled = index===0;
        query('[data-action="next"]').textContent = index===story.pages.length-1 ? t.done : t.next;
      }
      query('select').addEventListener('change',event=>{lang=event.target.value;render()});
      query('[data-action="prev"]').addEventListener('click',()=>{index=Math.max(0,index-1);render()});
      query('[data-action="next"]').addEventListener('click',()=>{if(index===story.pages.length-1)view='library';else index++;render()});
      query('[data-action="library"]').addEventListener('click',()=>{view='library';render()});
      render();
    })();
  </script>
</div>
</body></html>
