<div id="vedansh-calligraphic-particles">
  <style>
    #vedansh-calligraphic-particles { width:100%; }
    #vedansh-calligraphic-particles .vp-stage { max-width:460px; margin:0 auto; background:#fff1d5; overflow:hidden; }
    #vedansh-calligraphic-particles canvas { display:block; width:100%; height:auto; aspect-ratio:12/13; }
    #vedansh-calligraphic-particles .vp-actions { display:flex; justify-content:center; padding-top:12px; }
  </style>
  <div class="vp-stage">
    <canvas width="720" height="780" role="img" aria-label="Copper and vermilion Vedansh icon, joined calligraphic English and Hindi names, and Your spiritual companion subtitle forming together from coloured particles.">वेदांश · vedansh · Your spiritual companion · आपका आध्यात्मिक साथी</canvas>
  </div>
  <div class="vp-actions"><button type="button" class="btn">Replay animation</button></div>
  <script>
  (() => {
    const root = document.getElementById('vedansh-calligraphic-particles');
    const canvas = root.querySelector('canvas');
    const ctx = canvas.getContext('2d', { alpha:false });
    const replay = root.querySelector('button');
    const width = 720, height = 780;
    const image = new Image();
    const points = [];
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    let frame = 0, startTime = 0, elapsed = 0, loaded = false;
    const clamp = x => Math.max(0, Math.min(1,x));
    const smooth = x => x*x*(3-2*x);
    const seed = i => { const x = Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); };

    function paint(ms) {
      elapsed = ms;
      ctx.globalAlpha=1; ctx.fillStyle='#fff1d5';ctx.fillRect(0,0,width,height);
      const finalMix=smooth(clamp((ms-2800)/550));
      if (finalMix<1) {
        for(let i=0;i<points.length;i++) {
          const p=points[i];
          const u=clamp((ms-240-p.delay)/2400);
          const ease=1-Math.pow(1-u,3);
          const angle=p.angle+(1-ease)*1.35;
          const drift=1-ease;
          const x=p.x*ease+(width/2+Math.cos(angle)*p.radius)*drift;
          const y=p.y*ease+(height*.47+Math.sin(angle)*p.radius*.72)*drift;
          const glint=Math.sin((ms*.002)+i*.17)*.1+.9;
          ctx.globalAlpha=(1-finalMix)*smooth(clamp(ms/360))*(.56+.44*ease)*glint;
          ctx.fillStyle=p.color;
          const size=1.6+1.05*ease;
          ctx.fillRect(x-size/2,y-size/2,size,size);
        }
      }
      if(finalMix>0){ctx.globalAlpha=finalMix;ctx.drawImage(image,0,0,width,height);}
      ctx.globalAlpha=1;
    }
    function tick(now){
      paint(now-startTime);
      if(now-startTime<3350)frame=requestAnimationFrame(tick);
      else {paint(3350);frame=0;}
    }
    function play(){
      if(!loaded)return;
      cancelAnimationFrame(frame);
      if(reduced.matches){paint(3350);return;}
      startTime=performance.now();frame=requestAnimationFrame(tick);
    }
    image.onload=()=>{
      const off=document.createElement('canvas');off.width=width;off.height=height;
      const source=off.getContext('2d');source.drawImage(image,0,0);
      const rgba=source.getImageData(0,0,width,height).data;
      for(let y=0;y<height;y+=3)for(let x=0;x<width;x+=3){
        const index=(y*width+x)*4;
        const r=rgba[index],g=rgba[index+1],b=rgba[index+2],a=rgba[index+3];
        if(a<100 || (r>210 && g>185 && b>130))continue;
        const i=points.length, random=seed(i+1);
        points.push({x,y,color:'rgb('+r+','+g+','+b+')',angle:random*Math.PI*2,
          radius:220+seed(i+19)*260,delay:seed(i+51)*460});
      }
      loaded=true; root.dataset.ready='true';root.dataset.particles=String(points.length);
      paint(3350);play();
    };
    image.onerror=()=>{root.dataset.error='image-load';};
