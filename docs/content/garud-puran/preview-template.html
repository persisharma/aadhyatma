<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedansh · Garud Puran preview</title>
<style>
:root{color-scheme:light;--ink:#382a20;--copper:#9b512b;--paper:#faf2df;--line:#dfcba9}*{box-sizing:border-box}body{margin:0;background:#eee2ca;color:var(--ink);font:17px/1.8 Georgia,'Noto Serif Devanagari',serif}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:22px;padding:8px 18px}button:hover,button[aria-pressed=true]{background:var(--copper);color:white}header{padding:20px 5%;display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}header strong{font-size:24px}small,.eyebrow{font:12px/1.6 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}main{max-width:1200px;margin:32px auto;padding:0 24px}.intro{max-width:800px;margin:0 auto 32px;text-align:center}.intro h1{font-size:38px;font-weight:400;line-height:1.3;margin:10px 0}.intro p{margin:10px 0;color:#695241}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid var(--line);background:var(--paper);border-radius:18px;overflow:hidden;padding:0;text-align:left;transition:transform .15s}.card:hover{transform:translateY(-3px);background:var(--paper);color:var(--ink)}.card img{width:100%;aspect-ratio:2;height:auto;object-fit:contain;display:block}.card .copy{padding:18px}.card h2{font-size:21px;line-height:1.5;margin:4px 0;font-weight:400}.card p{font-size:14px;margin:4px 0;color:#725e4b}.reader{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;max-width:960px;margin:auto}.reader-top{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.reading{display:flex;flex-direction:column;gap:16px;padding:28px;max-width:640px;margin:auto}.reading img{width:100%;max-width:360px;aspect-ratio:2;object-fit:contain;align-self:center}.reading h2{font-size:28px;line-height:1.5;font-weight:400;margin:6px 0 20px}.reading p{margin:0 0 20px}.reading .text{min-width:0}.page-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-top:1px solid var(--line)}details{border-top:1px solid var(--line);padding:20px 28px;font-size:14px}summary{cursor:pointer;color:var(--copper)}a{color:var(--copper)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.gallery figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.gallery img{display:block;width:100%}.gallery figcaption{padding:12px 18px}.gallery small{display:block;letter-spacing:0;text-transform:none}footer{max-width:850px;margin:28px auto;text-align:center;font-size:13px;color:#77614e}button:disabled{opacity:.35;cursor:default}.hidden{display:none!important}@media(max-width:800px){.grid,.gallery{grid-template-columns:repeat(2,1fr)}.reading{grid-template-columns:1fr}.reading img{height:auto;object-fit:contain}.intro h1{font-size:30px}}@media(max-width:480px){main{padding:0 14px}.grid,.gallery{grid-template-columns:1fr}.card{display:grid;grid-template-columns:100px 1fr}.card img{height:auto;min-height:0;align-self:center}.card h2{font-size:18px}.reading{padding:22px}.reader-top{padding:14px}.page-nav{padding:14px}.intro{font-size:15px}}
</style></head><body>
<header><div><small>VEDANSH · CONTENT & ART PREVIEW</small><br><strong id="brand"></strong></div><nav><button id="home">12 readings</button> <button id="art">Artwork</button> <button id="hi" aria-pressed="true">हिन्दी</button> <button id="en" aria-pressed="false">English</button></nav></header>
<main><section id="intro" class="intro"></section><section id="cards" class="grid"></section><section id="reader" class="reader hidden"></section><section id="gallery" class="gallery hidden"></section></main>
<footer id="footer"></footer>
<script>
const readings=__READINGS_JSON__;
let lang='hi', selected=null,page=0,mode='home';
const $=id=>document.getElementById(id), pick=(hi,en)=>lang==='hi'?hi:en;
const asset=id=>'../../../mobile/assets/garud-puran/'+id+'.webp';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function illustration(id){const img=el('img');img.src=asset(id);img.alt=pick('प्रसंग का सांकेतिक चित्र','Interpretive illustration: '+id);return img}
function render(){
document.documentElement.lang=lang;$('hi').setAttribute('aria-pressed',lang==='hi');$('en').setAttribute('aria-pressed',lang==='en');$('brand').textContent=pick('गरुड़ पुराण','Garud Puran');$('home').textContent=pick('12 पाठ','12 readings');$('art').textContent=pick('चित्र संग्रह','Artwork');
$('footer').textContent=pick('यह विषय और चित्रों का पूर्वावलोकन है। ऐप के वास्तविक स्क्रीनशॉट अलग उपलब्ध हैं। चित्र सांकेतिक हैं।','Content and artwork preview. Actual app screenshots are supplied separately. Illustrations are interpretive.');
for(const id of ['intro','cards','reader','gallery'])$(id).classList.add('hidden');
if(mode==='home'){
$('intro').classList.remove('hidden');$('cards').classList.remove('hidden');$('intro').replaceChildren(el('div',pick('चयनित कथाएँ • जीवन की सीख','SELECTED STORIES • TEACHINGS FOR LIFE'),'eyebrow'),el('h1',pick('थोड़ा पढ़ें, अर्थ समझें','Read a little. Reflect on its meaning.')),el('p',pick('12 सरल पाठ · 28 छोटे पृष्ठ · हिन्दी और English। यह सम्पूर्ण पुराण या शब्दशः अनुवाद नहीं है।','12 readings · 28 short pages · Hindi and English. A selected editorial collection, not the complete Purana or a literal translation.')));
$('cards').replaceChildren();for(const r of readings){const card=el('button',undefined,'card');card.append(illustration(r.artId));const copy=el('div',undefined,'copy');copy.append(el('small',pick('पाठ ','READING ')+r.chapter),el('h2',r[lang==='hi'?'titleHi':'titleEn']),el('p',r.verses.length+pick(' पृष्ठ · स्रोत सहित',' pages · sources included')));card.append(copy);card.onclick=()=>{selected=r;page=0;mode='reader';render();window.scrollTo(0,0)};$('cards').append(card)}}
if(mode==='reader'){
const r=selected,v=r.verses[page],root=$('reader');root.classList.remove('hidden');root.replaceChildren();const top=el('div',undefined,'reader-top'),back=el('button',pick('‹ सभी पाठ','‹ All readings'));back.onclick=()=>{mode='home';render()};top.append(back,el('span',r[lang==='hi'?'titleHi':'titleEn']));root.append(top);const body=el('div',undefined,'reading');if(page===0)body.append(illustration(v.artId));const text=el('div',undefined,'text');text.append(el('small',pick('चयनित प्रसंग · सरल व्याख्या','SELECTED READING · EDITORIAL')),el('h2',v[lang==='hi'?'titleHi':'titleEn']));for(const p of v[lang==='hi'?'bodyHi':'bodyEn'])text.append(el('p',p));body.append(text);root.append(body);const nav=el('div',undefined,'page-nav'),prev=el('button',pick('‹ पिछला','‹ Previous')),next=el('button',pick('अगला ›','Next ›'));prev.disabled=page===0;next.disabled=page===r.verses.length-1;prev.onclick=()=>{page--;render();window.scrollTo(0,0)};next.onclick=()=>{page++;render();window.scrollTo(0,0)};nav.append(prev,el('span',(page+1)+' / '+r.verses.length),next);root.append(nav);const d=el('details');d.append(el('summary',pick('स्रोत और पाठ का परिचय','Sources and reading context')),el('p',r.source[lang==='hi'?'citeHi':'citeEn']),el('p',pick('संस्कृत और गीताप्रेस के संक्षिप्त हिन्दी पाठ से तुलना की गई सरल व्याख्या। आज के जीवन के उदाहरण सम्पादकीय विचार हैं।','An editorial explanation compared with Sanskrit and the Gita Press Hindi abridgement. Present-day examples are editorial reflections.')),el('p',r.source.sanskritReferences.join(', ')));r.source.referenceUrls.slice(0,2).forEach((url,i)=>{const a=el('a',i===0?pick('संस्कृत स्रोत','Sanskrit source'):pick('हिन्दी स्रोत','Hindi source'));a.href=url;a.target='_blank';a.rel='noopener';d.append(a,el('span',' · '))});root.append(d)}
if(mode==='art'){$('gallery').classList.remove('hidden');$('gallery').replaceChildren();for(const id of [...new Set(readings.map(r=>r.artId))]){const figure=el('figure');figure.append(illustration(id));const cap=el('figcaption',id);cap.append(el('small',readings.filter(r=>r.artId===id).map(r=>pick('पाठ ','Reading ')+r.chapter).join(' · ')));figure.append(cap);$('gallery').append(figure)}}}
$('home').onclick=()=>{mode='home';render()};$('art').onclick=()=>{mode='art';render()};$('hi').onclick=()=>{lang='hi';render()};$('en').onclick=()=>{lang='en';render()};render();
</script></body></html>
