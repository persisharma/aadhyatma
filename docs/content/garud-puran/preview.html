<script>
const readings=[{"chapter": 1, "id": "karma", "titleHi": "कर्म और उसके फल", "titleEn": "Karma and its consequences", "kind": "teaching", "artId": "cover", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/596", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/597", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/598"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.46.1", "2.46.2", "2.46.3", "2.46.4", "2.46.5", "2.46.6", "2.46.7", "2.46.8", "2.46.9"], "sanskritFileSha256": "d26999a1380c40d48073e39d81931ccf3f3107eccfdc7d34fa48b8501ae59f8d", "hindiSourcePages": [596, 597, 598], "hindiFragmentSha256": "a566ee1505ab75fa706926a6d71b8f0332a819ab0f1059f9a583e60d95bef748", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Limited to truthfulness, forgiveness, conduct and accountability. Omits the chapter’s later disease, bodily-mark and birth-status claims; this is explicitly a selection. Present-day reflection is editorial, not a verse translation.", "citeHi": "गरुडपुराण · प्रेतकल्प 46 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 46 · selected passages"}, "verses": [{"id": "karma-1", "chapter": 1, "number": 1, "titleHi": "कर्म का प्रश्न", "titleEn": "The question of conduct", "bodyHi": ["गरुड़ भगवान से पूछते हैं कि अच्छे और बुरे कर्मों का फल कैसे मिलता है। इस संवाद में सत्य, धर्म और क्षमा को महत्त्व दिया गया है। मनुष्य का आचरण केवल उसी क्षण समाप्त नहीं हो जाता; पुराण उसे आगे की गति से भी जोड़ता है।", "इस प्रसंग में यम उस उत्तरदायित्व को सामने लाते हैं जिसे संसार की नज़र से छिपाया जा सकता है, पर अपने कर्म से मिटाया नहीं जा सकता। यह पुराण की धार्मिक दृष्टि है। यहाँ हमने उसके सत्य और आचरण से जुड़े अंश चुने हैं।"], "bodyEn": ["Garuda asks how good and harmful actions bear fruit. The passage honours truthfulness, right conduct and forgiveness. In the Purana’s religious account, an action does not end with the moment in which it is done; it also shapes the person’s onward journey.", "Yama represents accountability for conduct that may escape the notice of other people. The reading here selects the passage’s emphasis on truth and responsibility. It presents the Purana’s teaching, rather than a claim that every event in someone’s life has an identifiable moral cause."], "meaningHi": "गरुड़ भगवान से पूछते हैं कि अच्छे और बुरे कर्मों का फल कैसे मिलता है। इस संवाद में सत्य, धर्म और क्षमा को महत्त्व दिया गया है। मनुष्य का आचरण केवल उसी क्षण समाप्त नहीं हो जाता; पुराण उसे आगे की गति से भी जोड़ता है।\n\nइस प्रसंग में यम उस उत्तरदायित्व को सामने लाते हैं जिसे संसार की नज़र से छिपाया जा सकता है, पर अपने कर्म से मिटाया नहीं जा सकता। यह पुराण की धार्मिक दृष्टि है। यहाँ हमने उसके सत्य और आचरण से जुड़े अंश चुने हैं।", "meaningEn": "Garuda asks how good and harmful actions bear fruit. The passage honours truthfulness, right conduct and forgiveness. In the Purana’s religious account, an action does not end with the moment in which it is done; it also shapes the person’s onward journey.\n\nYama represents accountability for conduct that may escape the notice of other people. The reading here selects the passage’s emphasis on truth and responsibility. It presents the Purana’s teaching, rather than a claim that every event in someone’s life has an identifiable moral cause.", "artId": "cover"}, {"id": "karma-2", "chapter": 1, "number": 2, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["इस शिक्षा को अपने व्यवहार की ओर मोड़कर पढ़ें। क्रोध आने पर रुकना, अपनी गलती स्वीकार करना और किसी के साथ किया अन्याय सुधारना—ये इसके आज के जीवन में उपयोग के उदाहरण हैं। ये उदाहरण हमारी संपादकीय व्याख्या हैं।", "किसी दूसरे के रोग, गरीबी या दुःख को देखकर उसके कर्मों का फैसला करना इस चयन का उद्देश्य नहीं है। इसके स्थान पर प्रश्न है: मेरे आज के शब्द और काम क्या किसी का भरोसा बढ़ा रहे हैं, या उसे चोट पहुँचा रहे हैं?"], "bodyEn": ["A useful way to reflect on this teaching is to examine our own behaviour. Pausing before speaking in anger, acknowledging a mistake and repairing an injury are present-day applications. These examples are editorial reflections, not quotations from the text.", "This selection is not a basis for judging a person’s illness, poverty or suffering as deserved. Its practical question is closer to home: do my words and actions build trust, or do they cause harm? Responsibility begins with the choices that are actually mine."], "meaningHi": "इस शिक्षा को अपने व्यवहार की ओर मोड़कर पढ़ें। क्रोध आने पर रुकना, अपनी गलती स्वीकार करना और किसी के साथ किया अन्याय सुधारना—ये इसके आज के जीवन में उपयोग के उदाहरण हैं। ये उदाहरण हमारी संपादकीय व्याख्या हैं।\n\nकिसी दूसरे के रोग, गरीबी या दुःख को देखकर उसके कर्मों का फैसला करना इस चयन का उद्देश्य नहीं है। इसके स्थान पर प्रश्न है: मेरे आज के शब्द और काम क्या किसी का भरोसा बढ़ा रहे हैं, या उसे चोट पहुँचा रहे हैं?", "meaningEn": "A useful way to reflect on this teaching is to examine our own behaviour. Pausing before speaking in anger, acknowledging a mistake and repairing an injury are present-day applications. These examples are editorial reflections, not quotations from the text.\n\nThis selection is not a basis for judging a person’s illness, poverty or suffering as deserved. Its practical question is closer to home: do my words and actions build trust, or do they cause harm? Responsibility begins with the choices that are actually mine.", "artId": "cover"}]}, {"chapter": 2, "id": "daan", "titleHi": "दान का महत्त्व", "titleEn": "The importance of giving", "kind": "teaching", "artId": "daan", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/180", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/181"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["1.98.2", "1.98.3", "1.98.4", "1.98.11", "1.98.12", "1.98.13", "1.98.14"], "sanskritFileSha256": "b781d4f2a5b7c4d140bc04c25eb16c42fb622d5365eda93421beb994391ac7f3", "hindiSourcePages": [180, 181], "hindiFragmentSha256": "fd9c5d1bdf9e83819ba90446c9f0eb761b112140ff50a45de6e6f4ec417aa0b5", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Selected giving passages only. The historical text has recipient hierarchies and ritual rewards; this reading does not present those as a modern ranking of human worth or promise a reward. Examples of everyday service are labelled editorial.", "citeHi": "गरुडपुराण · आचारकाण्ड 98 · चयनित प्रसंग", "citeEn": "Garuda Purana · Achara chapter 98 · selected passages"}, "verses": [{"id": "daan-1", "chapter": 2, "number": 1, "titleHi": "सामर्थ्य के अनुसार देना", "titleEn": "Giving within our means", "bodyHi": ["आचारकाण्ड का यह अंश श्रद्धा और अपनी शक्ति के अनुसार दान की बात करता है। इसमें अन्न, वस्त्र, जल और अन्य उपयोगी वस्तुओं का उल्लेख है। दान को केवल बड़ी सम्पत्ति देने तक सीमित नहीं रखा गया है।", "इसी प्रसंग में थके हुए की सहायता और रोगी की सेवा का भी सम्मान किया गया है। इस तरह किसी की आवश्यकता पर ध्यान देना महत्त्वपूर्ण बनता है। वस्तु के साथ उसे देने वाले का भाव और जिस काम में वह सहायक हो, वे भी विचार के विषय हैं।"], "bodyEn": ["This Achara passage speaks of giving with sincerity and according to one’s means. It names food, clothing, water and other useful things. Its account of generosity reaches beyond the gift of a large amount of property.", "The passage also honours attending to a tired person and caring for someone who is ill. Attention to another person’s need therefore matters alongside the material gift. Giving can involve resources, but it can also involve personal effort and service."], "meaningHi": "आचारकाण्ड का यह अंश श्रद्धा और अपनी शक्ति के अनुसार दान की बात करता है। इसमें अन्न, वस्त्र, जल और अन्य उपयोगी वस्तुओं का उल्लेख है। दान को केवल बड़ी सम्पत्ति देने तक सीमित नहीं रखा गया है।\n\nइसी प्रसंग में थके हुए की सहायता और रोगी की सेवा का भी सम्मान किया गया है। इस तरह किसी की आवश्यकता पर ध्यान देना महत्त्वपूर्ण बनता है। वस्तु के साथ उसे देने वाले का भाव और जिस काम में वह सहायक हो, वे भी विचार के विषय हैं।", "meaningEn": "This Achara passage speaks of giving with sincerity and according to one’s means. It names food, clothing, water and other useful things. Its account of generosity reaches beyond the gift of a large amount of property.\n\nThe passage also honours attending to a tired person and caring for someone who is ill. Attention to another person’s need therefore matters alongside the material gift. Giving can involve resources, but it can also involve personal effort and service.", "artId": "daan"}, {"id": "daan-2", "chapter": 2, "number": 2, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["सरल रूप में, दान अपनी क्षमता पहचानकर किसी की सहायता में उसका उपयोग करना है। किसी की देखभाल के लिए समय देना या जरूरत का भोजन पहुँचाना इस शिक्षा से जुड़ने के आज के उदाहरण हो सकते हैं।", "यहाँ दान किसी निश्चित फल को खरीदने का सौदा नहीं है। अपनी सीमाओं का सम्मान करते हुए, सामने वाले की गरिमा बनाए रखते हुए सहायता करना हमारी संपादकीय सीख है। छोटी सहायता भी ध्यान और ईमानदारी से दी जा सकती है।"], "bodyEn": ["In simple terms, generosity begins by noticing what we can responsibly offer and where it can help. Giving time to someone who needs care or arranging a useful meal are examples of how a reader might apply this teaching today.", "This reading does not offer a transaction in which a donation buys a guaranteed spiritual result. Our editorial takeaway is to help within our limits and preserve the dignity of the person receiving help. Thoughtfulness matters even when the gift is small."], "meaningHi": "सरल रूप में, दान अपनी क्षमता पहचानकर किसी की सहायता में उसका उपयोग करना है। किसी की देखभाल के लिए समय देना या जरूरत का भोजन पहुँचाना इस शिक्षा से जुड़ने के आज के उदाहरण हो सकते हैं।\n\nयहाँ दान किसी निश्चित फल को खरीदने का सौदा नहीं है। अपनी सीमाओं का सम्मान करते हुए, सामने वाले की गरिमा बनाए रखते हुए सहायता करना हमारी संपादकीय सीख है। छोटी सहायता भी ध्यान और ईमानदारी से दी जा सकती है।", "meaningEn": "In simple terms, generosity begins by noticing what we can responsibly offer and where it can help. Giving time to someone who needs care or arranging a useful meal are examples of how a reader might apply this teaching today.\n\nThis reading does not offer a transaction in which a donation buys a guaranteed spiritual result. Our editorial takeaway is to help within our limits and preserve the dignity of the person receiving help. Thoughtfulness matters even when the gift is small.", "artId": "daan"}]}, {"chapter": 3, "id": "human-life", "titleHi": "मनुष्य जीवन का महत्त्व", "titleEn": "The value of human life", "kind": "teaching", "artId": "cover", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/517", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/518", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/519"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.12.4", "2.12.8", "2.12.9", "2.12.12", "2.12.13", "2.12.14", "2.12.15", "2.12.16"], "sanskritFileSha256": "e57ea90780f158de234f52154cbd7b7dd2450888e08128ab4b0326257940f04a", "hindiSourcePages": [517, 518, 519], "hindiFragmentSha256": "545a5bae71ef4d8892265f83f25f75bee4a1a00f69315ff9c8b9981d8328db39", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Selected passages on discernment and craving. Omits historical caste hierarchy and numerical classifications of beings rather than restating them as contemporary fact.", "citeHi": "गरुडपुराण · प्रेतकल्प 12 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 12 · selected passages"}, "verses": [{"id": "human-life-1", "chapter": 3, "number": 1, "titleHi": "विवेक का अवसर", "titleEn": "An opportunity for discernment", "bodyHi": ["प्रेतकल्प में मनुष्य-जन्म को दुर्लभ अवसर कहा गया है। भोजन, नींद और भय जैसी वृत्तियाँ अनेक प्राणियों में होती हैं; मनुष्य के सामने विवेक से अपने जीवन की दिशा चुनने का प्रश्न भी आता है।", "यह प्रसंग तृष्णा की बढ़ती चाल को समझाता है। जिसके पास थोड़ा है, वह अधिक चाहता है; अधिक मिलने पर भी इच्छा समाप्त नहीं होती। इसलिए केवल वस्तुएँ जोड़ते जाना संतोष का भरोसेमंद आधार नहीं बनता।"], "bodyEn": ["The Preta section describes human birth as a rare opportunity. Many living beings share needs such as food, sleep and safety. The passage asks what we do with the capacity to reflect on our conduct and choose a direction for our lives.", "It illustrates the way craving can keep growing. A person with a little wants more, and gaining more does not necessarily bring the wanting to an end. Accumulation alone therefore fails to settle the deeper question of what makes a life worthwhile."], "meaningHi": "प्रेतकल्प में मनुष्य-जन्म को दुर्लभ अवसर कहा गया है। भोजन, नींद और भय जैसी वृत्तियाँ अनेक प्राणियों में होती हैं; मनुष्य के सामने विवेक से अपने जीवन की दिशा चुनने का प्रश्न भी आता है।\n\nयह प्रसंग तृष्णा की बढ़ती चाल को समझाता है। जिसके पास थोड़ा है, वह अधिक चाहता है; अधिक मिलने पर भी इच्छा समाप्त नहीं होती। इसलिए केवल वस्तुएँ जोड़ते जाना संतोष का भरोसेमंद आधार नहीं बनता।", "meaningEn": "The Preta section describes human birth as a rare opportunity. Many living beings share needs such as food, sleep and safety. The passage asks what we do with the capacity to reflect on our conduct and choose a direction for our lives.\n\nIt illustrates the way craving can keep growing. A person with a little wants more, and gaining more does not necessarily bring the wanting to an end. Accumulation alone therefore fails to settle the deeper question of what makes a life worthwhile.", "artId": "cover"}, {"id": "human-life-2", "chapter": 3, "number": 2, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["इस शिक्षा का सरल प्रश्न है: उपलब्ध जीवन और विवेक का उपयोग किस काम में हो रहा है? इच्छा होना और हर इच्छा के पीछे बिना सोचे भागना अलग बातें हैं। रुककर आवश्यकता और लालसा को पहचानना एक उपयोगी अभ्यास हो सकता है।", "सीखने, सेवा करने और अपने व्यवहार को सुधारने का अवसर केवल भविष्य के लिए टालना जरूरी नहीं है। आज की कोई छोटी सजग पसंद भी शुरुआत हो सकती है। यह दैनिक जीवन के लिए हमारी व्याख्या है, जीवन की कठिनाइयों को नकारना नहीं।"], "bodyEn": ["The simple question is how we are using the life and judgment available to us. Having a desire is different from pursuing every desire without reflection. Pausing to distinguish a genuine need from an expanding appetite can be a useful practice.", "Learning, serving and correcting our behaviour need not be postponed until some perfect future. A small deliberate choice today can be a beginning. This is an editorial application of the passage, not a denial of the practical difficulties people face."], "meaningHi": "इस शिक्षा का सरल प्रश्न है: उपलब्ध जीवन और विवेक का उपयोग किस काम में हो रहा है? इच्छा होना और हर इच्छा के पीछे बिना सोचे भागना अलग बातें हैं। रुककर आवश्यकता और लालसा को पहचानना एक उपयोगी अभ्यास हो सकता है।\n\nसीखने, सेवा करने और अपने व्यवहार को सुधारने का अवसर केवल भविष्य के लिए टालना जरूरी नहीं है। आज की कोई छोटी सजग पसंद भी शुरुआत हो सकती है। यह दैनिक जीवन के लिए हमारी व्याख्या है, जीवन की कठिनाइयों को नकारना नहीं।", "meaningEn": "The simple question is how we are using the life and judgment available to us. Having a desire is different from pursuing every desire without reflection. Pausing to distinguish a genuine need from an expanding appetite can be a useful practice.\n\nLearning, serving and correcting our behaviour need not be postponed until some perfect future. A small deliberate choice today can be a beginning. This is an editorial application of the passage, not a denial of the practical difficulties people face.", "artId": "cover"}]}, {"chapter": 4, "id": "liberation", "titleHi": "विवेक, सत्संग और मोक्ष", "titleEn": "Discernment, good company and liberation", "kind": "teaching", "artId": "cover", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/604", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/605", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/606", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/607", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/608", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/609", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/610", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/611", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/612", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/613"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.49.1", "2.49.2", "2.49.3", "2.49.4", "2.49.5", "2.49.6", "2.49.7", "2.49.8", "2.49.25", "2.49.26", "2.49.27", "2.49.28", "2.49.29", "2.49.55", "2.49.56", "2.49.57", "2.49.58", "2.49.59", "2.49.82", "2.49.83", "2.49.84", "2.49.85", "2.49.93", "2.49.94", "2.49.95", "2.49.96", "2.49.97", "2.49.98", "2.49.99", "2.49.100", "2.49.101"], "sanskritFileSha256": "7921ec3f62615741250c17147798d367d6b44707161107a44c388affea12f3fc", "hindiSourcePages": [604, 605, 606, 607, 608, 609, 610, 611, 612, 613], "hindiFragmentSha256": "8c029f113f0dbfdb6de5768f833e8afe56ba894c17ec685716d7396aa430add0", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Selected liberation teaching, not the entire chapter or a complete account of any school of Vedanta. Satsanga, discernment, knowledge and reduced possessiveness are present in the cited passages.", "citeHi": "गरुडपुराण · प्रेतकल्प 49 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 49 · selected passages"}, "verses": [{"id": "liberation-1", "chapter": 4, "number": 1, "titleHi": "गरुड़ का अंतिम प्रश्न", "titleEn": "Garuda asks about freedom", "bodyHi": ["गरुड़ पूछते हैं कि जन्म-मरण और दुःख के चक्र से मुक्ति का उपाय क्या है। उत्तर में जीवन की अनित्यता, आत्मतत्त्व को समझने और मोह से ऊपर उठने की बात आती है। सत्संग और विवेक को सही दिशा देखने में सहायक बताया गया है।", "यह अंश केवल बहुत-सी पुस्तकें पढ़ लेने को पर्याप्त नहीं मानता। समझ के बिना पढ़ना अधूरा रहता है। अनेक शास्त्र और सीमित आयु होने के कारण उनके सार को पहचानने पर बल दिया गया है। ज्ञान का उद्देश्य जीवन को बदलने वाली समझ है।"], "bodyEn": ["Garuda asks how living beings can find release from the cycle of birth, death and suffering. The reply turns to impermanence, understanding the self and loosening attachment. Good company and discernment are presented as aids to seeing clearly.", "The passage does not treat the accumulation of reading as sufficient in itself. Study without understanding remains incomplete. Since texts are many and life is limited, it urges the reader to discern their essence. Knowledge matters as an understanding that changes the way one lives."], "meaningHi": "गरुड़ पूछते हैं कि जन्म-मरण और दुःख के चक्र से मुक्ति का उपाय क्या है। उत्तर में जीवन की अनित्यता, आत्मतत्त्व को समझने और मोह से ऊपर उठने की बात आती है। सत्संग और विवेक को सही दिशा देखने में सहायक बताया गया है।\n\nयह अंश केवल बहुत-सी पुस्तकें पढ़ लेने को पर्याप्त नहीं मानता। समझ के बिना पढ़ना अधूरा रहता है। अनेक शास्त्र और सीमित आयु होने के कारण उनके सार को पहचानने पर बल दिया गया है। ज्ञान का उद्देश्य जीवन को बदलने वाली समझ है।", "meaningEn": "Garuda asks how living beings can find release from the cycle of birth, death and suffering. The reply turns to impermanence, understanding the self and loosening attachment. Good company and discernment are presented as aids to seeing clearly.\n\nThe passage does not treat the accumulation of reading as sufficient in itself. Study without understanding remains incomplete. Since texts are many and life is limited, it urges the reader to discern their essence. Knowledge matters as an understanding that changes the way one lives.", "artId": "cover"}, {"id": "liberation-2", "chapter": 4, "number": 2, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["मोह छोड़ने का आशय इस चयन में जिम्मेदारियाँ छोड़ देना नहीं है। अपने विचार में “सब कुछ मेरा ही है” की पकड़ को पहचानना और उसे ढीला करना एक उपयोगी अर्थ है। मूल प्रसंग ममता और मुक्ति के सम्बन्ध पर विचार करता है।", "ऐसा साथ चुनना जो प्रश्न पूछने, सीखने और ईमानदारी से जीने में मदद करे, इस शिक्षा का दैनिक उपयोग हो सकता है। शांत होकर पढ़ना, समझना और अपने व्यवहार पर लौटना—यह हमारी संपादकीय दिशा है; कोई तत्काल मोक्ष का वादा नहीं।"], "bodyEn": ["For this reading, loosening attachment is not an invitation to abandon responsibilities. A useful reflection is to notice the grip of “everything must be mine” and examine it. The source itself connects possessiveness with bondage and knowledge with freedom.", "Choosing company that supports learning, honest questions and thoughtful conduct is one way to apply the teaching. Reading quietly, understanding what is read and returning to one’s own behaviour form our editorial suggestion. This is not a promise of instant liberation."], "meaningHi": "मोह छोड़ने का आशय इस चयन में जिम्मेदारियाँ छोड़ देना नहीं है। अपने विचार में “सब कुछ मेरा ही है” की पकड़ को पहचानना और उसे ढीला करना एक उपयोगी अर्थ है। मूल प्रसंग ममता और मुक्ति के सम्बन्ध पर विचार करता है।\n\nऐसा साथ चुनना जो प्रश्न पूछने, सीखने और ईमानदारी से जीने में मदद करे, इस शिक्षा का दैनिक उपयोग हो सकता है। शांत होकर पढ़ना, समझना और अपने व्यवहार पर लौटना—यह हमारी संपादकीय दिशा है; कोई तत्काल मोक्ष का वादा नहीं।", "meaningEn": "For this reading, loosening attachment is not an invitation to abandon responsibilities. A useful reflection is to notice the grip of “everything must be mine” and examine it. The source itself connects possessiveness with bondage and knowledge with freedom.\n\nChoosing company that supports learning, honest questions and thoughtful conduct is one way to apply the teaching. Reading quietly, understanding what is read and returning to one’s own behaviour form our editorial suggestion. This is not a promise of instant liberation.", "artId": "cover"}]}, {"chapter": 5, "id": "babhruvahana", "titleHi": "बभ्रुवाहन और प्रेत सुदेव", "titleEn": "Babhruvahana and Sudeva", "kind": "story", "artId": "babhruvahana", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/507", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/508", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/509", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/510", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/511"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.9.1", "2.9.2", "2.9.3", "2.9.4", "2.9.5", "2.9.6", "2.9.7", "2.9.12", "2.9.13", "2.9.14", "2.9.15", "2.9.16", "2.9.17", "2.9.18", "2.9.19", "2.9.20", "2.9.21", "2.9.22", "2.9.23", "2.9.24", "2.9.25", "2.9.26", "2.9.30", "2.9.31", "2.9.32", "2.9.33", "2.9.34", "2.9.35", "2.9.36", "2.9.37", "2.9.38", "2.9.39", "2.9.40", "2.9.41", "2.9.42", "2.9.43", "2.9.44", "2.9.45", "2.9.46", "2.9.47", "2.9.48", "2.9.49", "2.9.50", "2.9.51", "2.9.52", "2.9.70", "2.9.71", "2.9.72", "2.9.73", "2.9.74"], "sanskritFileSha256": "d1a4aa74e4dd159eb220deb11379fa42a5b0349f2f943cbebd8e690c9f60a7d4", "hindiSourcePages": [507, 508, 509, 510, 511], "hindiFragmentSha256": "7566c980bd1ebf64a049d1d18ed5c7212cb9723cc08b85fb078d869d68803dcb", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "The wider Purana describes Vanga/Krita; Saroddhara VII describes Mahodaya/Treta. The shared narrative is used without combining those settings. This is not the Mahabharata story of Arjuna’s son merely because the king has the same name. Ritual particulars are abridged.", "citeHi": "गरुडपुराण · प्रेतकल्प 9 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 9 · selected passages"}, "verses": [{"id": "babhruvahana-1", "chapter": 5, "number": 1, "titleHi": "वन में हुई भेंट", "titleEn": "An encounter in the forest", "bodyHi": ["एक दिन राजा बभ्रुवाहन शिकार के लिए वन में गए। एक घायल मृग का पीछा करते हुए वे साथियों से दूर निकल आए। थकान और प्यास के बाद उन्हें एक सरोवर मिला। उसके पास वटवृक्ष की छाया में विश्राम करते समय उनका सामना एक व्याकुल प्रेत से हुआ।", "राजा ने केवल भय के कारण उसे दूर नहीं किया। उन्होंने पूछा कि वह कौन है और इस दशा में कैसे पहुँचा। उस प्रेत ने अपना नाम सुदेव बताया। वह अपनी पीड़ा और जीवन का वृत्तान्त राजा के सामने रखने लगा।"], "bodyEn": ["King Babhruvahana went hunting in a forest. While following a wounded deer, he became separated from his companions. Tired and thirsty, he reached a lake and rested near a banyan tree. There he encountered a distressed departed spirit.", "The king did more than react with fear. He asked who the stranger was and how he had come to this condition. The spirit introduced himself as Sudeva and began to explain his life and his suffering."], "meaningHi": "एक दिन राजा बभ्रुवाहन शिकार के लिए वन में गए। एक घायल मृग का पीछा करते हुए वे साथियों से दूर निकल आए। थकान और प्यास के बाद उन्हें एक सरोवर मिला। उसके पास वटवृक्ष की छाया में विश्राम करते समय उनका सामना एक व्याकुल प्रेत से हुआ।\n\nराजा ने केवल भय के कारण उसे दूर नहीं किया। उन्होंने पूछा कि वह कौन है और इस दशा में कैसे पहुँचा। उस प्रेत ने अपना नाम सुदेव बताया। वह अपनी पीड़ा और जीवन का वृत्तान्त राजा के सामने रखने लगा।", "meaningEn": "King Babhruvahana went hunting in a forest. While following a wounded deer, he became separated from his companions. Tired and thirsty, he reached a lake and rested near a banyan tree. There he encountered a distressed departed spirit.\n\nThe king did more than react with fear. He asked who the stranger was and how he had come to this condition. The spirit introduced himself as Sudeva and began to explain his life and his suffering.", "artId": "babhruvahana"}, {"id": "babhruvahana-2", "chapter": 5, "number": 2, "titleHi": "जिसका कोई अपना न था", "titleEn": "Someone without family to help", "bodyHi": ["सुदेव ने बताया कि उसने अपने जीवन में दान और सहायता की थी। पर उसके बाद के संस्कार करने के लिए न परिवार था, न कोई मित्र। पुराण की कथा में वह इसी अभाव से जुड़ी पीड़ा लेकर राजा से सहायता माँगता है।", "राजा उसकी बात सुनकर उसके लिए संस्कार की व्यवस्था करते हैं। कथा में वृषोत्सर्ग का विशेष उल्लेख है। अंत में सुदेव उस पीड़ित दशा से मुक्त होकर राजा का आभार मानता है। यहाँ कथा की मुख्य घटना दी गई है, संस्कार की पूरी विधि नहीं।"], "bodyEn": ["Sudeva says that he had given generously and helped others while alive. Yet there was no family member or friend to undertake the rites after his death. Within the Purana’s account, this absence is connected with his distressed condition, and he asks the king for help.", "The king arranges the rites on his behalf. The account gives particular importance to vrishotsarga, the ritual release of a bull. At the end, Sudeva is released from his troubled condition and thanks the king. This is a summary of the story, not the complete ritual procedure."], "meaningHi": "सुदेव ने बताया कि उसने अपने जीवन में दान और सहायता की थी। पर उसके बाद के संस्कार करने के लिए न परिवार था, न कोई मित्र। पुराण की कथा में वह इसी अभाव से जुड़ी पीड़ा लेकर राजा से सहायता माँगता है।\n\nराजा उसकी बात सुनकर उसके लिए संस्कार की व्यवस्था करते हैं। कथा में वृषोत्सर्ग का विशेष उल्लेख है। अंत में सुदेव उस पीड़ित दशा से मुक्त होकर राजा का आभार मानता है। यहाँ कथा की मुख्य घटना दी गई है, संस्कार की पूरी विधि नहीं।", "meaningEn": "Sudeva says that he had given generously and helped others while alive. Yet there was no family member or friend to undertake the rites after his death. Within the Purana’s account, this absence is connected with his distressed condition, and he asks the king for help.\n\nThe king arranges the rites on his behalf. The account gives particular importance to vrishotsarga, the ritual release of a bull. At the end, Sudeva is released from his troubled condition and thanks the king. This is a summary of the story, not the complete ritual procedure.", "artId": "babhruvahana"}, {"id": "babhruvahana-3", "chapter": 5, "number": 3, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["इस कथा में राजा का दायित्व अपने परिचित लोगों तक सीमित नहीं रहता। वह ऐसे व्यक्ति की बात सुनता है जिसके लिए कोई आगे नहीं आ रहा। किसी अपरिचित की असहायता को देखना और उत्तरदायित्व लेना इसका एक स्पष्ट मानवीय पक्ष है।", "आज के पाठक के लिए यह अकेले या सहारे से वंचित लोगों के प्रति संवेदना का निमंत्रण हो सकता है। यह हमारी व्याख्या है। कथा के पारलौकिक वर्णन को किसी परिवार के शोक या संस्कारों पर भय पैदा करने का आधार न बनाएँ।"], "bodyEn": ["The king’s responsibility in this story extends beyond the people he already knows. He listens to someone for whom nobody else is stepping forward. Noticing a stranger’s helplessness and accepting responsibility are central human features of the episode.", "For a reader today, this can be an invitation to care about people who are alone or without support. That is our editorial interpretation. The story’s account of the afterlife should not be used to frighten a grieving family or judge the rites they were able to perform."], "meaningHi": "इस कथा में राजा का दायित्व अपने परिचित लोगों तक सीमित नहीं रहता। वह ऐसे व्यक्ति की बात सुनता है जिसके लिए कोई आगे नहीं आ रहा। किसी अपरिचित की असहायता को देखना और उत्तरदायित्व लेना इसका एक स्पष्ट मानवीय पक्ष है।\n\nआज के पाठक के लिए यह अकेले या सहारे से वंचित लोगों के प्रति संवेदना का निमंत्रण हो सकता है। यह हमारी व्याख्या है। कथा के पारलौकिक वर्णन को किसी परिवार के शोक या संस्कारों पर भय पैदा करने का आधार न बनाएँ।", "meaningEn": "The king’s responsibility in this story extends beyond the people he already knows. He listens to someone for whom nobody else is stepping forward. Noticing a stranger’s helplessness and accepting responsibility are central human features of the episode.\n\nFor a reader today, this can be an invitation to care about people who are alone or without support. That is our editorial interpretation. The story’s account of the afterlife should not be used to frighten a grieving family or judge the rites they were able to perform.", "artId": "babhruvahana"}]}, {"chapter": 6, "id": "five-pretas", "titleHi": "ब्राह्मण और पाँच प्रेत", "titleEn": "The Brahmin and the five pretas", "kind": "story", "artId": "five-pretas", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/500", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/501", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/502", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/503", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/504", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/505"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.7.1", "2.7.2", "2.7.3", "2.7.4", "2.7.5", "2.7.6", "2.7.7", "2.7.23", "2.7.24", "2.7.25", "2.7.26", "2.7.27", "2.7.28", "2.7.29", "2.7.30", "2.7.43", "2.7.44", "2.7.45", "2.7.46", "2.7.47", "2.7.48", "2.7.49", "2.7.50", "2.7.51", "2.7.52", "2.7.53", "2.7.54", "2.7.55", "2.7.56", "2.7.57", "2.7.58", "2.7.59", "2.7.60", "2.7.61", "2.7.62", "2.7.63", "2.7.64", "2.7.65", "2.7.66", "2.7.67", "2.7.95", "2.7.96", "2.7.97", "2.7.98", "2.7.99", "2.7.100", "2.7.101", "2.7.102"], "sanskritFileSha256": "5fae8130d900fdbd9762948e7e506588580acffea67ddd3c53827b5c99cbffd9", "hindiSourcePages": [500, 501, 502, 503, 504, 505], "hindiFragmentSha256": "ed2ca37bfcaa9eb069780d3f83c335251a720efd2f1bb56be37ca43cf299ff1d", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Santaptaka spelling follows Sanskrit 2.7.2–3 and the Hindi body, not the OCR contents typo. The Sanskrit ending distinguishes the pretas’ heaven from the Brahmin’s Vishnu-world destination; the summary says release without merging them. Violent details are omitted.", "citeHi": "गरुडपुराण · प्रेतकल्प 7 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 7 · selected passages"}, "verses": [{"id": "five-pretas-1", "chapter": 6, "number": 1, "titleHi": "भय से संवाद तक", "titleEn": "From fear to conversation", "bodyHi": ["संतप्तक नाम के एक ब्राह्मण तीर्थयात्रा करते हुए वन में मार्ग भूल गए। वहाँ उनका सामना पाँच प्रेतों से हुआ। आरम्भ में परिस्थिति भयपूर्ण थी। उन्होंने मन से भगवान का स्मरण किया और सहायता की प्रार्थना की।", "कथा में भगवान की उपस्थिति और कृपा से स्थिति बदलती है। आगे ब्राह्मण और प्रेतों के बीच बातचीत होती है। प्रेत पहले के कठोर व्यवहार से हटकर विनम्र होते हैं और अपने पूर्व जीवन की बातें बताने लगते हैं।"], "bodyEn": ["A Brahmin named Santaptaka lost his way in a forest while travelling on pilgrimage. He encountered five pretas, or departed spirits, in a frightening situation. He remembered the Lord inwardly and prayed for help.", "In the story, the Lord’s presence and grace change the course of the encounter. A conversation follows between the Brahmin and the spirits. Their earlier hostility gives way to humility, and they begin to speak about their previous lives."], "meaningHi": "संतप्तक नाम के एक ब्राह्मण तीर्थयात्रा करते हुए वन में मार्ग भूल गए। वहाँ उनका सामना पाँच प्रेतों से हुआ। आरम्भ में परिस्थिति भयपूर्ण थी। उन्होंने मन से भगवान का स्मरण किया और सहायता की प्रार्थना की।\n\nकथा में भगवान की उपस्थिति और कृपा से स्थिति बदलती है। आगे ब्राह्मण और प्रेतों के बीच बातचीत होती है। प्रेत पहले के कठोर व्यवहार से हटकर विनम्र होते हैं और अपने पूर्व जीवन की बातें बताने लगते हैं।", "meaningEn": "A Brahmin named Santaptaka lost his way in a forest while travelling on pilgrimage. He encountered five pretas, or departed spirits, in a frightening situation. He remembered the Lord inwardly and prayed for help.\n\nIn the story, the Lord’s presence and grace change the course of the encounter. A conversation follows between the Brahmin and the spirits. Their earlier hostility gives way to humility, and they begin to speak about their previous lives.", "artId": "five-pretas"}, {"id": "five-pretas-2", "chapter": 6, "number": 2, "titleHi": "अपने कर्मों को पहचानना", "titleEn": "Recognising their actions", "bodyHi": ["पाँचों अपने आचरण के अलग-अलग प्रसंग बताते हैं। इनमें अतिथि का अपमान, प्यासे के प्रति क्रूरता, विश्वासघात और लोभ जैसे कर्म आते हैं। उनकी बातों में यह स्वीकार होता है कि उन्होंने दूसरों को कष्ट पहुँचाया था।", "अंत में भगवान प्रकट होते हैं। यह कथा सत्संग और भगवत्कृपा से मुक्ति का वर्णन करती है। हमने उसके हिंसक विवरणों को छोड़कर संवाद, अपने कर्मों की पहचान और उद्धार के प्रसंग को चुना है।"], "bodyEn": ["The five spirits describe different episodes from their lives. Their accounts include insulting a guest, cruelty towards someone who was thirsty, betrayal and greed. They acknowledge actions through which they caused suffering to others.", "The Lord reveals himself at the close of the episode. The story attributes release to good company and divine grace. This selection leaves out the graphic violence and focuses on the conversation, recognition of harmful conduct and the account of release."], "meaningHi": "पाँचों अपने आचरण के अलग-अलग प्रसंग बताते हैं। इनमें अतिथि का अपमान, प्यासे के प्रति क्रूरता, विश्वासघात और लोभ जैसे कर्म आते हैं। उनकी बातों में यह स्वीकार होता है कि उन्होंने दूसरों को कष्ट पहुँचाया था।\n\nअंत में भगवान प्रकट होते हैं। यह कथा सत्संग और भगवत्कृपा से मुक्ति का वर्णन करती है। हमने उसके हिंसक विवरणों को छोड़कर संवाद, अपने कर्मों की पहचान और उद्धार के प्रसंग को चुना है।", "meaningEn": "The five spirits describe different episodes from their lives. Their accounts include insulting a guest, cruelty towards someone who was thirsty, betrayal and greed. They acknowledge actions through which they caused suffering to others.\n\nThe Lord reveals himself at the close of the episode. The story attributes release to good company and divine grace. This selection leaves out the graphic violence and focuses on the conversation, recognition of harmful conduct and the account of release.", "artId": "five-pretas"}, {"id": "five-pretas-3", "chapter": 6, "number": 3, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["गलती स्वीकार करना और उसके कारण हुए दुःख को समझना परिवर्तन की शुरुआत हो सकती है। किसी की सहायता, किसी विश्वसनीय व्यक्ति का साथ और अपने भीतर ईमानदारी—इन पर विचार करने का अवसर यह कथा देती है।", "पुराण में उद्धार का आधार सत्संग और भगवान की कृपा है। आधुनिक जीवन में क्षमा माँगना या हानि की भरपाई करना हमारी व्याख्या के उदाहरण हैं। इन्हें मूल कथा का छूटा हुआ संवाद या किसी निश्चित फल की गारंटी न समझें।"], "bodyEn": ["Acknowledging wrongdoing and understanding the suffering it caused can be a beginning of change. The story offers room to reflect on honest self-examination and the help that can come through trustworthy company.", "In the Purana, release is attributed to good company and the Lord’s grace. Apologising or repairing harm are examples in our present-day interpretation. They are not additional dialogue from the story, nor a guarantee of a particular spiritual outcome."], "meaningHi": "गलती स्वीकार करना और उसके कारण हुए दुःख को समझना परिवर्तन की शुरुआत हो सकती है। किसी की सहायता, किसी विश्वसनीय व्यक्ति का साथ और अपने भीतर ईमानदारी—इन पर विचार करने का अवसर यह कथा देती है।\n\nपुराण में उद्धार का आधार सत्संग और भगवान की कृपा है। आधुनिक जीवन में क्षमा माँगना या हानि की भरपाई करना हमारी व्याख्या के उदाहरण हैं। इन्हें मूल कथा का छूटा हुआ संवाद या किसी निश्चित फल की गारंटी न समझें।", "meaningEn": "Acknowledging wrongdoing and understanding the suffering it caused can be a beginning of change. The story offers room to reflect on honest self-examination and the help that can come through trustworthy company.\n\nIn the Purana, release is attributed to good company and the Lord’s grace. Apologising or repairing harm are examples in our present-day interpretation. They are not additional dialogue from the story, nor a guarantee of a particular spiritual outcome.", "artId": "five-pretas"}]}, {"chapter": 7, "id": "viravahana", "titleHi": "राजा वीरवाहन की कथा", "titleEn": "The story of King Viravahana", "kind": "story", "artId": "viravahana", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/493", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/494", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/495", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/496", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/497", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/498", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/499", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/500"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.6.4", "2.6.5", "2.6.6", "2.6.7", "2.6.8", "2.6.9", "2.6.10", "2.6.11", "2.6.130", "2.6.131", "2.6.132", "2.6.133", "2.6.134", "2.6.135", "2.6.136", "2.6.137", "2.6.138", "2.6.139", "2.6.140", "2.6.141", "2.6.142", "2.6.143", "2.6.144"], "sanskritFileSha256": "00dc13bf199e0ec3c33502212eff3fdf935355c7fefbf44c3fb0a32ad09c4ec1", "hindiSourcePages": [493, 494, 495, 496, 497, 498, 499, 500], "hindiFragmentSha256": "1c401781342fd858c961c67b1b1659b3c1b4e513e84f2b22fd82e01212761a68", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Keeps the ritual-specific narrative: Vasishtha, Mathura and vrishotsarga. Omits the chapter’s embedded Narada narrative and procedural details. Does not replace the named rite with a generic donation or recommend releasing animals without care.", "citeHi": "गरुडपुराण · प्रेतकल्प 6 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 6 · selected passages"}, "verses": [{"id": "viravahana-1", "chapter": 7, "number": 1, "titleHi": "राजा की चिंता", "titleEn": "The king’s concern", "bodyHi": ["राजा वीरवाहन धर्म और दान में रुचि रखते थे। फिर भी यम और मृत्यु के बाद की गति की बातें सुनकर उनके मन में भय था। एक दिन वन में वे ऋषि वसिष्ठ के आश्रम पहुँचे और विनम्र होकर अपनी चिंता कही।", "राजा ने पूछा कि सही मार्ग क्या है। वसिष्ठ ने धर्म के अनेक रूपों का उल्लेख किया और इस प्रसंग में वृषोत्सर्ग का महत्त्व समझाया। यह एक विशेष धार्मिक संस्कार है; कथा इसे सामान्य दान का दूसरा नाम नहीं कहती।"], "bodyEn": ["King Viravahana practised giving and religious duties, but accounts of Yama and the journey after death still troubled him. While in the forest, he visited the hermitage of the sage Vasishtha and respectfully explained his concern.", "The king asked for guidance. Vasishtha spoke of several forms of religious practice and, in this particular account, emphasised vrishotsarga. This is a specific rite involving the release of a bull; the story does not simply use the word as another name for ordinary charity."], "meaningHi": "राजा वीरवाहन धर्म और दान में रुचि रखते थे। फिर भी यम और मृत्यु के बाद की गति की बातें सुनकर उनके मन में भय था। एक दिन वन में वे ऋषि वसिष्ठ के आश्रम पहुँचे और विनम्र होकर अपनी चिंता कही।\n\nराजा ने पूछा कि सही मार्ग क्या है। वसिष्ठ ने धर्म के अनेक रूपों का उल्लेख किया और इस प्रसंग में वृषोत्सर्ग का महत्त्व समझाया। यह एक विशेष धार्मिक संस्कार है; कथा इसे सामान्य दान का दूसरा नाम नहीं कहती।", "meaningEn": "King Viravahana practised giving and religious duties, but accounts of Yama and the journey after death still troubled him. While in the forest, he visited the hermitage of the sage Vasishtha and respectfully explained his concern.\n\nThe king asked for guidance. Vasishtha spoke of several forms of religious practice and, in this particular account, emphasised vrishotsarga. This is a specific rite involving the release of a bull; the story does not simply use the word as another name for ordinary charity.", "artId": "viravahana"}, {"id": "viravahana-2", "chapter": 7, "number": 2, "titleHi": "मार्गदर्शन और आचरण", "titleEn": "Guidance followed by action", "bodyHi": ["वसिष्ठ की बात सुनकर राजा मथुरा गए और बताए गए संस्कार का अनुष्ठान किया। कथा आगे उनके जीवन के अंत का वर्णन करती है। धर्मराज उन्हें सम्मान देते हैं और उनके दान, यज्ञ तथा वृषोत्सर्ग का उल्लेख करते हैं।", "कथा का समापन राजा की शुभ गति के वर्णन से होता है। यह उस धार्मिक परम्परा का कथन है। इस संक्षिप्त पाठ में अनुष्ठान का महत्त्व सुरक्षित रखा गया है, लेकिन उसकी पूरी विधि और अध्याय की दूसरी कथाएँ सम्मिलित नहीं हैं।"], "bodyEn": ["After hearing Vasishtha, the king went to Mathura and performed the rite. The narrative then moves to the end of his life. Dharmaraja receives him honourably and mentions his giving, sacrifices and vrishotsarga.", "The story closes with an account of the king reaching a blessed destination. This is the claim made within the religious narrative. Our short reading preserves the rite’s place in that account, while leaving out its detailed procedure and the chapter’s other embedded stories."], "meaningHi": "वसिष्ठ की बात सुनकर राजा मथुरा गए और बताए गए संस्कार का अनुष्ठान किया। कथा आगे उनके जीवन के अंत का वर्णन करती है। धर्मराज उन्हें सम्मान देते हैं और उनके दान, यज्ञ तथा वृषोत्सर्ग का उल्लेख करते हैं।\n\nकथा का समापन राजा की शुभ गति के वर्णन से होता है। यह उस धार्मिक परम्परा का कथन है। इस संक्षिप्त पाठ में अनुष्ठान का महत्त्व सुरक्षित रखा गया है, लेकिन उसकी पूरी विधि और अध्याय की दूसरी कथाएँ सम्मिलित नहीं हैं।", "meaningEn": "After hearing Vasishtha, the king went to Mathura and performed the rite. The narrative then moves to the end of his life. Dharmaraja receives him honourably and mentions his giving, sacrifices and vrishotsarga.\n\nThe story closes with an account of the king reaching a blessed destination. This is the claim made within the religious narrative. Our short reading preserves the rite’s place in that account, while leaving out its detailed procedure and the chapter’s other embedded stories.", "artId": "viravahana"}, {"id": "viravahana-3", "chapter": 7, "number": 3, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["वीरवाहन केवल भय में उलझे नहीं रहते। वे प्रश्न पूछते हैं, किसी जानकार का मार्गदर्शन सुनते हैं और विचार को आचरण से जोड़ते हैं। समझ की ओर बढ़ना इस कथा से निकाली गई हमारी सरल सीख है।", "वृषोत्सर्ग का उल्लेख स्वयं पशु छोड़ देने का निर्देश नहीं है। यह पाठ विधि-संग्रह नहीं है। किसी संस्कार का अभ्यास परिवार की परम्परा, योग्य मार्गदर्शन और पशु की देखभाल जैसी वास्तविक जिम्मेदारियों के साथ अलग विषय है।"], "bodyEn": ["Viravahana does not remain caught in fear alone. He asks questions, listens to someone he regards as knowledgeable and connects guidance with conduct. Moving from anxiety towards understanding is our simple editorial takeaway.", "Mentioning vrishotsarga is not an instruction to abandon an animal. This reading is not a ritual manual. Any actual observance belongs in the context of a family’s tradition, qualified guidance and practical responsibilities, including the animal’s care."], "meaningHi": "वीरवाहन केवल भय में उलझे नहीं रहते। वे प्रश्न पूछते हैं, किसी जानकार का मार्गदर्शन सुनते हैं और विचार को आचरण से जोड़ते हैं। समझ की ओर बढ़ना इस कथा से निकाली गई हमारी सरल सीख है।\n\nवृषोत्सर्ग का उल्लेख स्वयं पशु छोड़ देने का निर्देश नहीं है। यह पाठ विधि-संग्रह नहीं है। किसी संस्कार का अभ्यास परिवार की परम्परा, योग्य मार्गदर्शन और पशु की देखभाल जैसी वास्तविक जिम्मेदारियों के साथ अलग विषय है।", "meaningEn": "Viravahana does not remain caught in fear alone. He asks questions, listens to someone he regards as knowledgeable and connects guidance with conduct. Moving from anxiety towards understanding is our simple editorial takeaway.\n\nMentioning vrishotsarga is not an instruction to abandon an animal. This reading is not a ritual manual. Any actual observance belongs in the context of a family’s tradition, qualified guidance and practical responsibilities, including the animal’s care.", "artId": "viravahana"}]}, {"chapter": 8, "id": "sita-ancestors", "titleHi": "सीता और पितरों का दर्शन", "titleEn": "Sita’s vision of the ancestors", "kind": "story", "artId": "sita-ancestors", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/511", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/512", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/513", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/514", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/515", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/516"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.10.1", "2.10.2", "2.10.3", "2.10.4", "2.10.5", "2.10.6", "2.10.7", "2.10.8", "2.10.9", "2.10.10", "2.10.31", "2.10.32", "2.10.33", "2.10.34", "2.10.35", "2.10.36", "2.10.37", "2.10.38", "2.10.39", "2.10.40", "2.10.41", "2.10.42", "2.10.43", "2.10.44", "2.10.45", "2.10.46", "2.10.47", "2.10.48", "2.10.49"], "sanskritFileSha256": "12ab9a49039f423efaff042c78b4f8ce7870ff28e058c57dd82130ce96214664", "hindiSourcePages": [511, 512, 513, 514, 515, 516], "hindiFragmentSha256": "357b7780d6c02bd5ccb38fc0cd72ad595ffaf080d0bc4b265242bdf450f8e174", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Pushkar episode in Garuda Purana 2.10, not the separate popular Gaya sand-pinda story and not attributed to Valmiki Ramayan. Retains Sita’s actual explanation: recognition of Dasharatha and two ancestors, modest forest clothing and simple food.", "citeHi": "गरुडपुराण · प्रेतकल्प 10 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 10 · selected passages"}, "verses": [{"id": "sita-ancestors-1", "chapter": 8, "number": 1, "titleHi": "पुष्कर का प्रसंग", "titleEn": "The episode at Pushkar", "bodyHi": ["गरुड़ पूछते हैं कि श्राद्ध में दिया गया अन्न पितरों तक कैसे पहुँचता है। उत्तर में भगवान एक प्रसंग सुनाते हैं। वनवास के समय राम और सीता पुष्कर पहुँचे। राम ने श्राद्ध के लिए ऋषियों को आमन्त्रित किया और सीता ने वन के फलों से भोजन तैयार किया।", "सीता भोजन परोसने आईं, पर अतिथियों के पास पहुँचकर अचानक एक ओर हट गईं। राम ने स्वयं अतिथियों को भोजन कराया। उनके चले जाने के बाद उन्होंने सीता से पूछा कि वे बीच में क्यों हट गई थीं।"], "bodyEn": ["Garuda asks how an ancestral offering can reach those who have died. In reply, the Lord tells an episode about Rama and Sita visiting Pushkar during their forest exile. Rama invited sages for shraddha, and Sita prepared food from forest fruit.", "Sita came forward to serve, but withdrew after approaching the guests. Rama served them himself. When the guests had left, he asked Sita why she had stepped away."], "meaningHi": "गरुड़ पूछते हैं कि श्राद्ध में दिया गया अन्न पितरों तक कैसे पहुँचता है। उत्तर में भगवान एक प्रसंग सुनाते हैं। वनवास के समय राम और सीता पुष्कर पहुँचे। राम ने श्राद्ध के लिए ऋषियों को आमन्त्रित किया और सीता ने वन के फलों से भोजन तैयार किया।\n\nसीता भोजन परोसने आईं, पर अतिथियों के पास पहुँचकर अचानक एक ओर हट गईं। राम ने स्वयं अतिथियों को भोजन कराया। उनके चले जाने के बाद उन्होंने सीता से पूछा कि वे बीच में क्यों हट गई थीं।", "meaningEn": "Garuda asks how an ancestral offering can reach those who have died. In reply, the Lord tells an episode about Rama and Sita visiting Pushkar during their forest exile. Rama invited sages for shraddha, and Sita prepared food from forest fruit.\n\nSita came forward to serve, but withdrew after approaching the guests. Rama served them himself. When the guests had left, he asked Sita why she had stepped away.", "artId": "sita-ancestors"}, {"id": "sita-ancestors-2", "chapter": 8, "number": 2, "titleHi": "सीता ने क्या देखा", "titleEn": "What Sita saw", "bodyHi": ["सीता ने कहा कि उन्हें अतिथियों में महाराज दशरथ और दो अन्य पूर्वजों के दर्शन हुए थे। वे स्वयं वन के साधारण वस्त्र पहने हुए थीं। उन्हें संकोच हुआ कि राजसी सम्मान पाने वाले इन बड़ों के सामने वे इस रूप में कैसे आएँ और इतना साधारण भोजन कैसे परोसें।", "इस प्रसंग का उपयोग पुराण यह समझाने के लिए करता है कि श्राद्ध केवल दिखाई देने वाले अतिथियों तक सीमित नहीं माना जाता। कथा में उनके माध्यम से पितरों की उपस्थिति का वर्णन है। यह गरुडपुराण का पुष्कर वाला प्रसंग है।"], "bodyEn": ["Sita said she had seen King Dasharatha and two other ancestors among the guests. Wearing the plain clothing of forest life, she felt shy before elders accustomed to royal honour. She also hesitated over offering them such simple food.", "The Purana uses this episode to explain its belief that shraddha reaches beyond the guests who are visibly present. The ancestors are described as present through them. This is the Pushkar episode told in the Garuda Purana."], "meaningHi": "सीता ने कहा कि उन्हें अतिथियों में महाराज दशरथ और दो अन्य पूर्वजों के दर्शन हुए थे। वे स्वयं वन के साधारण वस्त्र पहने हुए थीं। उन्हें संकोच हुआ कि राजसी सम्मान पाने वाले इन बड़ों के सामने वे इस रूप में कैसे आएँ और इतना साधारण भोजन कैसे परोसें।\n\nइस प्रसंग का उपयोग पुराण यह समझाने के लिए करता है कि श्राद्ध केवल दिखाई देने वाले अतिथियों तक सीमित नहीं माना जाता। कथा में उनके माध्यम से पितरों की उपस्थिति का वर्णन है। यह गरुडपुराण का पुष्कर वाला प्रसंग है।", "meaningEn": "Sita said she had seen King Dasharatha and two other ancestors among the guests. Wearing the plain clothing of forest life, she felt shy before elders accustomed to royal honour. She also hesitated over offering them such simple food.\n\nThe Purana uses this episode to explain its belief that shraddha reaches beyond the guests who are visibly present. The ancestors are described as present through them. This is the Pushkar episode told in the Garuda Purana.", "artId": "sita-ancestors"}, {"id": "sita-ancestors-3", "chapter": 8, "number": 3, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["इस कथा में भोजन के साथ सम्बन्ध और आदर जुड़े हैं। किसी प्रिय पूर्वज को स्मरण करते समय साधारण वस्तु भी गहरे भाव का माध्यम बन सकती है। यह उसका आज के पाठक के लिए निकाला गया अर्थ है।", "इसे गया में सीता द्वारा बालू के पिण्ड देने वाली दूसरी प्रचलित कथा के साथ न मिलाएँ। दोनों का स्थान और घटनाक्रम अलग है। यहाँ उद्देश्य इस विशेष प्रसंग को उसके अपने स्रोत के साथ समझना है।"], "bodyEn": ["The story connects a meal with relationship and respect. In remembering someone dear, a simple offering can carry a depth of feeling beyond its material value. This is the reflection we draw for a reader today.", "This episode should not be combined with the separate popular story of Sita offering sand pindas at Gaya. Their locations and events differ. Here the aim is to understand this particular telling together with its own source."], "meaningHi": "इस कथा में भोजन के साथ सम्बन्ध और आदर जुड़े हैं। किसी प्रिय पूर्वज को स्मरण करते समय साधारण वस्तु भी गहरे भाव का माध्यम बन सकती है। यह उसका आज के पाठक के लिए निकाला गया अर्थ है।\n\nइसे गया में सीता द्वारा बालू के पिण्ड देने वाली दूसरी प्रचलित कथा के साथ न मिलाएँ। दोनों का स्थान और घटनाक्रम अलग है। यहाँ उद्देश्य इस विशेष प्रसंग को उसके अपने स्रोत के साथ समझना है।", "meaningEn": "The story connects a meal with relationship and respect. In remembering someone dear, a simple offering can carry a depth of feeling beyond its material value. This is the reflection we draw for a reader today.\n\nThis episode should not be combined with the separate popular story of Sita offering sand pindas at Gaya. Their locations and events differ. Here the aim is to understand this particular telling together with its own source.", "artId": "sita-ancestors"}]}, {"chapter": 9, "id": "shraddha", "titleHi": "श्राद्ध का परिचय", "titleEn": "Understanding shraddha", "kind": "tradition", "artId": "ancestors", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/181", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/182", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/183", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/184"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["1.99.1", "1.99.2", "1.99.3", "1.99.4", "1.99.5", "1.99.6", "1.99.12", "1.99.13", "1.99.14", "1.99.15", "1.99.16", "1.99.17", "1.99.18", "1.99.19", "1.99.20", "1.99.21", "1.99.22", "1.99.23", "1.99.24", "1.99.25", "1.99.26", "1.99.27", "1.99.28", "1.99.40", "1.99.41", "1.99.42"], "sanskritFileSha256": "a4a47cc968db31955727426b26d21ff45dcdaa4d49e42b66d0d5f68157ea7336", "hindiSourcePages": [181, 182, 183, 184], "hindiFragmentSha256": "456bdd5f6fe8f8b6a865de16a23a4d9850c57078b56dd1703379034c6125dbd4", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Educational introduction to selected ingredients and occasions, not a universal ritual prescription. Omits recipient exclusions, caste hierarchy and guaranteed rewards. Regional and lineage variations remain explicit.", "citeHi": "गरुडपुराण · आचारकाण्ड 99 · चयनित प्रसंग", "citeEn": "Garuda Purana · Achara chapter 99 · selected passages"}, "verses": [{"id": "shraddha-1", "chapter": 9, "number": 1, "titleHi": "पितरों के लिए अर्पण", "titleEn": "An offering for the ancestors", "bodyHi": ["आचारकाण्ड में श्राद्ध के अवसरों और उसके आयोजन का वर्णन है। इसमें पितरों के निमित्त अन्न, जल और अन्य अर्पण, आमन्त्रित अतिथि तथा विधिपूर्वक आदर का स्थान आता है। अमावस्या सहित कई अवसरों का उल्लेख किया गया है।", "इस परम्परा में श्राद्ध को जीवित परिवार और पितरों के सम्बन्ध से जोड़ा जाता है। केवल सामग्री इकट्ठी करना ही उसका पूरा परिचय नहीं है; स्मरण और श्रद्धा उसके अर्थ को समझने की दिशा देते हैं। यहाँ विस्तृत विधि के स्थान पर परिचय चुना गया है।"], "bodyEn": ["The Achara section describes occasions for shraddha and the way it is arranged. Food, water and other offerings for the ancestors, invited guests and respectful observance form part of the account. It names several occasions, including the new moon.", "Within this tradition, shraddha concerns the relationship between the living family and its ancestors. An inventory of materials alone does not convey that meaning. Remembrance and reverence help explain its purpose. This selection is an introduction rather than the detailed procedure."], "meaningHi": "आचारकाण्ड में श्राद्ध के अवसरों और उसके आयोजन का वर्णन है। इसमें पितरों के निमित्त अन्न, जल और अन्य अर्पण, आमन्त्रित अतिथि तथा विधिपूर्वक आदर का स्थान आता है। अमावस्या सहित कई अवसरों का उल्लेख किया गया है।\n\nइस परम्परा में श्राद्ध को जीवित परिवार और पितरों के सम्बन्ध से जोड़ा जाता है। केवल सामग्री इकट्ठी करना ही उसका पूरा परिचय नहीं है; स्मरण और श्रद्धा उसके अर्थ को समझने की दिशा देते हैं। यहाँ विस्तृत विधि के स्थान पर परिचय चुना गया है।", "meaningEn": "The Achara section describes occasions for shraddha and the way it is arranged. Food, water and other offerings for the ancestors, invited guests and respectful observance form part of the account. It names several occasions, including the new moon.\n\nWithin this tradition, shraddha concerns the relationship between the living family and its ancestors. An inventory of materials alone does not convey that meaning. Remembrance and reverence help explain its purpose. This selection is an introduction rather than the detailed procedure.", "artId": "ancestors"}, {"id": "shraddha-2", "chapter": 9, "number": 2, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["श्राद्ध को समझने की शुरुआत इस प्रश्न से हो सकती है कि परिवार अपने पूर्वजों को किस भाव से याद करता है। उनके प्रति आदर, उनके जीवन का स्मरण और मिली हुई देखभाल के लिए कृतज्ञता—ये इसके अर्थ से जुड़ने के सरल रास्ते हैं।", "तिथि, क्रम, अधिकारी और सामग्री के व्यवहार में परिवार, क्षेत्र और परम्परा के अनुसार भेद हो सकते हैं। इस परिचय को सबके लिए एक समान विधि न मानें। अनुष्ठान के समय अपनी परम्परा के जानकार व्यक्ति से मार्गदर्शन लेना अलग कदम है।"], "bodyEn": ["A simple starting point is to ask how a family remembers those who came before it. Respect, recollection of their lives and gratitude for care received offer accessible ways to approach the meaning of the tradition.", "The date, sequence, participants and materials used in practice can differ by family, region and lineage. This introduction should not be treated as one procedure for everyone. Guidance about an actual observance belongs with someone knowledgeable about the family’s tradition."], "meaningHi": "श्राद्ध को समझने की शुरुआत इस प्रश्न से हो सकती है कि परिवार अपने पूर्वजों को किस भाव से याद करता है। उनके प्रति आदर, उनके जीवन का स्मरण और मिली हुई देखभाल के लिए कृतज्ञता—ये इसके अर्थ से जुड़ने के सरल रास्ते हैं।\n\nतिथि, क्रम, अधिकारी और सामग्री के व्यवहार में परिवार, क्षेत्र और परम्परा के अनुसार भेद हो सकते हैं। इस परिचय को सबके लिए एक समान विधि न मानें। अनुष्ठान के समय अपनी परम्परा के जानकार व्यक्ति से मार्गदर्शन लेना अलग कदम है।", "meaningEn": "A simple starting point is to ask how a family remembers those who came before it. Respect, recollection of their lives and gratitude for care received offer accessible ways to approach the meaning of the tradition.\n\nThe date, sequence, participants and materials used in practice can differ by family, region and lineage. This introduction should not be treated as one procedure for everyone. Guidance about an actual observance belongs with someone knowledgeable about the family’s tradition.", "artId": "ancestors"}]}, {"chapter": 10, "id": "mourning-rites", "titleHi": "मृत्यु के बाद के संस्कार", "titleEn": "Rites after death", "kind": "tradition", "artId": "ancestors", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/483", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/484", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/485", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/486", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/487", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/488", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/489", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/490", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/491", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/492", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/493"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.5.1", "2.5.2", "2.5.3", "2.5.4", "2.5.5", "2.5.6", "2.5.19", "2.5.20", "2.5.21", "2.5.22", "2.5.23", "2.5.24", "2.5.25", "2.5.26", "2.5.27", "2.5.28", "2.5.29", "2.5.30", "2.5.31", "2.5.32", "2.5.33", "2.5.34", "2.5.35", "2.5.36", "2.5.37", "2.5.44", "2.5.45", "2.5.46", "2.5.47", "2.5.48", "2.5.49", "2.5.50", "2.5.51"], "sanskritFileSha256": "fca306acd45928387117061ae066ec6a7e8d2c1bc419394f58cc2544a72c1919", "hindiSourcePages": [483, 484, 485, 486, 487, 488, 489, 490, 491, 492, 493], "hindiFragmentSha256": "f09beaa9846a0c3d0e4505c39e792a23e4f0f3e173f6e606490c4c76db6cffab", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Selected introduction, not the complete chapter or a thirteen-day timetable. The chapter’s ten-day rites and later observances are distinct; their sequence is not imposed on all families. Grief support is explicitly editorial.", "citeHi": "गरुडपुराण · प्रेतकल्प 5 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 5 · selected passages"}, "verses": [{"id": "mourning-rites-1", "chapter": 10, "number": 1, "titleHi": "संस्कारों का क्रम", "titleEn": "A sequence of observances", "bodyHi": ["प्रेतकल्प का यह अध्याय दाह-संस्कार के बाद के कृत्यों, शोककाल और पिण्डदान की चर्चा करता है। दस दिनों के कुछ अर्पणों और आगे होने वाले श्राद्धों का वर्णन भी आता है। ये पुराण की एक विशिष्ट धार्मिक व्यवस्था के अंग हैं।", "पाठ में अर्पणों को दिवंगत की आगे की यात्रा से जोड़ा गया है। यह उस परम्परा की धार्मिक मान्यता है। अलग संस्कारों का अपना प्रयोजन और क्रम है; उन्हें मिलाकर एक साधारण “सबके लिए तेरह दिन” की सूची बनाना सही नहीं होगा।"], "bodyEn": ["This Preta chapter discusses observances after cremation, the mourning period and pinda offerings. It describes offerings during ten days as well as subsequent shraddha observances. These belong to a particular religious account in the Purana.", "The text relates the offerings to the onward journey of the departed. That is the tradition’s religious belief. Distinct observances have their own purposes and sequences; they should not be compressed into a single universal “thirteen-day checklist.”"], "meaningHi": "प्रेतकल्प का यह अध्याय दाह-संस्कार के बाद के कृत्यों, शोककाल और पिण्डदान की चर्चा करता है। दस दिनों के कुछ अर्पणों और आगे होने वाले श्राद्धों का वर्णन भी आता है। ये पुराण की एक विशिष्ट धार्मिक व्यवस्था के अंग हैं।\n\nपाठ में अर्पणों को दिवंगत की आगे की यात्रा से जोड़ा गया है। यह उस परम्परा की धार्मिक मान्यता है। अलग संस्कारों का अपना प्रयोजन और क्रम है; उन्हें मिलाकर एक साधारण “सबके लिए तेरह दिन” की सूची बनाना सही नहीं होगा।", "meaningEn": "This Preta chapter discusses observances after cremation, the mourning period and pinda offerings. It describes offerings during ten days as well as subsequent shraddha observances. These belong to a particular religious account in the Purana.\n\nThe text relates the offerings to the onward journey of the departed. That is the tradition’s religious belief. Distinct observances have their own purposes and sequences; they should not be compressed into a single universal “thirteen-day checklist.”", "artId": "ancestors"}, {"id": "mourning-rites-2", "chapter": 10, "number": 2, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["इस परिचय में संस्कारों को दिवंगत के लिए आदर और परिवार के लिए स्मरण के क्रम के रूप में समझ सकते हैं। व्यवहार की विधि अलग से सीखी जाती है। शोक में किसी से सभी बातें तुरंत याद रखने की अपेक्षा करना सहायक नहीं है।", "साथ बैठना, आवश्यक कामों में हाथ बँटाना और बिना दबाव के सुनना शोकग्रस्त परिवार की सहायता के आज के उदाहरण हैं। ये हमारी संपादकीय बातें हैं। किसी छूटी हुई क्रिया के कारण अनिष्ट की निश्चित घोषणा या परिवार को दोष देना इस पाठ का उद्देश्य नहीं है।"], "bodyEn": ["For this introduction, the observances can be approached as a pattern of respect for the departed and remembrance for the family. Their practical procedure is learned separately. Expecting someone in grief to remember every detail at once is not helpful.", "Sitting with a family, helping with necessary tasks and listening without pressure are examples of support today. These are editorial suggestions. This reading does not declare that a missed observance guarantees harm, or assign blame to a grieving family."], "meaningHi": "इस परिचय में संस्कारों को दिवंगत के लिए आदर और परिवार के लिए स्मरण के क्रम के रूप में समझ सकते हैं। व्यवहार की विधि अलग से सीखी जाती है। शोक में किसी से सभी बातें तुरंत याद रखने की अपेक्षा करना सहायक नहीं है।\n\nसाथ बैठना, आवश्यक कामों में हाथ बँटाना और बिना दबाव के सुनना शोकग्रस्त परिवार की सहायता के आज के उदाहरण हैं। ये हमारी संपादकीय बातें हैं। किसी छूटी हुई क्रिया के कारण अनिष्ट की निश्चित घोषणा या परिवार को दोष देना इस पाठ का उद्देश्य नहीं है।", "meaningEn": "For this introduction, the observances can be approached as a pattern of respect for the departed and remembrance for the family. Their practical procedure is learned separately. Expecting someone in grief to remember every detail at once is not helpful.\n\nSitting with a family, helping with necessary tasks and listening without pressure are examples of support today. These are editorial suggestions. This reading does not declare that a missed observance guarantees harm, or assign blame to a grieving family.", "artId": "ancestors"}]}, {"chapter": 11, "id": "yama", "titleHi": "यमराज और कर्मफल", "titleEn": "Yama and the fruits of action", "kind": "tradition", "artId": "yama", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/534", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/535"], "independentSourceFamilies": ["Venkatesvara-Sansknet-GRETIL", "Gita-Press-Hindi-abridgement"], "sanskritReferences": ["2.19.1", "2.19.2", "2.19.3", "2.19.4", "2.19.5", "2.19.6", "2.19.7", "2.19.8", "2.19.9", "2.19.10", "2.19.14", "2.19.15", "2.19.16", "2.19.17", "2.19.18", "2.19.19"], "sanskritFileSha256": "cd58dd178520ab4f818def4ebaa3bad6680e963a963d0a32643ebe76ee650f16", "hindiSourcePages": [534, 535], "hindiFragmentSha256": "00791d78f5f5e89af2fd30b629ce5ee44ca6da3b8534bc550154ca4b6603868f", "verificationNote": "Compared the listed Sanskrit passages with the independently published Hindi abridgement for the limited claims in this editorial reading. GRETIL and SanskritDocuments count as one family. This is not certification of the complete source chapters or of every OCR character. No original verse or published translation is reproduced.", "notes": "Yama as Dharmaraja in a religious narrative. No graphic punishment details, literal geography claims or guaranteed reward from giving. The modern accountability example is editorial.", "citeHi": "गरुडपुराण · प्रेतकल्प 19 · चयनित प्रसंग", "citeEn": "Garuda Purana · Preta chapter 19 · selected passages"}, "verses": [{"id": "yama-1", "chapter": 11, "number": 1, "titleHi": "धर्मराज का रूप", "titleEn": "The figure of Dharmaraja", "bodyHi": ["प्रेतकल्प में यम को धर्मराज भी कहा गया है। उनके लोक में जीव के शुभ और अशुभ कर्मों की चर्चा होती है। चित्रगुप्त का नाम भी इसी प्रसंग में आता है। यह दृश्य मनुष्य के आचरण और उसके फल को कथा के रूप में सामने रखता है।", "पाठ में धर्मराज का अनुभव सभी के लिए एक जैसा नहीं बताया गया है। सत्कर्म करने वाले और दुष्कर्म करने वाले उन्हें अलग रूप में देखते हैं। आगे का अंश मनुष्य जीवन मिलने पर धर्माचरण की ओर लौटता है।"], "bodyEn": ["In the Preta section, Yama is also called Dharmaraja, the king associated with dharma. The account concerns the good and harmful actions of a living being, and Chitragupta appears in this setting. The scene gives narrative form to conduct and its consequences.", "The text describes different experiences of Dharmaraja for those whose actions differ. It then returns to the opportunity for right conduct in human life. The account is being presented here as religious narrative, not as an observed description of a physical place."], "meaningHi": "प्रेतकल्प में यम को धर्मराज भी कहा गया है। उनके लोक में जीव के शुभ और अशुभ कर्मों की चर्चा होती है। चित्रगुप्त का नाम भी इसी प्रसंग में आता है। यह दृश्य मनुष्य के आचरण और उसके फल को कथा के रूप में सामने रखता है।\n\nपाठ में धर्मराज का अनुभव सभी के लिए एक जैसा नहीं बताया गया है। सत्कर्म करने वाले और दुष्कर्म करने वाले उन्हें अलग रूप में देखते हैं। आगे का अंश मनुष्य जीवन मिलने पर धर्माचरण की ओर लौटता है।", "meaningEn": "In the Preta section, Yama is also called Dharmaraja, the king associated with dharma. The account concerns the good and harmful actions of a living being, and Chitragupta appears in this setting. The scene gives narrative form to conduct and its consequences.\n\nThe text describes different experiences of Dharmaraja for those whose actions differ. It then returns to the opportunity for right conduct in human life. The account is being presented here as religious narrative, not as an observed description of a physical place.", "artId": "yama"}, {"id": "yama-2", "chapter": 11, "number": 2, "titleHi": "सरल अर्थ", "titleEn": "Simple meaning", "bodyHi": ["इस वर्णन से निकाला गया सरल विचार है कि कर्म का महत्त्व केवल इस पर निर्भर नहीं कि उसे किसी ने देखा या नहीं। बाहर की प्रशंसा और भीतर की ईमानदारी में अन्तर हो सकता है। अपने काम की जिम्मेदारी लेना इस पर विचार करने का एक रास्ता है।", "इसे आज के जीवन में समझें तो अपने वचन निभाना और बिना निगरानी के भी ईमानदार रहना उदाहरण हो सकते हैं। ये संपादकीय उदाहरण हैं। पाठक को डराने के लिए दण्डों की सूची देना इस चयन का उद्देश्य नहीं है।"], "bodyEn": ["A simple reflection is that an action matters even when nobody happens to see it. Public approval and inward honesty can be different things. Accepting responsibility for what we do offers one way to consider the passage.", "Keeping a promise and acting honestly without supervision are present-day examples. They are editorial applications, not additional claims from the source. This selection focuses on accountability rather than presenting a catalogue of punishments to frighten the reader."], "meaningHi": "इस वर्णन से निकाला गया सरल विचार है कि कर्म का महत्त्व केवल इस पर निर्भर नहीं कि उसे किसी ने देखा या नहीं। बाहर की प्रशंसा और भीतर की ईमानदारी में अन्तर हो सकता है। अपने काम की जिम्मेदारी लेना इस पर विचार करने का एक रास्ता है।\n\nइसे आज के जीवन में समझें तो अपने वचन निभाना और बिना निगरानी के भी ईमानदार रहना उदाहरण हो सकते हैं। ये संपादकीय उदाहरण हैं। पाठक को डराने के लिए दण्डों की सूची देना इस चयन का उद्देश्य नहीं है।", "meaningEn": "A simple reflection is that an action matters even when nobody happens to see it. Public approval and inward honesty can be different things. Accepting responsibility for what we do offers one way to consider the passage.\n\nKeeping a promise and acting honestly without supervision are present-day examples. They are editorial applications, not additional claims from the source. This selection focuses on accountability rather than presenting a catalogue of punishments to frighten the reader.", "artId": "yama"}]}, {"chapter": 12, "id": "vaitarani", "titleHi": "वैतरणी का वर्णन", "titleEn": "The account of Vaitarani", "kind": "tradition", "artId": "vaitarani", "status": "verified", "contentKind": "editorial-summary", "source": {"baseText": "Garuda Purana: SanskritDocuments/GRETIL Venkatesvara recension; Gita Press Sankshipta Garud Puran Hindi abridgement as captured by BharatKosha.", "retrievedOn": "2026-10-12", "verificationLevel": "source-cross-checked-editorial-summary", "referenceUrls": ["https://sanskritdocuments.org/doc_purana/garuDapurANa.html", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/598", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/599", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/600", "https://bharatkosha.org/hi/granth/garuda-puran-gita-press/601"], "independentSourceFami
