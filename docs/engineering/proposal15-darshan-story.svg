<text x="893" y="579.0" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#8A3E0B" font-weight="normal" text-anchor="start">⌃</text>
<text x="563" y="617.0" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#382719" font-weight="normal" text-anchor="start">In the popular legend, Somraj, the</text>
<text x="563" y="644.0" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#382719" font-weight="normal" text-anchor="start">Moon, worshipped Shiva at Prabhas</text>
<text x="563" y="671.0" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#382719" font-weight="normal" text-anchor="start">after Daksha cursed him to wane;</text>
<text x="563" y="698.0" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#382719" font-weight="normal" text-anchor="start">Shiva restored his radiance and the</text>
<text x="563" y="725.0" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#382719" font-weight="normal" text-anchor="start">shrine became Somnath.</text>
<text x="552" y="845.0" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#785A3B" font-weight="normal" text-anchor="start">Existing story expanded; reader scrolled to heading.</text>
<text x="48" y="967" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#382719" font-weight="normal" text-anchor="start">The story action appears only for playback errors with authored story content. Retry and Browse remain.</text>
<text x="48" y="994" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#785A3B" font-weight="normal" text-anchor="start">Native layout, VoiceOver/TalkBack and all language/size combinations still require device verification.</text>
