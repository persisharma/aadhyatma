<text x="85" y="671.0" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#8A3E0B" font-weight="normal" text-anchor="start">Why this temple is sacred</text>
<text x="85" y="703.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#382719" font-weight="normal" text-anchor="start">Somnath stands on the Arabian Sea</text>
<text x="85" y="730.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#382719" font-weight="normal" text-anchor="start">coast and is traditionally revered as</text>
<text x="85" y="757.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#382719" font-weight="normal" text-anchor="start">the first of the twelve Jyotirlingas,</text>
<text x="85" y="784.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#382719" font-weight="normal" text-anchor="start">a symbol of Shiva devotion and</text>
<text x="85" y="811.0" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#382719" font-weight="normal" text-anchor="start">renewal.</text>
