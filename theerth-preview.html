<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Theerth Map — prototype preview</title>
<style>
  /* Design tokens lifted from mobile/src/theme/colors.ts and design.md */
  :root {
    --parchment: #F3E7C9;
    --parchment-soft: #F8EFD6;
    --parchment-deep: #E9D9B1;
    --parchment-highlight: #F6ECD0;
    --parchment-grad-end: #F1E3BF;
    --ink: #2F1E10;
    --ink-soft: #5A3A1E;
    --ink-muted: #8A6A47;
    --saffron: #B8621B;
    --saffron-deep: #8A3E0B;
    --gold: #A67C34;
    --divider: rgba(138, 62, 11, 0.18);
    --saffron-tint: rgba(184, 98, 27, 0.12);
    --card-active-from: #FFF5E0;
    --card-active-to: #F5DEAC;
    --card-thumb-from: #F8D291;
    --card-thumb-to: #E0A255;
    --card-border: rgba(184, 98, 27, 0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #2a1f12;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: var(--ink);
  }

  .stage {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 40px;
    padding: 40px;
  }
  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; }
  }

  .phone {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    aspect-ratio: 9 / 19.5;
    border-radius: 36px;
    background: linear-gradient(180deg, var(--parchment-highlight), var(--parchment-grad-end));
    box-shadow: 0 30px 60px rgba(60, 30, 10, 0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .status-bar {
    height: 32px;
    background: transparent;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 22px 14px;
  }
  .back-btn {
    width: 34px; height: 34px;
    border-radius: 17px;
    background: var(--parchment-soft);
    border: 1px solid var(--divider);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    font-size: 18px;
  }
  .top-title {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
  }
  .top-spacer { width: 34px; height: 34px; }

  /* Pill toggles */
  .toggle-row {
    display: flex;
    justify-content: center;
    padding-bottom: 12px;
  }
  .toggle-group {
    display: inline-flex;
    background: var(--parchment-soft);
    border: 1px solid var(--divider);
    border-radius: 999px;
    padding: 3px;
  }
  .toggle-half {
    min-width: 96px;
    padding: 7px 22px;
    border-radius: 999px;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .toggle-half.active {
    background: var(--saffron-tint);
    color: var(--saffron-deep);
    font-weight: 600;
  }
  .toggle-half.inactive {
    color: var(--ink-muted);
  }
  .toggle-half .hi {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 14px;
  }
  .toggle-half .en {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 13px;
  }

  /* Map area */
  .body {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px 24px;
    text-align: center;
  }
  .map-wrap {
    position: relative;
    margin: 0 auto;
    width: 100%;
    max-width: 300px;
  }
  .map-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .pin {
    position: absolute;
    font-family: 'Noto Serif Devanagari', serif;
    color: var(--saffron-deep);
    font-size: 18px;
    line-height: 1;
    transform: translate(-50%, -50%);
    cursor: pointer;
    text-shadow: 0 1px 0 rgba(243, 231, 201, 0.6);
  }
  .pin:hover .label,
  .pin:focus .label {
    opacity: 1;
    transform: translate(-50%, calc(-100% - 6px));
  }
  .pin .label {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translate(-50%, calc(-100% - 4px));
    background: var(--parchment-soft);
    border: 1px solid var(--divider);
    border-radius: 8px;
    padding: 4px 10px;
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 12px;
    color: var(--ink);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 140ms ease;
  }

  .hint {
    margin-top: 18px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    color: var(--ink-muted);
    font-size: 13px;
  }
  .preview-note {
    margin-top: 8px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    color: var(--ink-muted);
    font-size: 12px;
    opacity: 0.7;
  }

  /* State list view */
  .state-group { margin-bottom: 20px; text-align: left; }
  .state-header {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    color: var(--ink-muted);
    text-transform: uppercase;
    margin: 12px 0 10px;
  }
  .row-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--parchment-soft);
    border: 1px solid var(--divider);
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
  }
  .row-thumb {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--card-thumb-from), var(--card-thumb-to));
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 18px;
    color: var(--parchment-soft);
    flex-shrink: 0;
  }
  .row-text { flex: 1; min-width: 0; }
  .row-name-hi {
    font-family: 'Noto Serif Devanagari', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row-city {
    margin-top: 2px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .row-chev {
    color: var(--saffron);
    font-size: 22px;
    margin-left: 8px;
  }

  /* Labels and frame */
  .frame-label {
    margin: 0 auto 12px;
    text-align: center;
    color: rgba(243, 231, 201, 0.7);
    font-style: italic;
    font-size: 14px;
    max-width: 460px;
  }
  .frame-label strong {
    font-style: normal;
    font-weight: 600;
    color: var(--card-active-from);
  }
  .stage-title {
    text-align: center;
    color: rgba(243, 231, 201, 0.9);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 22px;
    letter-spacing: 0.04em;
    margin: 0 0 28px;
  }
  .stage-title small {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div style="padding: 28px 24px 0;">
    <h1 class="stage-title">
      Theerth — prototype preview
      <small>Same SVG outline, same pin coordinates, same toggle as the React Native build</small>
    </h1>
  </div>
  <div class="stage">
    <!-- ============================================== -->
    <!-- LEFT: MAP VIEW                                 -->
    <!-- ============================================== -->
    <div>
      <div class="frame-label"><strong>Map view</strong> — हिन्दी mode</div>
      <div class="phone">
        <div class="status-bar"></div>
        <div class="top-bar">
          <div class="back-btn">‹</div>
          <div class="top-title">तीर्थ</div>
          <div class="top-spacer"></div>
        </div>

        <div class="toggle-row">
          <div class="toggle-group">
            <div class="toggle-half active"><span class="hi">हिन्दी</span></div>
            <div class="toggle-half inactive"><span class="en">English</span></div>
          </div>
        </div>

        <div class="toggle-row">
          <div class="toggle-group">
            <div class="toggle-half active"><span class="hi">मानचित्र</span></div>
            <div class="toggle-half inactive"><span class="hi">राज्य</span></div>
          </div>
        </div>

        <div class="body">
          <div class="map-wrap" id="map-wrap-hi">
            <svg viewBox="0 0 300 350" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M 52,13 L 103,13 L 114,50 L 145,75 L 207,100 L 290,100 L 269,150 L 248,175 L 217,175 L 197,188 L 186,200 L 135,250 L 124,300 L 93,350 L 83,338 L 62,263 L 52,225 L 31,188 L 0,163 L 21,113 L 62,63 Z"
                fill="none"
                stroke="#8A3E0B"
                stroke-opacity="0.6"
                stroke-width="1.2"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
            </svg>
            <!-- Pins injected by JS so coordinates match the React Native projection exactly -->
          </div>

          <div class="hint">पिन छूकर मंदिर की कथा पढ़ें</div>
          <div class="preview-note">झलक — १२ ज्योतिर्लिङ्ग</div>
        </div>
      </div>
    </div>

    <!-- ============================================== -->
    <!-- RIGHT: STATE LIST VIEW                         -->
    <!-- ============================================== -->
    <div>
      <div class="frame-label"><strong>By-State view</strong> — English mode</div>
      <div class="phone">
        <div class="status-bar"></div>
        <div class="top-bar">
          <div class="back-btn">‹</div>
          <div class="top-title" style="font-family:'Cormorant Garamond', Georgia, serif; font-style:italic; font-weight: 600;">Theerth</div>
          <div class="top-spacer"></div>
        </div>

        <div class="toggle-row">
          <div class="toggle-group">
            <div class="toggle-half inactive"><span class="hi">हिन्दी</span></div>
            <div class="toggle-half active"><span class="en">English</span></div>
          </div>
        </div>

        <div class="toggle-row">
          <div class="toggle-group">
            <div class="toggle-half inactive"><span class="en">Map</span></div>
            <div class="toggle-half active"><span class="en">By State</span></div>
          </div>
        </div>

        <div class="body" id="state-list-body">
          <!-- Rows injected by JS to keep the data identical to mobile/src/data/theerth/jyotirlingas.ts -->
        </div>
      </div>
    </div>
  </div>

<script>
  // --------------------------------------------------------------
  // Mirrored from mobile/src/data/theerth/jyotirlingas.ts
  // Coordinates only — origin-story prose is intentionally absent
  // per RULEBOOK §10.3.
  // --------------------------------------------------------------
  const JYOTIRLINGAS = [
    { id: 'somnath',           nameHi: 'सोमनाथ',          nameEn: 'Somnath',           cityHi: 'वेरावल',     cityEn: 'Veraval',     stateHi: 'गुजरात',         stateEn: 'Gujarat',         lat: 20.888, lng: 70.402 },
    { id: 'mallikarjuna',      nameHi: 'मल्लिकार्जुन',     nameEn: 'Mallikarjuna',      cityHi: 'श्रीशैलम',   cityEn: 'Srisailam',   stateHi: 'आंध्र प्रदेश',   stateEn: 'Andhra Pradesh',  lat: 16.074, lng: 78.869 },
    { id: 'mahakaleshwar',     nameHi: 'महाकालेश्वर',     nameEn: 'Mahakaleshwar',     cityHi: 'उज्जैन',     cityEn: 'Ujjain',      stateHi: 'मध्य प्रदेश',    stateEn: 'Madhya Pradesh',  lat: 23.183, lng: 75.768 },
    { id: 'omkareshwar',       nameHi: 'ओंकारेश्वर',       nameEn: 'Omkareshwar',       cityHi: 'खंडवा',      cityEn: 'Khandwa',     stateHi: 'मध्य प्रदेश',    stateEn: 'Madhya Pradesh',  lat: 22.243, lng: 76.150 },
    { id: 'kedarnath',         nameHi: 'केदारनाथ',         nameEn: 'Kedarnath',         cityHi: 'रुद्रप्रयाग', cityEn: 'Rudraprayag', stateHi: 'उत्तराखंड',      stateEn: 'Uttarakhand',     lat: 30.735, lng: 79.067 },
    { id: 'bhimashankar',      nameHi: 'भीमाशंकर',         nameEn: 'Bhimashankar',      cityHi: 'पुणे',       cityEn: 'Pune',        stateHi: 'महाराष्ट्र',     stateEn: 'Maharashtra',     lat: 19.072, lng: 73.536 },
    { id: 'kashi-vishwanath',  nameHi: 'काशी विश्वनाथ',    nameEn: 'Kashi Vishwanath',  cityHi: 'वाराणसी',    cityEn: 'Varanasi',    stateHi: 'उत्तर प्रदेश',   stateEn: 'Uttar Pradesh',   lat: 25.311, lng: 83.011 },
    { id: 'trimbakeshwar',     nameHi: 'त्र्यंबकेश्वर',    nameEn: 'Trimbakeshwar',     cityHi: 'नाशिक',      cityEn: 'Nashik',      stateHi: 'महाराष्ट्र',     stateEn: 'Maharashtra',     lat: 19.933, lng: 73.531 },
    { id: 'vaidyanath',        nameHi: 'वैद्यनाथ',         nameEn: 'Vaidyanath',        cityHi: 'देवघर',      cityEn: 'Deoghar',     stateHi: 'झारखंड',         stateEn: 'Jharkhand',       lat: 24.492, lng: 86.700 },
    { id: 'nageshwar',         nameHi: 'नागेश्वर',         nameEn: 'Nageshwar',         cityHi: 'द्वारका',    cityEn: 'Dwarka',      stateHi: 'गुजरात',         stateEn: 'Gujarat',         lat: 22.337, lng: 69.081 },
    { id: 'rameshwaram',       nameHi: 'रामेश्वरम्',       nameEn: 'Rameshwaram',       cityHi: 'रामेश्वरम्', cityEn: 'Rameshwaram', stateHi: 'तमिलनाडु',       stateEn: 'Tamil Nadu',      lat:  9.288, lng: 79.317 },
    { id: 'grishneshwar',      nameHi: 'घृष्णेश्वर',       nameEn: 'Grishneshwar',      cityHi: 'औरंगाबाद',   cityEn: 'Aurangabad',  stateHi: 'महाराष्ट्र',     stateEn: 'Maharashtra',     lat: 20.027, lng: 75.180 }
  ];

  // Same projection as IndiaMap.tsx
  const VIEWBOX_W = 300, VIEWBOX_H = 350;
  const LAT_MIN = 8, LAT_MAX = 36, LNG_MIN = 68, LNG_MAX = 97;
  function project(lat, lng) {
    return {
      x: ((lng - LNG_MIN) / (LNG_MAX - LNG_MIN)) * VIEWBOX_W,
      y: ((LAT_MAX - lat) / (LAT_MAX - LAT_MIN)) * VIEWBOX_H
    };
  }

  // Inject pins into the map view
  (function renderPins() {
    const wrap = document.getElementById('map-wrap-hi');
    JYOTIRLINGAS.forEach(t => {
      const { x, y } = project(t.lat, t.lng);
      const pin = document.createElement('div');
      pin.className = 'pin';
      pin.setAttribute('tabindex', '0');
      pin.style.left = (x / VIEWBOX_W * 100) + '%';
      pin.style.top  = (y / VIEWBOX_H * 100) + '%';
      pin.innerHTML = '॥<span class="label">' + t.nameHi + '</span>';
      wrap.appendChild(pin);
    });
  })();

  // Inject the state-grouped list (English mode)
  (function renderStateList() {
    const body = document.getElementById('state-list-body');
    const groups = new Map();
    JYOTIRLINGAS.forEach(t => {
      if (!groups.has(t.stateEn)) groups.set(t.stateEn, []);
      groups.get(t.stateEn).push(t);
    });
    const sorted = Array.from(groups.entries()).sort((a, b) => a[0].localeCompare(b[0]));
    sorted.forEach(([stateEn, temples]) => {
      const stateHi = temples[0].stateHi;
      const section = document.createElement('div');
      section.className = 'state-group';
      section.innerHTML =
        '<div class="state-header">' + stateHi + ' &middot; ' + stateEn + '</div>' +
        temples
          .sort((a, b) => a.nameEn.localeCompare(b.nameEn))
          .map(t =>
            '<a class="row-card" href="#">' +
              '<div class="row-thumb">ॐ</div>' +
              '<div class="row-text">' +
                '<div class="row-name-hi" style="font-family:\'Cormorant Garamond\', Georgia, serif; font-style:italic; font-weight:600;">' + t.nameEn + '</div>' +
                '<div class="row-city">' + t.cityEn + '</div>' +
              '</div>' +
              '<div class="row-chev">›</div>' +
            '</a>'
          ).join('');
      body.appendChild(section);
    });
  })();
</script>
</body>
</html>
